<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#07080f;
  --bg-1:#0b0d17;
  --bg-2:#11142140;
  --panel:#0e111c;
  --panel-2:#141828;
  --ink:#e9ecff;
  --ink-soft:#a0a7c8;
  --ink-dim:#6b7290;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.04);
  --glass-2:rgba(255,255,255,.07);
  --brand:#7c5cff;
  --brand-2:#4f7bff;
  --cyan:#22d3ee;
  --green:#34d399;
  --amber:#fbbf24;
  --rose:#fb7185;
  --grad:linear-gradient(120deg,#7c5cff,#4f7bff 55%,#22d3ee);
  --r-xl:22px; --r-lg:16px; --r-md:11px; --r-sm:8px;
  --shadow:0 22px 60px -22px rgba(0,0,0,.9);
  --shadow-2:0 -12px 40px -14px rgba(0,0,0,.75);
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-en:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --tabh:58px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:.3s;
}
html[data-theme="light"]{
  --bg:#f4f5fb; --bg-1:#ffffff; --panel:#ffffff; --panel-2:#f0f2f9;
  --ink:#121428; --ink-soft:#4a5070; --ink-dim:#7b81a0;
  --line:rgba(10,12,30,.1); --line-2:rgba(10,12,30,.18);
  --glass:rgba(10,12,30,.03); --glass-2:rgba(10,12,30,.06);
  --shadow:0 18px 50px -24px rgba(10,14,40,.4);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.55;
  overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
html[lang=en] body{font-family:var(--font-en)}
h1,h2,h3,h4,h5{margin:0;font-weight:700;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--cyan);text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
canvas{display:block}
img{max-width:100%;display:block}
::selection{background:rgba(124,92,255,.38)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.85em;letter-spacing:-.02em}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:7px;height:7px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   APP SHELL — 100dvh with safe-area awareness
   ============================================================ */
#app{
  position:fixed;inset:0;
  width:100vw;width:100dvw;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding-left:var(--sal);padding-right:var(--sar);
}
@supports not (height:100dvh){ #app{height:100vh} }
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.active{display:flex}

/* ============================================================
   BUTTONS / CHIPS / FIELDS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 16px;border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--line);
  color:var(--ink);font-weight:700;font-size:14px;
  transition:transform .12s var(--ease),background var(--dur),border-color var(--dur);
  user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 30px -12px rgba(124,92,255,.8)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.35);color:#ffc2cb}
.btn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.32);color:#a7f3d0}
.btn.sm{min-height:34px;padding:0 11px;font-size:12.5px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{
  width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--line);color:var(--ink-soft);
  transition:background var(--dur),color var(--dur),transform .12s var(--ease);
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5);color:#cfc3ff}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:34px;padding:0 13px;border-radius:99px;
  background:var(--glass);border:1px solid var(--line);color:var(--ink-soft);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:all var(--dur) var(--ease);
}
.chip.on{background:rgba(124,92,255,.2);border-color:rgba(124,92,255,.45);color:#d6ccff}
.chip .x{opacity:.6;font-size:15px;line-height:1}

.field{display:block;margin-bottom:13px}
.field > span{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;font-weight:600}
.input,.select,.textarea{
  width:100%;min-height:46px;padding:11px 13px;border-radius:var(--r-md);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  font-size:15px;transition:border-color var(--dur),background var(--dur);
}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(124,92,255,.55);outline:none;background:var(--panel)}
.textarea{min-height:94px;resize:vertical;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--ink-dim) 50%),linear-gradient(-45deg,transparent 49%,var(--ink-dim) 50%);background-size:6px 6px,6px 6px;background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-repeat:no-repeat}
html[dir=rtl] .select{background-position:18px 21px,12px 21px}
.row{display:flex;gap:9px}
.row > *{flex:1;min-width:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.tgl{width:48px;height:28px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:background var(--dur)}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-dim);transition:all var(--dur) var(--ease)}
.tgl.on{background:rgba(124,92,255,.35);border-color:rgba(124,92,255,.5)}
.tgl.on::after{inset-inline-start:23px;background:#fff}

.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:var(--r-sm);font-size:12.5px;font-weight:700;color:var(--ink-dim);transition:all var(--dur)}
.seg button.on{background:var(--glass-2);color:var(--ink)}

.searchbar{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:0 13px;min-height:46px}
.searchbar svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px;min-height:44px}
.searchbar input::placeholder{color:var(--ink-dim)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--glass-2);color:var(--ink-soft);letter-spacing:.02em}
.badge.pub{background:rgba(52,211,153,.16);color:#8ceec2}
.badge.priv{background:rgba(251,191,36,.15);color:#fcd77a}
.badge.brand{background:rgba(124,92,255,.2);color:#cdc0ff}
.badge.warn{background:rgba(251,113,133,.16);color:#ffb3bf}

hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.muted{color:var(--ink-dim);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--ink-dim)}
.ttl{font-size:16px;font-weight:800;margin-bottom:10px}
.center-note{text-align:center;padding:38px 20px;color:var(--ink-dim)}
.center-note svg{width:44px;height:44px;margin:0 auto 12px;display:block;opacity:.4;fill:none;stroke:currentColor;stroke-width:1.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-dim)}
.kv span:last-child{font-family:var(--mono);font-size:12px;text-align:end;word-break:break-all}

/* ============================================================
   SHEETS / MODALS / TOASTS
   ============================================================ */
#sheet-root,#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(3,4,10,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:auto}
.scrim.in{opacity:1}
.sheet{
  position:absolute;inset-inline:0;bottom:0;pointer-events:auto;
  background:var(--panel);border-top:1px solid var(--line-2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;
  max-height:min(86dvh,860px);
  padding-bottom:var(--sab);
  transform:translateY(102%);transition:transform .34s var(--ease);
  will-change:transform;
}
.sheet.in{transform:translateY(0)}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:var(--sat)}
.sheet-grip{height:22px;display:grid;place-items:center;flex:0 0 auto;touch-action:none;cursor:grab}
.sheet-grip::before{content:"";width:40px;height:4px;border-radius:99px;background:var(--line-2)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:2px 15px 11px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.sheet-head h3{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 15px calc(16px + var(--sab))}
.sheet-foot{flex:0 0 auto;padding:11px 15px calc(11px + var(--sab));border-top:1px solid var(--line);display:flex;gap:9px;background:var(--panel)}
.sheet-foot .btn{flex:1}
@media (min-width:860px){
  .sheet{inset-inline:auto 0;top:0;bottom:0;width:430px;max-height:none;border-radius:0;border-inline-start:1px solid var(--line-2);transform:translateX(102%);padding-top:var(--sat)}
  html[dir=rtl] .sheet{transform:translateX(-102%)}
  .sheet.in{transform:translateX(0)!important}
  .sheet.full{width:min(780px,72vw)}
}
.modal{
  position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none;
}
.modal-box{
  pointer-events:auto;width:min(440px,100%);max-height:82dvh;overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);
  padding:20px;box-shadow:var(--shadow);
  transform:scale(.94);opacity:0;transition:all var(--dur) var(--ease);
}
.modal-box.in{transform:scale(1);opacity:1}
#toast-root{position:fixed;inset-inline:0;bottom:calc(var(--sab) + 16px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  max-width:440px;background:#181c2e;border:1px solid var(--line-2);color:var(--ink);
  border-radius:var(--r-md);padding:11px 15px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);transform:translateY(14px);opacity:0;transition:all .26s var(--ease);
  display:flex;align-items:center;gap:9px;
}
.toast.in{transform:translateY(0);opacity:1}
.toast.err{border-color:rgba(251,113,133,.5);background:#2a1620}
.toast.ok{border-color:rgba(52,211,153,.45);background:#10241f}
.toast b{flex:0 0 auto}

/* ============================================================
   PLATFORM
   ============================================================ */
#platform{background:radial-gradient(1200px 700px at 50% -10%,rgba(124,92,255,.14),transparent 60%),var(--bg)}
.p-top{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 10px) 15px 10px;
  border-bottom:1px solid var(--line);background:rgba(7,8,15,.7);backdrop-filter:blur(14px);z-index:5;
}
html[data-theme=light] .p-top{background:rgba(255,255,255,.75)}
.brandmark{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brandmark .dot{width:28px;height:28px;border-radius:9px;background:var(--grad);flex:0 0 auto;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(124,92,255,.9)}
.brandmark .dot svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
.brandmark b{font-size:16px;letter-spacing:.04em;font-family:var(--font-en)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#p-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 15px calc(18px + var(--tabh) + var(--sab))}
#p-tabs{
  position:absolute;inset-inline:0;bottom:0;z-index:8;
  display:flex;border-top:1px solid var(--line);
  background:rgba(10,12,22,.92);backdrop-filter:blur(18px);
  padding-bottom:var(--sab);
}
html[data-theme=light] #p-tabs{background:rgba(255,255,255,.93)}
#p-tabs button{
  flex:1;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-dim);font-size:10.5px;font-weight:700;transition:color var(--dur);
}
#p-tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#p-tabs button.on{color:var(--ink)}
#p-tabs button.on svg{stroke:url(#tabgrad);stroke-width:2}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:20px 0 11px}
.sec-head:first-child{margin-top:4px}
.sec-head h2{font-size:18px;flex:1}
.sec-head button{font-size:12.5px;color:var(--cyan);font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gcard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .14s var(--ease),border-color var(--dur);
}
.gcard:active{transform:scale(.975)}
.gcard .cover{aspect-ratio:16/10;background:var(--panel-2);position:relative;overflow:hidden;display:grid;place-items:center}
.gcard .cover img{width:100%;height:100%;object-fit:cover}
.gcard .cover .ph{font-size:30px;opacity:.25}
.gcard .meta{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.gcard .meta b{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .meta .by{font-size:11.5px;color:var(--ink-dim)}
.gcard .stats{display:flex;gap:10px;font-size:11px;color:var(--ink-dim);margin-top:4px}
.gcard .stats span{display:inline-flex;align-items:center;gap:3px}
.hero{
  border-radius:var(--r-xl);padding:20px;margin-bottom:6px;
  background:linear-gradient(140deg,rgba(124,92,255,.22),rgba(34,211,238,.1)),var(--panel);
  border:1px solid var(--line-2);
}
.hero h1{font-size:23px;margin-bottom:8px;letter-spacing:-.02em}
.hero p{color:var(--ink-soft);font-size:13.5px;margin-bottom:15px}
.hero .arch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.hero .arch span{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);font-family:var(--font-en)}

/* ============================================================
   ASSET LIBRARY
   ============================================================ */
.alib-top{position:sticky;top:0;z-index:4;background:var(--panel);padding-bottom:10px;margin:-14px -15px 0;padding-inline:15px;padding-top:14px}
.acards{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));margin-top:12px}
.acard{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.acard .thumb{aspect-ratio:1;background:#0a0c14;position:relative;display:grid;place-items:center;overflow:hidden}
.acard .thumb img{width:100%;height:100%;object-fit:cover}
.acard .thumb .kind{position:absolute;top:6px;inset-inline-start:6px}
.acard .thumb .ph{font-size:26px;opacity:.3}
.acard .ainfo{padding:9px 10px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.acard .ainfo b{font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .ainfo .by{font-size:10.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .ainfo .use{font-size:10px;color:var(--ink-dim);font-family:var(--mono)}
.acard .aact{display:flex;gap:6px;padding:0 10px 10px}
.acard .aact .btn{flex:1;min-height:32px;font-size:11.5px;padding:0 8px}
.skel{background:linear-gradient(90deg,var(--panel-2),var(--glass-2),var(--panel-2));background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:var(--r-lg)}
@keyframes sh{to{background-position:-200% 0}}
#prev3d{width:100%;aspect-ratio:1;border-radius:var(--r-lg);background:#080a12;border:1px solid var(--line);overflow:hidden;touch-action:none;position:relative}
#prev3d canvas{width:100%;height:100%}
.prev-hint{position:absolute;inset-inline:0;bottom:8px;text-align:center;font-size:10.5px;color:var(--ink-dim);pointer-events:none}
.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:26px 16px;text-align:center;
  background:var(--glass);transition:all var(--dur);
}
.drop.hot{border-color:var(--brand);background:rgba(124,92,255,.1)}
.drop svg{width:34px;height:34px;margin:0 auto 9px;display:block;stroke:var(--ink-dim);fill:none;stroke-width:1.5}
.prog{height:5px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:9px}
.prog > i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s linear}

/* ============================================================
   STUDIO — viewport is the centre of gravity
   ============================================================ */
#studio{background:#05060c}
#s-top{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 8px) 12px 8px;
  background:rgba(8,10,18,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:6;
}
#s-top .pname{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#s-top .pname small{display:block;font-size:10px;color:var(--ink-dim);font-weight:500}
#vp-wrap{flex:1;min-height:0;position:relative;background:#05060c;overflow:hidden}
#viewport{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.vp-hud{position:absolute;top:9px;inset-inline-start:11px;font-family:var(--mono);font-size:10px;color:var(--ink-dim);pointer-events:none;line-height:1.6;text-shadow:0 1px 3px #000;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
html[dir=rtl] #s-back svg,html[dir=rtl] .api-ns summary svg{transform:scaleX(-1)}
.sel-bar .nm,.tnode .nm small,.gcard .stats{unicode-bidi:isolate}
.vp-empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:24px}
.vp-empty div{max-width:290px}
.vp-empty b{display:block;font-size:15px;margin-bottom:5px;color:var(--ink-soft)}
.vp-empty p{font-size:12.5px;color:var(--ink-dim);line-height:1.6}
.vp-tools{
  position:absolute;inset-inline-end:11px;top:9px;display:flex;flex-direction:column;gap:7px;
}
.vp-tools .icon-btn{width:38px;height:38px;background:rgba(14,17,28,.85);backdrop-filter:blur(8px)}
.sel-bar{
  position:absolute;inset-inline:11px;bottom:11px;
  background:rgba(14,17,28,.93);backdrop-filter:blur(14px);
  border:1px solid var(--line-2);border-radius:var(--r-lg);
  padding:8px 9px;display:flex;align-items:center;gap:7px;
  box-shadow:var(--shadow);
  transform:translateY(calc(100% + 18px));transition:transform .28s var(--ease);
}
.sel-bar.in{transform:translateY(0)}
.sel-bar .nm{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-bar .nm small{display:block;font-size:10px;color:var(--ink-dim);font-weight:500;font-family:var(--mono)}
.sel-bar .icon-btn{width:36px;height:36px}
#s-tabs{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line);
  background:rgba(10,12,22,.95);backdrop-filter:blur(18px);padding-bottom:var(--sab);z-index:6;
}
#s-tabs button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-dim);font-size:10px;font-weight:700;transition:color var(--dur)}
#s-tabs button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#s-tabs button.on{color:#cfc3ff}
#s-tabs button.on svg{stroke:#a78bfa}

/* hierarchy */
.tree{display:flex;flex-direction:column;gap:2px}
.tnode{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);background:var(--glass);border:1px solid transparent;transition:all var(--dur)}
.tnode.on{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.4)}
.tnode .ic{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;border-radius:6px;background:var(--panel-2);font-size:11px}
.tnode .nm{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .nm small{display:block;font-size:10px;color:var(--ink-dim);font-weight:500;font-family:var(--mono)}
.tnode .eye{opacity:.55;width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.tnode .eye svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* inspector */
.vec3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vec3 label{position:relative;display:block}
.vec3 label i{position:absolute;top:6px;inset-inline-start:9px;font-size:9.5px;font-style:normal;color:var(--ink-dim);font-family:var(--mono);font-weight:700}
.vec3 input{width:100%;min-height:46px;padding:15px 8px 5px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;text-align:center}
.vec3 input:focus{border-color:rgba(124,92,255,.55);outline:none}
.acc{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:9px;overflow:hidden;background:var(--panel-2)}
.acc > summary{padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary::before{content:"▸";font-size:10px;color:var(--ink-dim);transition:transform var(--dur)}
.acc[open] > summary::before{transform:rotate(90deg)}
html[dir=rtl] .acc > summary::before{content:"◂"}
html[dir=rtl] .acc[open] > summary::before{transform:rotate(-90deg)}
.acc .acc-body{padding:0 13px 13px}
.comp-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);background:var(--glass);margin-bottom:6px}
.comp-row b{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================
   CODE EDITOR
   ============================================================ */
.ed-wrap{position:relative;display:flex;flex-direction:column;min-height:0;flex:1;background:#080a12;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ed-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);overflow-x:auto;scrollbar-width:none}
.ed-bar::-webkit-scrollbar{display:none}
.ed-bar .icon-btn{width:34px;height:34px;flex:0 0 auto}
.ed-bar .fname{flex:1;min-width:90px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding-inline:4px;white-space:nowrap}
.ed-scroll{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.ed-inner{position:relative;display:flex;min-height:100%;min-width:100%;width:max-content}
.ed-gutter{
  flex:0 0 auto;padding:10px 8px 60px;text-align:end;user-select:none;
  /* must match .ed-pre metrics exactly or the numbers drift off the lines */
  font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#39405e;
  white-space:pre;min-width:38px;
  background:#0a0c16;border-inline-end:1px solid var(--line);position:sticky;inset-inline-start:0;z-index:2;
  direction:ltr;
}
/* code is always authored left-to-right, whatever the UI language */
.ed-wrap,.ed-scroll,.ed-inner{direction:ltr}
.ed-bar,.ed-find{direction:rtl}
html[lang=en] .ed-bar,html[lang=en] .ed-find{direction:ltr}
.ed-code{position:relative;flex:1;min-width:320px;direction:ltr;text-align:left}
.ed-pre,.ed-ta{
  margin:0;padding:10px 14px 60px;font-family:var(--mono);font-size:12.5px;line-height:1.65;
  white-space:pre;tab-size:2;letter-spacing:0;border:0;
}
.ed-pre{pointer-events:none;color:var(--ink);min-height:100%}
.ed-ta{
  position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;
  caret-color:#a78bfa;resize:none;outline:none;overflow:hidden;
  -webkit-text-fill-color:transparent;
}
.ed-ta::selection{background:rgba(124,92,255,.35);-webkit-text-fill-color:transparent}
.tk-kw{color:#c792ea}.tk-str{color:#c3e88d}.tk-num{color:#f78c6c}
.tk-com{color:#546087;font-style:italic}.tk-fn{color:#82aaff}.tk-op{color:#89ddff}
.tk-cls{color:#ffcb6b}.tk-api{color:#7fdbca;font-weight:600}
.ed-find{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:#0a0c16}
.ed-find input{flex:1;min-height:34px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;font-family:var(--mono);font-size:12px}
.console{
  flex:0 0 auto;max-height:34%;overflow:auto;background:#06070e;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;line-height:1.55;padding:7px 10px;direction:ltr;text-align:left;
}
.console .l{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03);word-break:break-word;white-space:pre-wrap}
.console .l.err{color:#ff9aa8}.console .l.warn{color:#fcd77a}.console .l.ok{color:#8ceec2}
.console .l.sys{color:#5e6688}

/* ============================================================
   AI PANEL
   ============================================================ */
.ai-log{display:flex;flex-direction:column;gap:11px;padding-bottom:6px}
.ai-msg{max-width:92%;padding:11px 13px;border-radius:var(--r-lg);font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-msg.me{align-self:flex-end;background:rgba(124,92,255,.2);border:1px solid rgba(124,92,255,.35)}
.ai-msg.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
.ai-msg.sys{align-self:center;background:transparent;color:var(--ink-dim);font-size:11.5px;text-align:center;max-width:100%}
.ai-patch{margin-top:9px;border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden;background:#080a12}
.ai-patch .ph{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--panel-2);font-size:11.5px;font-weight:700}
.ai-patch pre{margin:0;padding:11px;font-family:var(--mono);font-size:11px;line-height:1.55;overflow-x:auto;color:#cfd6ff;direction:ltr;text-align:left;max-height:240px}
.ai-patch .pa{display:flex;gap:6px;padding:8px 9px;border-top:1px solid var(--line)}
.ai-patch .pa .btn{flex:1;min-height:32px;font-size:11.5px}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;min-height:46px;max-height:130px;padding:12px;border-radius:var(--r-md);background:var(--panel-2);border:1px solid var(--line);resize:none;font-size:14.5px;line-height:1.5}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;font-size:11.5px;padding:7px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--ink-soft)}

/* ============================================================
   API DOCS
   ============================================================ */
.api-ns{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;background:var(--panel-2);overflow:hidden}
.api-ns summary{padding:11px 13px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.api-ns summary::-webkit-details-marker{display:none}
.api-ns summary b{font-family:var(--mono);font-size:13px;color:#7fdbca}
.api-ns summary span{font-size:11.5px;color:var(--ink-dim);flex:1}
.api-m{padding:9px 13px;border-top:1px solid var(--line)}
.api-m code{font-family:var(--mono);font-size:11.5px;color:#82aaff;display:block;margin-bottom:3px;direction:ltr;word-break:break-word}
.api-m p{font-size:11.5px;color:var(--ink-soft)}

/* player */
#player{background:#000}
#player-vp{flex:1;min-height:0;position:relative}
#player-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#player-ui{position:absolute;inset:0;pointer-events:none;padding:calc(var(--sat) + 10px) 12px calc(var(--sab) + 10px)}
#player-ui > *{pointer-events:auto}
.p-exit{position:absolute;top:calc(var(--sat) + 10px);inset-inline-end:12px;z-index:5}
.p-load{position:absolute;inset:0;display:grid;place-items:center;background:#05060c;z-index:9;text-align:center;padding:24px}
.spin{width:30px;height:30px;border:2.5px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.touchpad{position:absolute;width:112px;height:112px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);pointer-events:auto;touch-action:none}
.touchpad i{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3)}
.actbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(124,92,255,.3);border:1.5px solid rgba(180,160,255,.5);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;pointer-events:auto;touch-action:none}

@media (min-width:900px){
  #p-tabs{position:static;flex-direction:column;width:210px;border-top:0;border-inline-end:1px solid var(--line);padding-top:10px}
  #p-tabs button{flex:0 0 auto;min-height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 18px;font-size:13.5px}
  #platform{flex-direction:row}
  .p-main{flex:1;display:flex;flex-direction:column;min-width:0}
  #p-body{padding-bottom:24px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
}
</style>
</head>

<script type="module">
/* ============================================================
   PART 2/8 · UI KIT — DOM, i18n, sheets, modals, toasts, router
   ============================================================ */
const NX = (window.NX = window.NX || {});

/* ---------- DOM ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c == null || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const icon = (name, cls) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  if (cls) s.setAttribute('class', cls);
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#i-' + name);
  s.appendChild(u); return s;
};
const btn = (label, opts = {}) => {
  const b = el('button', { class: 'btn ' + (opts.cls || ''), onclick: opts.onclick, type: 'button' });
  if (opts.icon) b.appendChild(icon(opts.icon));
  if (label) b.appendChild(el('span', { text: label }));
  if (opts.disabled) b.disabled = true;
  return b;
};
const iconBtn = (name, opts = {}) => {
  const b = el('button', { class: 'icon-btn ' + (opts.cls || ''), onclick: opts.onclick, 'aria-label': opts.label || name, type: 'button' });
  b.appendChild(icon(name)); return b;
};

/* ---------- format ---------- */
const fmtNum = n => {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
};
const fmtBytes = b => {
  b = Number(b) || 0;
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
};
const timeAgo = ts => {
  if (!ts) return '—';
  const s = Math.max(1, (Date.now() - ts) / 1000);
  const L = NX.i18n.lang === 'ar'
    ? [[31536e3,'سنة'],[2592e3,'شهر'],[86400,'يوم'],[3600,'ساعة'],[60,'دقيقة'],[1,'ثانية']]
    : [[31536e3,'y'],[2592e3,'mo'],[86400,'d'],[3600,'h'],[60,'m'],[1,'s']];
  for (const [sec, unit] of L) if (s >= sec) {
    const v = Math.floor(s / sec);
    return NX.i18n.lang === 'ar' ? `قبل ${v} ${unit}` : `${v}${unit} ago`;
  }
  return '—';
};
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const debounce = (fn, ms = 260) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- local store ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('nx.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('nx.' + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem('nx.' + k); } catch {} }
};

/* ---------- i18n ---------- */
const DICT = {
  ar: {
    games:'الألعاب', discover:'استكشاف', create:'إنشاء', mygames:'ألعابي', assets:'الأصول', profile:'الحساب',
    search:'بحث', searchAssets:'ابحث في الأصول…', searchGames:'ابحث عن لعبة…', all:'الكل', audio:'صوت', textures:'صور',
    other:'أخرى', add:'إضافة', added:'أُضيف', upload:'رفع', uploadAsset:'رفع أصل', cancel:'إلغاء', save:'حفظ',
    delete:'حذف', close:'إغلاق', apply:'تطبيق', undo:'تراجع', redo:'إعادة', preview:'معاينة', publish:'نشر',
    name:'الاسم', description:'الوصف', category:'الفئة', tags:'الوسوم', license:'الترخيص', visibility:'الظهور',
    public:'عام', private:'خاص', creator:'المنشئ', usage:'الاستخدام', newest:'الأحدث', mostUsed:'الأكثر استخدامًا',
    relevance:'الصلة', scene:'المشهد', code:'الكود', world:'العالم', ai:'الذكاء', more:'المزيد',
    inspector:'الخصائص', hierarchy:'الشجرة', emptyTitle:'عالم فارغ',
    emptyBody:'لا توجد مكتبة مجسمات جاهزة. افتح «الأصول» لرفع مجسماتك أو لإضافة أصل عام من المكتبة، أو افتح «الكود» وابدأ البرمجة.',
    noResults:'لا توجد نتائج', noAssetsYet:'لا توجد أصول بعد — كن أول من يرفع', signIn:'تسجيل الدخول',
    signOut:'خروج', newProject:'مشروع جديد', open:'فتح', play:'تشغيل', plays:'تشغيل', likes:'إعجاب',
    created:'أُنشئ', updated:'حُدّث', position:'الموقع', rotation:'الدوران', scale:'الحجم', components:'المكونات',
    scripts:'السكربتات', addComponent:'إضافة مكون', newScript:'سكربت جديد', run:'تشغيل', apiDocs:'توثيق الـAPI',
    settings:'الإعدادات', local:'محلي', online:'متصل', loading:'تحميل…', confirm:'تأكيد', yes:'نعم', no:'لا'
  },
  en: {
    games:'Games', discover:'Discover', create:'Create', mygames:'My Games', assets:'Assets', profile:'Profile',
    search:'Search', searchAssets:'Search assets…', searchGames:'Search games…', all:'All', audio:'Audio', textures:'Textures',
    other:'Other', add:'ADD', added:'Added', upload:'Upload', uploadAsset:'UPLOAD ASSET', cancel:'Cancel', save:'Save',
    delete:'Delete', close:'Close', apply:'Apply', undo:'Undo', redo:'Redo', preview:'Preview', publish:'Publish',
    name:'Name', description:'Description', category:'Category', tags:'Tags', license:'License', visibility:'Visibility',
    public:'Public', private:'Private', creator:'Creator', usage:'Usage', newest:'Newest', mostUsed:'Most Used',
    relevance:'Relevance', scene:'Scene', code:'Code', world:'World', ai:'AI', more:'More',
    inspector:'Inspector', hierarchy:'Hierarchy', emptyTitle:'Empty world',
    emptyBody:'No bundled model library. Open Assets to upload your own or add a public asset, or open Code and start programming.',
    noResults:'No results', noAssetsYet:'No assets yet — be the first to upload', signIn:'Sign in',
    signOut:'Sign out', newProject:'New project', open:'Open', play:'Play', plays:'plays', likes:'likes',
    created:'Created', updated:'Updated', position:'Position', rotation:'Rotation', scale:'Scale', components:'Components',
    scripts:'Scripts', addComponent:'Add component', newScript:'New script', run:'Run', apiDocs:'API Docs',
    settings:'Settings', local:'Local', online:'Online', loading:'Loading…', confirm:'Confirm', yes:'Yes', no:'No'
  }
};
const i18n = {
  lang: LS.get('lang', 'ar'),
  t(k) { return (DICT[this.lang] && DICT[this.lang][k]) || (DICT.ar[k]) || k; },
  set(l) {
    this.lang = l; LS.set('lang', l);
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    $$('[data-t]').forEach(n => n.textContent = this.t(n.dataset.t));
    window.dispatchEvent(new CustomEvent('nx:lang'));
  }
};
const T = k => i18n.t(k);

/* ---------- theme ---------- */
const theme = {
  get() { return LS.get('theme', 'dark'); },
  set(v) { LS.set('theme', v); document.documentElement.dataset.theme = v; }
};

/* ---------- toast ---------- */
const Toast = {
  show(msg, type = '', ms = 2600) {
    const t = el('div', { class: 'toast ' + type });
    if (type === 'ok') t.appendChild(icon('check'));
    if (type === 'err') t.appendChild(icon('x'));
    t.appendChild(el('span', { text: msg }));
    $('#toast-root').appendChild(t);
    requestAnimationFrame(() => t.classList.add('in'));
    setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 300); }, ms);
    return t;
  },
  ok: (m, ms) => Toast.show(m, 'ok', ms),
  err: (m, ms) => Toast.show(m, 'err', ms || 3600)
};

/* ---------- sheet (bottom sheet on phone, side drawer on desktop) ---------- */
const openSheets = [];
const Sheet = {
  open({ title, body, foot, full = false, id = null, onClose = null, headExtra = null }) {
    if (id) { const ex = openSheets.find(s => s.id === id); if (ex) { ex.close(); } }
    const root = $('#sheet-root');
    root.style.pointerEvents = 'auto';
    const scrim = el('div', { class: 'scrim' });
    const sheet = el('div', { class: 'sheet' + (full ? ' full' : '') });
    const grip = el('div', { class: 'sheet-grip' });
    const head = el('div', { class: 'sheet-head' }, [el('h3', { text: title || '' })]);
    if (headExtra) (Array.isArray(headExtra) ? headExtra : [headExtra]).forEach(n => head.appendChild(n));
    const bodyEl = el('div', { class: 'sheet-body scroll' });
    if (body) bodyEl.appendChild(body);
    sheet.append(grip, head, bodyEl);
    if (foot) { const f = el('div', { class: 'sheet-foot' }); (Array.isArray(foot) ? foot : [foot]).forEach(n => f.appendChild(n)); sheet.appendChild(f); }
    root.append(scrim, sheet);

    const handle = {
      id, el: sheet, body: bodyEl, head,
      setTitle(t) { head.querySelector('h3').textContent = t; },
      close() {
        if (handle._closed) return; handle._closed = true;
        const i = openSheets.indexOf(handle); if (i >= 0) openSheets.splice(i, 1);
        sheet.classList.remove('in'); scrim.classList.remove('in');
        setTimeout(() => {
          sheet.remove(); scrim.remove();
          if (!openSheets.length) root.style.pointerEvents = 'none';
        }, 340);
        onClose && onClose();
      }
    };
    const closeBtn = iconBtn('x', { onclick: () => handle.close(), label: 'close' });
    head.appendChild(closeBtn);
    scrim.addEventListener('click', () => handle.close());

    /* drag-to-dismiss */
    let sy = 0, dy = 0, dragging = false;
    const onDown = e => { dragging = true; sy = (e.touches ? e.touches[0].clientY : e.clientY); dy = 0; sheet.style.transition = 'none'; };
    const onMove = e => {
      if (!dragging) return;
      const y = (e.touches ? e.touches[0].clientY : e.clientY);
      dy = Math.max(0, y - sy);
      if (window.innerWidth < 860) sheet.style.transform = `translateY(${dy}px)`;
    };
    const onUp = () => {
      if (!dragging) return; dragging = false; sheet.style.transition = '';
      if (dy > 110) handle.close(); else sheet.style.transform = '';
    };
    grip.addEventListener('touchstart', onDown, { passive: true });
    grip.addEventListener('touchmove', onMove, { passive: true });
    grip.addEventListener('touchend', onUp);
    grip.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    openSheets.push(handle);
    requestAnimationFrame(() => { sheet.classList.add('in'); scrim.classList.add('in'); });
    return handle;
  },
  closeAll() { [...openSheets].forEach(s => s.close()); },
  top() { return openSheets[openSheets.length - 1] || null; }
};

/* ---------- modal ---------- */
const Modal = {
  open({ title, body, actions = [], dismissable = true }) {
    const root = $('#modal-root');
    root.style.pointerEvents = 'auto';
    const scrim = el('div', { class: 'scrim' });
    const wrap = el('div', { class: 'modal' });
    const box = el('div', { class: 'modal-box' });
    if (title) box.appendChild(el('h3', { text: title, style: { marginBottom: '10px', fontSize: '17px' } }));
    if (body) box.appendChild(typeof body === 'string' ? el('p', { class: 'muted', text: body, style: { fontSize: '13.5px', lineHeight: '1.65' } }) : body);
    const row = el('div', { class: 'row', style: { marginTop: '16px' } });
    const handle = {
      box,
      close() {
        box.classList.remove('in'); scrim.classList.remove('in');
        setTimeout(() => { wrap.remove(); scrim.remove(); root.style.pointerEvents = 'none'; }, 280);
      }
    };
    actions.forEach(a => row.appendChild(btn(a.label, {
      cls: a.cls || '', onclick: () => { const r = a.onclick && a.onclick(handle); if (r !== false) handle.close(); }
    })));
    if (actions.length) box.appendChild(row);
    wrap.appendChild(box); root.append(scrim, wrap);
    if (dismissable) scrim.addEventListener('click', () => handle.close());
    requestAnimationFrame(() => { box.classList.add('in'); scrim.classList.add('in'); });
    return handle;
  },
  confirm(title, msg, okLabel) {
    return new Promise(res => Modal.open({
      title, body: msg, actions: [
        { label: T('cancel'), cls: 'ghost', onclick: () => res(false) },
        { label: okLabel || T('confirm'), cls: 'danger', onclick: () => res(true) }
      ]
    }));
  },
  prompt(title, value = '', placeholder = '') {
    return new Promise(res => {
      const inp = el('input', { class: 'input', value, placeholder });
      Modal.open({
        title, body: inp, actions: [
          { label: T('cancel'), cls: 'ghost', onclick: () => res(null) },
          { label: T('save'), cls: 'primary', onclick: () => res(inp.value.trim()) }
        ]
      });
      setTimeout(() => inp.focus(), 60);
    });
  }
};

/* ---------- screens ---------- */
const Screen = {
  show(name) {
    $$('.screen').forEach(s => s.classList.toggle('active', s.id === name));
    window.dispatchEvent(new CustomEvent('nx:screen', { detail: name }));
  },
  current() { return ($('.screen.active') || {}).id || 'platform'; }
};

/* ---------- keyboard-aware viewport (rule 25) ---------- */
function installViewportFix() {
  const vv = window.visualViewport;
  if (!vv) return;
  const apply = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    document.documentElement.classList.toggle('kb-open', kb > 90);
  };
  vv.addEventListener('resize', apply); vv.addEventListener('scroll', apply); apply();
}

/* ---------- boot-level init ---------- */
document.documentElement.dataset.theme = theme.get();
i18n.set(i18n.lang);
installViewportFix();

Object.assign(NX, { $, $$, el, esc, icon, btn, iconBtn, fmtNum, fmtBytes, timeAgo, uid, clamp, debounce, sleep, LS, i18n, T, theme, Toast, Sheet, Modal, Screen });
</script>
<script type="module">
/* ============================================================
   PART 3/8 · BACKEND — Firebase Storage + Firestore + Auth
   with an explicit, clearly-labelled offline fallback.
   ------------------------------------------------------------
   To go ONLINE: open Settings → Firebase and paste your config,
   or hard-code it in FIREBASE_CONFIG_INLINE below.
   ============================================================ */
const NX = window.NX;
const { LS, Toast, uid } = NX;

/* ---- EDIT HERE to ship the platform with your own Firebase ---- */
const FIREBASE_CONFIG_INLINE = null;
/*  example:
const FIREBASE_CONFIG_INLINE = {
  apiKey:"…", authDomain:"…", projectId:"…",
  storageBucket:"…", messagingSenderId:"…", appId:"…"
};
*/

const FB_CONFIG = FIREBASE_CONFIG_INLINE || LS.get('firebaseConfig', null);

/* ============================================================
   SEARCH TOKENISATION — shared by writes and queries
   ============================================================ */
const STOP = new Set(['the','a','an','of','and','for','my','le','la','de']);
function tokenize(s) {
  return String(s == null ? '' : s)
    .toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')      // Arabic diacritics / tatweel
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .split(/[^a-z0-9؀-ۿ]+/)
    .filter(t => t.length > 1 && !STOP.has(t));
}
function buildSearchTokens(meta) {
  const base = new Set();
  tokenize(meta.name).forEach(t => base.add(t));
  (meta.tags || []).forEach(t => tokenize(t).forEach(x => base.add(x)));
  tokenize(meta.category).forEach(t => base.add(t));
  tokenize(meta.creatorName).forEach(t => base.add(t));
  const out = new Set(base);
  base.forEach(t => { for (let i = 2; i < Math.min(t.length, 11); i++) out.add(t.slice(0, i)); });
  return Array.from(out).slice(0, 220);
}
/* Relevance is computed from the record's real fields — nothing invented. */
function scoreAsset(a, qRaw) {
  const q = String(qRaw || '').trim().toLowerCase();
  if (!q) return 0;
  const qt = tokenize(q);
  const name = String(a.name || '').toLowerCase();
  const tags = (a.tags || []).map(t => String(t).toLowerCase());
  const cat = String(a.category || '').toLowerCase();
  const by = String(a.creatorName || '').toLowerCase();
  let s = 0;
  if (name === q) s += 120;
  else if (name.startsWith(q)) s += 70;
  else if (name.includes(q)) s += 45;
  for (const t of qt) {
    if (name.split(/\s+/).includes(t)) s += 26;
    else if (name.includes(t)) s += 14;
    if (tags.includes(t)) s += 22;
    else if (tags.some(x => x.startsWith(t))) s += 11;
    if (cat === t) s += 16; else if (cat.includes(t)) s += 7;
    if (by.includes(t)) s += 9;
  }
  s += Math.log10((Number(a.usageCount) || 0) + 1) * 4;   // real usage, never a fake popularity number
  return s;
}

/* ============================================================
   LOCAL FALLBACK STORE (IndexedDB) — used only when Firebase is
   unavailable. Every surface that runs on it is labelled LOCAL.
   ============================================================ */
const IDB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('nexus-engine', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { rej(e); return; }
      /* an IDBRequest always carries `result`; a miss must resolve to
         undefined, never to the request object itself */
      t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    put: (store, key, val) => tx(store, 'readwrite', s => s.put(val, key)),
    get: (store, key) => tx(store, 'readonly', s => s.get(key)),
    del: (store, key) => tx(store, 'readwrite', s => s.delete(key)),
    all: (store) => tx(store, 'readonly', s => s.getAll()),
    keys: (store) => tx(store, 'readonly', s => s.getAllKeys())
  };
})();

const blobURLCache = new Map();
async function localURL(path) {
  if (blobURLCache.has(path)) return blobURLCache.get(path);
  const blob = await IDB.get('blobs', path);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  blobURLCache.set(path, u);
  return u;
}

/* ============================================================
   BACKEND
   ============================================================ */
const Backend = {
  mode: 'local',            // 'firebase' | 'local'
  reason: '',               // why we fell back, shown in the UI
  user: null,
  _authCbs: [],
  fb: null,                 // { app, auth, db, storage, api:{…} }

  onAuth(cb) { this._authCbs.push(cb); if (this.user !== undefined) cb(this.user); return () => { const i = this._authCbs.indexOf(cb); if (i >= 0) this._authCbs.splice(i, 1); }; },
  _emitAuth() { this._authCbs.forEach(cb => { try { cb(this.user); } catch (e) { console.error(e); } }); },

  isOnline() { return this.mode === 'firebase'; },

  /* -------------------------------------------------- init */
  async init() {
    if (!FB_CONFIG || !FB_CONFIG.apiKey || !FB_CONFIG.projectId) {
      this.mode = 'local';
      this.reason = 'no-config';
      await this._initLocalUser();
      return this;
    }
    try {
      const [{ initializeApp }, authMod, fsMod, stMod] = await Promise.all([
        import('firebase/app'), import('firebase/auth'), import('firebase/firestore'), import('firebase/storage')
      ]);
      const app = initializeApp(FB_CONFIG);
      const auth = authMod.getAuth(app);
      const db = fsMod.getFirestore(app);
      const storage = stMod.getStorage(app);
      this.fb = { app, auth, db, storage, A: authMod, F: fsMod, S: stMod };
      this.mode = 'firebase';
      this.reason = '';
      authMod.onAuthStateChanged(auth, u => {
        this.user = u ? {
          uid: u.uid,
          name: u.displayName || (u.email ? u.email.split('@')[0] : 'creator_' + u.uid.slice(0, 5)),
          email: u.email || null, photo: u.photoURL || null, anon: u.isAnonymous
        } : null;
        this._emitAuth();
      });
      /* keep browsing possible without a prompt; uploads still require a real account or anon session */
      if (!auth.currentUser) { try { await authMod.signInAnonymously(auth); } catch (e) { /* anonymous auth may be disabled */ } }
      return this;
    } catch (e) {
      console.warn('[nexus] Firebase unavailable, falling back to LOCAL mode:', e);
      this.mode = 'local';
      this.reason = 'connect-failed: ' + (e && e.message ? e.message : e);
      await this._initLocalUser();
      return this;
    }
  },

  async _initLocalUser() {
    let u = LS.get('localUser', null);
    if (!u) { u = { uid: uid('local'), name: 'creator_' + Math.random().toString(36).slice(2, 6), local: true }; LS.set('localUser', u); }
    this.user = u;
    this._emitAuth();
  },

  /* -------------------------------------------------- auth */
  auth: {
    async signInGoogle() {
      if (!Backend.isOnline()) throw new Error('LOCAL_MODE');
      const { A, auth } = Backend.fb;
      const p = new A.GoogleAuthProvider();
      const cur = auth.currentUser;
      if (cur && cur.isAnonymous) { try { return (await A.linkWithPopup(cur, p)).user; } catch (e) { if (e.code !== 'auth/credential-already-in-use') throw e; } }
      return (await A.signInWithPopup(auth, p)).user;
    },
    async signInEmail(email, pass, create) {
      if (!Backend.isOnline()) throw new Error('LOCAL_MODE');
      const { A, auth } = Backend.fb;
      if (create) {
        const cur = auth.currentUser;
        if (cur && cur.isAnonymous) {
          const cred = A.EmailAuthProvider.credential(email, pass);
          try { return (await A.linkWithCredential(cur, cred)).user; } catch (e) { if (e.code !== 'auth/credential-already-in-use') throw e; }
        }
        return (await A.createUserWithEmailAndPassword(auth, email, pass)).user;
      }
      return (await A.signInWithEmailAndPassword(auth, email, pass)).user;
    },
    async setName(name) {
      if (Backend.isOnline() && Backend.fb.auth.currentUser) {
        await Backend.fb.A.updateProfile(Backend.fb.auth.currentUser, { displayName: name });
        Backend.user = { ...Backend.user, name };
      } else {
        Backend.user = { ...Backend.user, name };
        LS.set('localUser', Backend.user);
      }
      Backend._emitAuth();
    },
    async signOut() {
      if (Backend.isOnline()) { await Backend.fb.A.signOut(Backend.fb.auth); await Backend.fb.A.signInAnonymously(Backend.fb.auth).catch(() => {}); }
      else { LS.del('localUser'); await Backend._initLocalUser(); }
    }
  },

  /* -------------------------------------------------- storage */
  async upload(path, file, onProgress) {
    if (this.isOnline()) {
      const { S, storage } = this.fb;
      const ref = S.ref(storage, path);
      const task = S.uploadBytesResumable(ref, file, { contentType: file.type || 'application/octet-stream' });
      await new Promise((res, rej) => {
        task.on('state_changed',
          s => onProgress && onProgress(s.bytesTransferred / Math.max(1, s.totalBytes)),
          rej, res);
      });
      return { path, url: await S.getDownloadURL(ref) };
    }
    await IDB.put('blobs', path, file);
    onProgress && onProgress(1);
    return { path, url: null };
  },
  async fileURL(path, cachedURL) {
    if (!path) return null;
    if (this.isOnline()) {
      if (cachedURL) return cachedURL;
      try { return await this.fb.S.getDownloadURL(this.fb.S.ref(this.fb.storage, path)); } catch { return null; }
    }
    return localURL(path);
  },
  async removeFile(path) {
    if (!path) return;
    if (this.isOnline()) { try { await this.fb.S.deleteObject(this.fb.S.ref(this.fb.storage, path)); } catch {} }
    else { await IDB.del('blobs', path); const u = blobURLCache.get(path); if (u) { URL.revokeObjectURL(u); blobURLCache.delete(path); } }
  },

  /* -------------------------------------------------- generic doc ops */
  async setDoc(col, id, data) {
    if (this.isOnline()) { const { F, db } = this.fb; await F.setDoc(F.doc(db, col, id), data, { merge: true }); return data; }
    await IDB.put('docs', col + '/' + id, data); return data;
  },
  async getDoc(col, id) {
    if (this.isOnline()) { const { F, db } = this.fb; const s = await F.getDoc(F.doc(db, col, id)); return s.exists() ? s.data() : null; }
    return (await IDB.get('docs', col + '/' + id)) || null;
  },
  async delDoc(col, id) {
    if (this.isOnline()) { const { F, db } = this.fb; await F.deleteDoc(F.doc(db, col, id)); return; }
    await IDB.del('docs', col + '/' + id);
  },
  async localCollection(col) {
    const keys = await IDB.keys('docs');
    const all = await IDB.all('docs');
    const out = [];
    keys.forEach((k, i) => { if (String(k).startsWith(col + '/')) out.push(all[i]); });
    return out.filter(Boolean);
  },

  /* Runs the ideal Firestore query; if a composite index is missing we degrade
     to a simpler query + client-side filtering rather than showing nothing. */
  async _query(col, { wheres = [], order = null, lim = 40, cursor = null }) {
    const { F, db } = this.fb;
    const build = (ws, ord) => {
      const parts = ws.map(w => F.where(w[0], w[1], w[2]));
      if (ord) parts.push(F.orderBy(ord[0], ord[1] || 'desc'));
      if (cursor) parts.push(F.startAfter(cursor));
      parts.push(F.limit(lim));
      return F.query(F.collection(db, col), ...parts);
    };
    try {
      const snap = await F.getDocs(build(wheres, order));
      return { docs: snap.docs.map(d => d.data()), last: snap.docs[snap.docs.length - 1] || null, degraded: false };
    } catch (e) {
      if (e && (e.code === 'failed-precondition' || /index/i.test(e.message || ''))) {
        console.warn('[nexus] Firestore index missing — degrading query. Create it via the link in this error:\n', e.message);
        const primary = wheres.find(w => w[1] === 'array-contains-any') || wheres[0];
        const snap = await F.getDocs(build(primary ? [primary] : [], null));
        return { docs: snap.docs.map(d => d.data()), last: null, degraded: true };
      }
      throw e;
    }
  }
};

/* ============================================================
   ASSETS — the public library lives here
   ============================================================ */
const ASSET_KINDS = { model: 'model', image: 'image', audio: 'audio', data: 'data' };
const CATEGORIES = ['Vehicles','Buildings','Characters','Animals','Nature','Props','Furniture','Environment','Weapons','UI','Audio','Other'];
const LICENSES = ['Original','CC0','CC BY','Licensed','Other'];

const Assets = {
  kinds: ASSET_KINDS, categories: CATEGORIES, licenses: LICENSES,

  /* create an asset record (rule 9) — the file itself lives in Storage */
  async create(meta, file, thumbBlob, onProgress) {
    const u = Backend.user;
    if (!u) throw new Error('NO_USER');
    const id = uid('asset');
    const ext = (meta.ext || (file.name.split('.').pop() || 'bin')).toLowerCase();
    const base = `assets/${u.uid}/${id}`;
    const storagePath = `${base}/source.${ext}`;
    const up = await Backend.upload(storagePath, file, p => onProgress && onProgress(p * (thumbBlob ? 0.85 : 1)));
    let thumbPath = null, thumbURL = null;
    if (thumbBlob) {
      const t = await Backend.upload(`${base}/thumb.webp`, thumbBlob, p => onProgress && onProgress(0.85 + p * 0.15));
      thumbPath = t.path; thumbURL = t.url;
    }
    const now = Date.now();
    const rec = {
      assetId: id,
      ownerId: u.uid,
      creatorName: u.name || 'creator',
      name: meta.name || file.name,
      description: meta.description || '',
      category: meta.category || 'Other',
      tags: (meta.tags || []).map(t => String(t).trim().toLowerCase()).filter(Boolean).slice(0, 24),
      storagePath,
      downloadURL: up.url || null,
      thumbnail: thumbPath,
      thumbnailURL: thumbURL,
      fileType: meta.fileType || ext,
      kind: meta.kind || 'data',
      bytes: file.size || 0,
      license: meta.license || 'Original',
      visibility: meta.visibility === 'public' ? 'public' : 'private',
      stats: meta.stats || null,             // auto-extracted metadata (rule 16)
      createdAt: now, updatedAt: now,
      usageCount: 0,
      searchTokens: []
    };
    rec.searchTokens = buildSearchTokens(rec);
    await Backend.setDoc('assets', id, rec);
    return rec;
  },

  async get(id) { return Backend.getDoc('assets', id); },

  async update(id, patch) {
    const cur = await this.get(id);
    if (!cur) throw new Error('NOT_FOUND');
    const next = { ...cur, ...patch, updatedAt: Date.now() };
    next.searchTokens = buildSearchTokens(next);
    await Backend.setDoc('assets', id, next);
    return next;
  },

  async remove(id) {
    const a = await this.get(id);
    if (!a) return;
    await Backend.removeFile(a.storagePath);
    if (a.thumbnail) await Backend.removeFile(a.thumbnail);
    await Backend.delDoc('assets', id);
  },

  /* Real search over real records — never invented results (rules 4, 38, 39) */
  async search({ q = '', kind = 'all', category = null, sort = 'relevance', ownerId = null, scope = 'public', limit = 30, cursor = null } = {}) {
    const qt = tokenize(q).slice(0, 10);
    let items = [], nextCursor = null, degraded = false;

    if (Backend.isOnline()) {
      const wheres = [];
      if (scope === 'mine' && ownerId) wheres.push(['ownerId', '==', ownerId]);
      else wheres.push(['visibility', '==', 'public']);
      if (kind !== 'all') wheres.push(['kind', '==', kind]);
      if (category) wheres.push(['category', '==', category]);
      if (qt.length) wheres.push(['searchTokens', 'array-contains-any', qt]);
      const order = qt.length ? null
        : (sort === 'usage' ? ['usageCount', 'desc'] : ['createdAt', 'desc']);
      const res = await Backend._query('assets', { wheres, order, lim: qt.length ? 120 : limit, cursor });
      items = res.docs; nextCursor = res.last; degraded = res.degraded;
      if (degraded) {
        if (scope === 'mine' && ownerId) items = items.filter(a => a.ownerId === ownerId);
        else items = items.filter(a => a.visibility === 'public');
        if (kind !== 'all') items = items.filter(a => a.kind === kind);
        if (category) items = items.filter(a => a.category === category);
      }
    } else {
      items = await Backend.localCollection('assets');
      if (scope === 'mine' && ownerId) items = items.filter(a => a.ownerId === ownerId);
      else items = items.filter(a => a.visibility === 'public');
      if (kind !== 'all') items = items.filter(a => a.kind === kind);
      if (category) items = items.filter(a => a.category === category);
      if (qt.length) items = items.filter(a => {
        const toks = a.searchTokens || buildSearchTokens(a);
        return qt.some(t => toks.includes(t));
      });
    }

    if (q) {
      items = items.map(a => ({ a, s: scoreAsset(a, q) })).filter(x => x.s > 0).sort((x, y) => y.s - x.s).map(x => x.a);
      if (sort === 'new') items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (sort === 'usage') items.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
    } else {
      if (sort === 'usage') items.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
      else items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }
    const page = items.slice(0, limit);
    return { items: page, cursor: nextCursor, done: !nextCursor || page.length < limit, degraded, total: items.length };
  },

  /* usage counters move by +1 only, from a real add-to-scene action (rule 5) */
  async bumpUsage(id) {
    try {
      if (Backend.isOnline()) {
        const { F, db } = Backend.fb;
        await F.updateDoc(F.doc(db, 'assets', id), { usageCount: F.increment(1) });
      } else {
        const a = await this.get(id);
        if (a) { a.usageCount = (a.usageCount || 0) + 1; await Backend.setDoc('assets', id, a); }
      }
    } catch (e) { console.warn('usage bump failed', e); }
  },

  async url(asset) {
    if (!asset) return null;
    return Backend.fileURL(asset.storagePath, asset.downloadURL);
  },
  async thumbURL(asset) {
    if (!asset || !asset.thumbnail) return null;
    return Backend.fileURL(asset.thumbnail, asset.thumbnailURL);
  }
};

/* ============================================================
   PROJECTS — scenes reference assets by assetId only (rule 10)
   ============================================================ */
const Projects = {
  async list(ownerId) {
    if (Backend.isOnline()) {
      const r = await Backend._query('projects', { wheres: [['ownerId', '==', ownerId]], order: ['updatedAt', 'desc'], lim: 60 });
      return r.docs;
    }
    return (await Backend.localCollection('projects'))
      .filter(p => p.ownerId === ownerId)
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  async get(id) { return Backend.getDoc('projects', id); },
  async save(p) {
    p.updatedAt = Date.now();
    p.createdAt = p.createdAt || p.updatedAt;
    await Backend.setDoc('projects', p.projectId, p);
    LS.set('lastProject', p.projectId);
    return p;
  },
  async remove(id) { await Backend.delDoc('projects', id); }
};

/* ============================================================
   GAMES — published projects, with counters the client
   cannot set to an arbitrary number (rule 42)
   ============================================================ */
const Games = {
  async publish(project, meta) {
    const u = Backend.user;
    const gameId = project.publishedId || uid('game');
    const prev = await Backend.getDoc('games', gameId);
    const rec = {
      gameId,
      projectId: project.projectId,
      ownerId: u.uid,
      creatorName: u.name || 'creator',
      title: meta.title || project.name,
      description: meta.description || '',
      genre: meta.genre || 'Other',
      icon: meta.icon || null,
      cover: meta.cover || null,
      visibility: meta.visibility || 'public',
      plays: prev ? (prev.plays || 0) : 0,
      likes: prev ? (prev.likes || 0) : 0,
      createdAt: prev ? prev.createdAt : Date.now(),
      updatedAt: Date.now(),
      searchTokens: buildSearchTokens({ name: meta.title || project.name, tags: [meta.genre || ''], category: meta.genre || '', creatorName: u.name })
    };
    await Backend.setDoc('games', gameId, rec);
    /* the runnable snapshot: scene graph + scripts, assets stay by reference */
    await Backend.setDoc('builds', gameId, {
      gameId, ownerId: u.uid, updatedAt: Date.now(),
      scene: project.scene, scripts: project.scripts, components: project.components,
      settings: project.settings, assetRefs: project.assetRefs || []
    });
    project.publishedId = gameId;
    await Projects.save(project);
    return rec;
  },
  async get(id) { return Backend.getDoc('games', id); },
  async build(id) { return Backend.getDoc('builds', id); },
  async list({ sort = 'new', limit = 30, ownerId = null } = {}) {
    let items;
    if (Backend.isOnline()) {
      const wheres = ownerId ? [['ownerId', '==', ownerId]] : [['visibility', '==', 'public']];
      const order = sort === 'plays' ? ['plays', 'desc'] : sort === 'likes' ? ['likes', 'desc'] : ['updatedAt', 'desc'];
      const r = await Backend._query('games', { wheres, order, lim: limit });
      items = r.docs;
      if (r.degraded) items = ownerId ? items.filter(g => g.ownerId === ownerId) : items.filter(g => g.visibility === 'public');
    } else {
      items = await Backend.localCollection('games');
      items = ownerId ? items.filter(g => g.ownerId === ownerId) : items.filter(g => g.visibility === 'public');
    }
    const key = sort === 'plays' ? 'plays' : sort === 'likes' ? 'likes' : 'updatedAt';
    return items.sort((a, b) => (b[key] || 0) - (a[key] || 0)).slice(0, limit);
  },
  async search(q, limit = 30) {
    const qt = tokenize(q).slice(0, 10);
    if (!qt.length) return this.list({ limit });
    let items;
    if (Backend.isOnline()) {
      const r = await Backend._query('games', { wheres: [['visibility', '==', 'public'], ['searchTokens', 'array-contains-any', qt]], lim: 80 });
      items = r.degraded ? r.docs.filter(g => g.visibility === 'public') : r.docs;
    } else {
      items = (await Backend.localCollection('games')).filter(g => g.visibility === 'public' &&
        (g.searchTokens || []).some(t => qt.includes(t)));
    }
    return items.map(g => ({ g, s: scoreAsset({ name: g.title, tags: [g.genre], category: g.genre, creatorName: g.creatorName, usageCount: g.plays }, q) }))
      .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, limit).map(x => x.g);
  },
  /* one play per (user, session) — the counter only ever moves by +1 */
  async recordPlay(gameId) {
    const u = Backend.user; if (!u) return;
    const sid = (sessionStorage.getItem('nx.sid') || (() => { const s = uid('s'); sessionStorage.setItem('nx.sid', s); return s; })());
    const key = `${u.uid}_${sid}`;
    try {
      if (Backend.isOnline()) {
        const { F, db } = Backend.fb;
        const ref = F.doc(db, 'games', gameId, 'plays', key);
        if ((await F.getDoc(ref)).exists()) return;
        await F.setDoc(ref, { uid: u.uid, at: Date.now() });
        await F.updateDoc(F.doc(db, 'games', gameId), { plays: F.increment(1) });
      } else {
        const mark = 'play/' + gameId + '/' + key;
        if (await IDB.get('docs', mark)) return;
        await IDB.put('docs', mark, 1);
        const g = await this.get(gameId); if (g) { g.plays = (g.plays || 0) + 1; await Backend.setDoc('games', gameId, g); }
      }
    } catch (e) { console.warn('play record failed', e); }
  },
  /* likes are one document per user — the count is derived, not client-authored */
  async isLiked(gameId) {
    const u = Backend.user; if (!u) return false;
    if (Backend.isOnline()) {
      const { F, db } = Backend.fb;
      return (await F.getDoc(F.doc(db, 'games', gameId, 'likes', u.uid))).exists();
    }
    return !!(await IDB.get('docs', 'like/' + gameId + '/' + u.uid));
  },
  async toggleLike(gameId) {
    const u = Backend.user; if (!u) throw new Error('NO_USER');
    const on = !(await this.isLiked(gameId));
    if (Backend.isOnline()) {
      const { F, db } = Backend.fb;
      const ref = F.doc(db, 'games', gameId, 'likes', u.uid);
      if (on) await F.setDoc(ref, { uid: u.uid, at: Date.now() }); else await F.deleteDoc(ref);
      await F.updateDoc(F.doc(db, 'games', gameId), { likes: F.increment(on ? 1 : -1) });
    } else {
      const k = 'like/' + gameId + '/' + u.uid;
      if (on) await IDB.put('docs', k, 1); else await IDB.del('docs', k);
      const g = await this.get(gameId);
      if (g) { g.likes = Math.max(0, (g.likes || 0) + (on ? 1 : -1)); await Backend.setDoc('games', gameId, g); }
    }
    return on;
  },
  async remove(gameId) { await Backend.delDoc('games', gameId); await Backend.delDoc('builds', gameId); }

/* ============================================================
   SECURITY RULES — shipped as text so the operator can deploy
   them; counters and ownership are enforced server-side, never
   by the client (rules 42, 48).
   ============================================================ */
const SECURITY_RULES = {
  firestore: `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function owns(r)    { return signedIn() && request.auth.uid == r.ownerId; }
    // a counter may only move by exactly +1 / -1, and nothing else may change
    function bumped(field, by) {
      return request.resource.data[field] == resource.data[field] + by
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly([field]);
    }

    match /assets/{assetId} {
      allow read:   if resource.data.visibility == 'public' || owns(resource.data);
      allow create: if signedIn()
                    && request.resource.data.ownerId == request.auth.uid
                    && request.resource.data.usageCount == 0
                    && request.resource.data.visibility in ['public','private'];
      // the owner edits metadata; anyone signed in may only bump usageCount by 1
      allow update: if (owns(resource.data)
                        && request.resource.data.ownerId == resource.data.ownerId)
                    || (signedIn() && bumped('usageCount', 1));
      allow delete: if owns(resource.data);
    }

    match /projects/{projectId} {
      allow read, write: if signedIn() && request.auth.uid == request.resource.data.ownerId
                         || (resource != null && owns(resource.data));
    }

    match /games/{gameId} {
      allow read:   if resource.data.visibility == 'public' || owns(resource.data);
      allow create: if signedIn() && request.resource.data.ownerId == request.auth.uid
                    && request.resource.data.plays == 0 && request.resource.data.likes == 0;
      allow update: if (owns(resource.data)
                        && request.resource.data.plays == resource.data.plays
                        && request.resource.data.likes == resource.data.likes)
                    || bumped('plays', 1) || bumped('likes', 1) || bumped('likes', -1);
      allow delete: if owns(resource.data);

      match /plays/{playId} {
        allow read: if false;
        allow create: if signedIn() && playId.split('_')[0] == request.auth.uid;
      }
      match /likes/{uid} {
        allow read: if signedIn() && request.auth.uid == uid;
        allow create, delete: if signedIn() && request.auth.uid == uid;
      }
    }

    match /builds/{gameId} {
      allow read: if true;   // published runnable snapshot
      allow write: if signedIn() && request.auth.uid == request.resource.data.ownerId;
    }
  }
}`,
  storage: `rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /assets/{userId}/{assetId}/{file} {
      allow read: if true;                      // public library reads
      allow write: if request.auth != null
                   && request.auth.uid == userId
                   && request.resource.size < 64 * 1024 * 1024
                   && (request.resource.contentType.matches('model/.*')
                    || request.resource.contentType.matches('image/.*')
                    || request.resource.contentType.matches('audio/.*')
                    || request.resource.contentType.matches('application/octet-stream')
                    || request.resource.contentType.matches('text/plain')
                    || request.resource.contentType.matches('application/json'));
      // NOTE: executable script files are never stored as assets — user code
      // lives in project documents and runs only inside the engine sandbox.
    }
    match /games/{userId}/{allPaths=**} {
      allow read: if true;
      allow write: if request.auth != null && request.auth.uid == userId
                   && request.resource.size < 8 * 1024 * 1024;
    }
  }
}`
};

<script type="module">
/* ============================================================
   PART 4/8 · ENGINE CORE
   An empty core: Scene, Camera, Light, Spawn Point and engine
   primitives. No bundled model/game library — everything else
