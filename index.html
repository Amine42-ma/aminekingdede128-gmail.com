        ['Box', () => ({ name: 'Box', type: 'primitive', props: { shape: 'box' }, position: [0, .5, 0] })],
        ['Sphere', () => ({ name: 'Sphere', type: 'primitive', props: { shape: 'sphere' }, position: [0, .5, 0] })],
        ['Plane (ground)', () => ({ name: 'Ground', type: 'primitive', props: { shape: 'plane', color: '#2a3050' }, scale: [30, 1, 30] })],
        ['Cylinder', () => ({ name: 'Cylinder', type: 'primitive', props: { shape: 'cylinder' }, position: [0, .5, 0] })],
        ['Cone', () => ({ name: 'Cone', type: 'primitive', props: { shape: 'cone' }, position: [0, .5, 0] })]
      ]]
    ];
    groups.forEach(([title, items]) => {
      body.appendChild(el('div', { class: 'ttl', text: title }));
      const g = el('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', marginBottom: '14px' } });
      items.forEach(([label, mk]) => g.appendChild(btn(label, {
        cls: 'block', onclick: async () => {
          this.pushUndo();
          const def = mk();
          const t = this.engine.orbit.target;
          def.position = def.position || [t.x, 0, t.z];
          const e = await this.engine.addEntity(def);
          this.engine.select(e.id);
          this.dirty = true; this.updateHud();
          Toast.ok(def.name + ' أُضيف');
          sheet.close(); after && after();
        }
      })));
      body.appendChild(g);
    });
    body.appendChild(btn('فتح مكتبة الأصول لإضافة مجسم', { cls: 'primary block', icon: 'cube', onclick: () => { sheet.close(); this.openAssets(); } }));
    const sheet = Sheet.open({ title: 'إضافة كائن', body, id: 'addobj' });
  },

  openAssets() {
    NX.openAssetLibrary({
      onAdd: async asset => { await this.addAsset(asset); },
      scope: 'public'
    });
  },

  async addAsset(asset) {
    this.pushUndo();
    const t = this.engine.orbit.target;
    const toast = Toast.show('جارٍ تحميل ' + asset.name + '…', '', 9000);
    try {
      const e = await this.engine.addEntity({
        name: asset.name,
        type: asset.kind === 'audio' ? 'audio' : 'model',
        assetId: asset.assetId,
        position: [t.x, 0, t.z]
      }, { asset });
      this.engine.select(e.id);
      this.engine.focus(e);
      /* the project keeps only the id — never a copy of the file (rule 10) */
      this.project.assetRefs = this.project.assetRefs || [];
      if (!this.project.assetRefs.includes(asset.assetId)) this.project.assetRefs.push(asset.assetId);
      Assets.bumpUsage(asset.assetId);
      this.dirty = true; this.updateHud();
      toast.remove();
      Toast.ok(asset.name + ' أُضيف للمشهد');
    } catch (err) {
      toast.remove();
      Toast.err('تعذّر تحميل الأصل: ' + (err.message || err));
    }
  },

  /* ---------------- inspector (rule 23) ---------------- */
  openInspector(entity) {
    const e = entity;
    const body = el('div');
    const o = e.object3D;

    const nameIn = el('input', { class: 'input', value: e.name });
    nameIn.addEventListener('change', () => { e.name = nameIn.value; o.name = e.name; this.dirty = true; this.onSelection(e); });
    body.appendChild(field(T('name'), nameIn));

    const tagIn = el('input', { class: 'input', value: e.tag || '', placeholder: 'player, enemy, pickup…' });
    tagIn.addEventListener('change', () => { e.tag = tagIn.value.trim(); this.dirty = true; });
    body.appendChild(field('Tag', tagIn));

    const vec = (label, target, step, onChange) => {
      const wrap = el('div', { class: 'vec3' });
      ['x', 'y', 'z'].forEach(ax => {
        const l = el('label');
        l.appendChild(el('i', { text: ax.toUpperCase() }));
        const inp = el('input', { type: 'number', step, value: (+target[ax]).toFixed(3) });
        inp.addEventListener('input', () => {
          const v = parseFloat(inp.value);
          if (!isNaN(v)) { target[ax] = v; onChange && onChange(); this.engine.refreshSelBox(); this.dirty = true; }
        });
        l.appendChild(inp); wrap.appendChild(l);
        (target.__inputs = target.__inputs || {})[ax] = inp;
      });
      return field(label, wrap);
    };
    body.appendChild(vec(T('position'), o.position, 0.05));
    body.appendChild(vec(T('rotation') + ' (rad)', o.rotation, 0.05));
    body.appendChild(vec(T('scale'), o.scale, 0.05));

    /* live sync while dragging in the viewport */
    const offT = this.engine.on('transform', ent => {
      if (!ent || ent.id !== e.id) return;
      [o.position, o.rotation, o.scale].forEach(t => {
        if (!t.__inputs) return;
        ['x', 'y', 'z'].forEach(ax => { if (document.activeElement !== t.__inputs[ax]) t.__inputs[ax].value = (+t[ax]).toFixed(3); });
      });
    });

    /* type-specific props */
    const p = e.props;
    if (e.type === 'light') {
      const col = el('input', { type: 'color', class: 'input', value: p.color || '#ffffff' });
      col.addEventListener('input', () => { p.color = col.value; if (o.color) o.color.set(col.value); this.dirty = true; });
      body.appendChild(field('Color', col));
      const int = el('input', { type: 'range', min: 0, max: 8, step: 0.05, value: p.intensity == null ? 1.6 : p.intensity, class: 'input' });
      int.addEventListener('input', () => { p.intensity = +int.value; o.intensity = +int.value * (p.light === 'point' ? 8 : p.light === 'spot' ? 10 : 1); this.dirty = true; });
      body.appendChild(field('Intensity', int));
    }
    if (e.type === 'primitive') {
      const col = el('input', { type: 'color', class: 'input', value: p.color || '#8b93b8' });
      col.addEventListener('input', () => {
        p.color = col.value;
        o.traverse(n => { if (n.isMesh && n.material.color) n.material.color.set(col.value); });
        this.dirty = true;
      });
      body.appendChild(field('Color', col));
      ['metalness', 'roughness'].forEach(k => {
        const r = el('input', { type: 'range', min: 0, max: 1, step: 0.02, value: p[k] == null ? (k === 'roughness' ? .85 : .05) : p[k], class: 'input' });
        r.addEventListener('input', () => { p[k] = +r.value; o.traverse(n => { if (n.isMesh) n.material[k] = +r.value; }); this.dirty = true; });
        body.appendChild(field(k, r));
      });
    }
    if (e.type === 'camera') {
      const mainT = el('div', { class: 'switch' }, [el('span', { text: 'Main camera' })]);
      const tg = el('div', { class: 'tgl' + (p.isMain ? ' on' : '') });
      tg.onclick = () => {
        Array.from(this.engine.entities.values()).forEach(x => { if (x.type === 'camera') x.props.isMain = false; });
        p.isMain = !p.isMain; tg.classList.toggle('on', p.isMain); this.dirty = true;
      };
      mainT.appendChild(tg); body.appendChild(mainT);
    }
    if (e.assetId) {
      const info = el('div', { class: 'card', style: { marginBottom: '12px' } });
      info.appendChild(el('div', { class: 'kv' }, [el('span', { text: 'Asset ID' }), el('span', { text: e.assetId })]));
      info.appendChild(el('div', { class: 'kv' }, [el('span', { text: 'مرجع فقط' }), el('span', { text: 'لا نسخة للملف داخل المشروع' })]));
      const anims = e.animations && e.animations.length ? e.animations.map(a => a.name) : [];
      if (anims.length) {
        info.appendChild(el('div', { class: 'kv' }, [el('span', { text: 'Animations' }), el('span', { text: anims.join(', ') })]));
        const row = el('div', { class: 'chips', style: { marginTop: '8px' } });
        anims.forEach(n => row.appendChild(el('button', { class: 'chip', text: '▶ ' + n, onclick: () => new NX.GameObject(e, { engine: this.engine }).play(n) })));
        info.appendChild(row);
      }
      body.appendChild(info);
    }

    /* physics */
    const physAcc = el('details', { class: 'acc' });
    physAcc.appendChild(el('summary', { text: 'Physics' }));
    const pb = el('div', { class: 'acc-body' });
    const bodySel = el('select', { class: 'select' }, [
      el('option', { value: '', text: 'none' }),
      el('option', { value: 'static', text: 'static' }),
      el('option', { value: 'dynamic', text: 'dynamic' }),
      el('option', { value: 'character', text: 'character' })
    ]);
    bodySel.value = (e.components.find(c => c.type === 'Rigidbody') || {}).data ? e.components.find(c => c.type === 'Rigidbody').data.type : '';
    bodySel.addEventListener('change', () => {
      e.components = e.components.filter(c => c.type !== 'Rigidbody');
      if (bodySel.value) e.components.push({ id: uid('c'), type: 'Rigidbody', name: 'Rigidbody', data: { type: bodySel.value }, enabled: true });
      this.dirty = true;
    });
    pb.appendChild(field('Body type', bodySel));
    physAcc.appendChild(pb); body.appendChild(physAcc);

    /* components + scripts */
    const compAcc = el('details', { class: 'acc', open: true });
    compAcc.appendChild(el('summary', { text: T('components') + ' & ' + T('scripts') }));
    const cb = el('div', { class: 'acc-body' });
    const drawComps = () => {
      cb.textContent = '';
      const scripts = (this.project.scripts || []).filter(s => s.entityId === e.id);
      scripts.forEach(s => {
        const r = el('div', { class: 'comp-row' });
        r.appendChild(icon('code'));
        r.appendChild(el('b', { text: s.name }));
        r.appendChild(iconBtn('trash', { onclick: () => { this.project.scripts = this.project.scripts.filter(x => x.id !== s.id); this.dirty = true; drawComps(); } }));
        r.onclick = ev => { if (ev.target.closest('.icon-btn')) return; this.openCode(s.id); };
        cb.appendChild(r);
      });
      (e.components || []).filter(c => c.type !== 'Rigidbody').forEach(c => {
        const r = el('div', { class: 'comp-row' });
        r.appendChild(icon('box'));
        r.appendChild(el('b', { text: c.name || c.type }));
        r.appendChild(iconBtn('trash', { onclick: () => { e.components = e.components.filter(x => x.id !== c.id); this.dirty = true; drawComps(); } }));
        cb.appendChild(r);
      });
      if (!cb.childElementCount) cb.appendChild(el('p', { class: 'tiny', text: 'لا مكوّنات. أضف سكربتًا أو مكوّنًا كتبته بنفسك.' }));
      const row = el('div', { class: 'row', style: { marginTop: '10px' } });
      row.appendChild(btn('+ سكربت', { cls: 'sm', onclick: () => { const s = this.newScript(e.id); drawComps(); this.openCode(s.id); } }));
      row.appendChild(btn('+ مكوّن', { cls: 'sm', onclick: () => this.pickComponent(e, drawComps) }));
      cb.appendChild(row);
    };
    drawComps();
    compAcc.appendChild(cb); body.appendChild(compAcc);

    const foot = [
      btn('تكرار', { cls: 'ghost', icon: 'copy', onclick: async () => { this.pushUndo(); await this.engine.duplicate(e.id); this.dirty = true; sheet.close(); } }),
      btn(T('delete'), { cls: 'danger', icon: 'trash', onclick: async () => {
        if (!await Modal.confirm('حذف ' + e.name + '؟', 'يمكن التراجع من قائمة المزيد.', T('delete'))) return;
        this.pushUndo(); this.engine.removeEntity(e.id); this.dirty = true; this.updateHud(); sheet.close();
      }})
    ];
    const sheet = Sheet.open({ title: T('inspector'), body, foot, id: 'inspector', onClose: offT });
  },

  pickComponent(entity, after) {
    const comps = this.project.components || [];
    const body = el('div');
    if (!comps.length) body.appendChild(el('p', { class: 'muted', text: 'لم تُنشئ مكوّنات بعد. أنشئ واحدًا من تبويب الكود.' }));
    comps.forEach(c => {
      body.appendChild(btn(c.name, { cls: 'block', style: { marginBottom: '8px' }, onclick: () => {
        entity.components.push({ id: uid('c'), type: c.name, name: c.name, data: {}, enabled: true });
        this.dirty = true; sheet.close(); after && after();
      }}));
    });
    body.appendChild(btn('+ مكوّن جديد', { cls: 'primary block', onclick: () => { sheet.close(); this.newComponent(); } }));
    const sheet = Sheet.open({ title: T('addComponent'), body, id: 'pickcomp' });
  },

  /* ---------------- code ---------------- */
  newScript(entityId) {
    const s = { id: uid('s'), name: 'Script' + ((this.project.scripts || []).length + 1) + '.js', code: NX.SCRIPT_TEMPLATE, entityId: entityId || null, enabled: true };
    (this.project.scripts = this.project.scripts || []).push(s);
    this.dirty = true;
    return s;
  },
  async newComponent() {
    const name = await Modal.prompt('اسم المكوّن', 'MyVehicleController', 'MyInventory');
    if (!name) return;
    const c = { id: uid('cmp'), name: name.replace(/\s+/g, ''), code: `// مكوّن مخصّص: ${name}\n// props = البيانات التي تمرّرها عند الإضافة\n\nfunction start() {\n  Engine.log("${name} on " + (self ? self.name : "scene"));\n}\n\nfunction update(dt) {\n}\n` };
    (this.project.components = this.project.components || []).push(c);
    this.dirty = true;
    this.openCode(null, c.id);
    return c;
  },

  openCode(scriptId, componentId) {
    const p = this.project;
    p.scripts = p.scripts || []; p.components = p.components || [];
    let current = componentId
      ? p.components.find(c => c.id === componentId)
      : (scriptId ? p.scripts.find(s => s.id === scriptId) : p.scripts[0]);
    if (!current) current = this.newScript(null);

    const body = el('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', minHeight: '0' } });
    const filebar = el('div', { class: 'chips', style: { marginBottom: '8px', flex: '0 0 auto' } });
    const edHost = el('div', { style: { flex: '1', minHeight: '260px', display: 'flex' } });
    body.append(filebar, edHost);

    let editor = null;
    const openFile = rec => {
      current = rec;
      if (!editor) {
        editor = new CodeEditor(edHost, {
          value: rec.code, name: rec.name,
          onSave: v => { current.code = v; this.dirty = true; Toast.ok('حُفظ ' + current.name); this.save(true); },
          onRun: v => { current.code = v; this.dirty = true; this.testScript(current, editor); }
        });
        this.editors.main = editor;
      } else { editor.value = rec.code; editor.setName(rec.name); editor.clearLog(); }
      drawFiles();
    };
    const drawFiles = () => {
      filebar.textContent = '';
      p.scripts.forEach(s => {
        const c = el('button', { class: 'chip' + (current.id === s.id ? ' on' : ''), text: s.name + (s.entityId ? ' ⚲' : ''), onclick: () => { if (editor) current.code = editor.value; openFile(s); } });
        filebar.appendChild(c);
      });
      p.components.forEach(cm => {
        const c = el('button', { class: 'chip' + (current.id === cm.id ? ' on' : ''), text: '⬚ ' + cm.name, onclick: () => { if (editor) current.code = editor.value; openFile(cm); } });
        filebar.appendChild(c);
      });
      filebar.appendChild(el('button', { class: 'chip', text: '+ سكربت', onclick: () => { if (editor) current.code = editor.value; openFile(this.newScript(null)); } }));
      filebar.appendChild(el('button', { class: 'chip', text: '+ مكوّن', onclick: async () => { if (editor) current.code = editor.value; const c = await this.newComponent(); } }));
    };
    openFile(current);

    const sheet = Sheet.open({
      title: T('code'), body, full: true, id: 'code',
      headExtra: [
        iconBtn('book', { label: 'api', onclick: () => this.openAPIDocs() }),
        iconBtn('dots', { label: 'options', onclick: () => this.scriptOptions(current, () => { drawFiles(); if (editor) editor.setName(current.name); }, sheet) })
      ],
      onClose: () => { if (editor) { current.code = editor.value; this.dirty = true; this.save(true); } }
    });
    setTimeout(() => { const s = $('.sheet.in .sheet-body'); if (s) s.style.display = 'flex'; if (s) s.style.flexDirection = 'column'; }, 40);
  },

  scriptOptions(rec, after, sheet) {
    const isScript = !!this.project.scripts.find(s => s.id === rec.id);
    const body = el('div');
    body.appendChild(btn('إعادة تسمية', { cls: 'block', style: { marginBottom: '8px' }, onclick: async () => {
      const n = await Modal.prompt('اسم الملف', rec.name);
      if (n) { rec.name = n; this.dirty = true; after(); }
      s2.close();
    }}));
    if (isScript) {
      body.appendChild(btn('ربط بكائن محدد', { cls: 'block', style: { marginBottom: '8px' }, onclick: () => {
        const sel = this.engine.selection;
        if (!sel) { Toast.err('حدّد كائنًا في المشهد أولًا'); return; }
        rec.entityId = sel; this.dirty = true;
        Toast.ok('رُبط بـ ' + this.engine.getEntity(sel).name);
        after(); s2.close();
      }}));
      body.appendChild(btn('فك الارتباط (سكربت عام)', { cls: 'block', style: { marginBottom: '8px' }, onclick: () => { rec.entityId = null; this.dirty = true; after(); s2.close(); } }));
    }
    body.appendChild(btn(T('delete'), { cls: 'danger block', onclick: async () => {
      if (!await Modal.confirm('حذف ' + rec.name + '؟', 'لا يمكن التراجع عن حذف الكود.', T('delete'))) return;
      this.project.scripts = this.project.scripts.filter(x => x.id !== rec.id);
      this.project.components = this.project.components.filter(x => x.id !== rec.id);
      this.dirty = true; s2.close(); sheet.close(); this.openCode();
    }}));
    const s2 = Sheet.open({ title: rec.name, body, id: 'scriptopt' });
  },

  /* quick syntax + smoke test without leaving the editor */
  testScript(rec, editor) {
    editor.log('— فحص ' + rec.name, 'sys');
    const rt = new Runtime(this.engine, { project: this.project, onLog: (m, t) => editor.log(m, t) });
    try {
      rt.compile(rec.code, rec.name);
      editor.log('✓ لا أخطاء في الصياغة', 'ok');
      editor.log('شغّل اللعبة (▶) لتنفيذه فعليًا داخل المشهد.', 'sys');
    } catch (e) {
      editor.log('✗ ' + (e.message || e), 'err');
    } finally { rt.stop(); }
  },

  /* ---------------- world ---------------- */
  openWorld() {
    const env = this.engine.environment || {};
    const body = el('div');
    const bg = el('input', { type: 'color', class: 'input', value: env.background || '#0b0d16' });
    bg.addEventListener('input', () => { this.engine.applyEnvironment({ ...this.engine.environment, background: bg.value }); this.dirty = true; });
    body.appendChild(field('لون الخلفية', bg));

    const amb = el('input', { type: 'range', min: 0, max: 2, step: 0.05, value: env.ambient == null ? .3 : env.ambient, class: 'input' });
    amb.addEventListener('input', () => { this.engine.applyEnvironment({ ...this.engine.environment, ambient: +amb.value }); this.dirty = true; });
    body.appendChild(field('الإضاءة المحيطة', amb));

    const fogOn = el('div', { class: 'switch' }, [el('span', { text: 'ضباب · Fog' })]);
    const tg = el('div', { class: 'tgl' + (env.fog ? ' on' : '') });
    tg.onclick = () => {
      const on = !this.engine.environment.fog;
      this.engine.applyEnvironment({ ...this.engine.environment, fog: on ? { color: bg.value, near: 8, far: 90 } : null });
      tg.classList.toggle('on', on); this.dirty = true;
    };
    fogOn.appendChild(tg); body.appendChild(fogOn);

    const sh = el('div', { class: 'switch' }, [el('span', { text: 'ظلال · Shadows' })]);
    const tg2 = el('div', { class: 'tgl' + (env.shadows !== false ? ' on' : '') });
    tg2.onclick = () => {
      const on = !(this.engine.environment.shadows !== false);
      this.engine.applyEnvironment({ ...this.engine.environment, shadows: on });
      tg2.classList.toggle('on', on); this.dirty = true;
    };
    sh.appendChild(tg2); body.appendChild(sh);

    body.appendChild(el('hr', { class: 'sep' }));
    const pn = el('input', { class: 'input', value: this.project.name });
    pn.addEventListener('change', () => { this.project.name = pn.value; $('#s-name').firstChild.textContent = pn.value; this.dirty = true; });
    body.appendChild(field('اسم المشروع', pn));
    const pd = el('textarea', { class: 'textarea', value: this.project.description || '' });
    pd.addEventListener('change', () => { this.project.description = pd.value; this.dirty = true; });
    body.appendChild(field(T('description'), pd));

    body.appendChild(el('hr', { class: 'sep' }));
    body.appendChild(el('div', { class: 'ttl', text: 'أصول هذا المشروع' }));
    const refs = this.project.assetRefs || [];
    body.appendChild(el('p', { class: 'tiny', text: refs.length ? refs.length + ' أصل مرتبط بالمعرّف فقط (بلا نسخ)' : 'لا أصول مرتبطة بعد' }));

    Sheet.open({ title: T('world'), body, id: 'world' });
  },

  /* ---------------- AI (rules 30, 31) ---------------- */
  openAI() {
    const body = el('div', { style: { display: 'flex', flexDirection: 'column', minHeight: '0', height: '100%' } });
    const log = el('div', { class: 'ai-log scroll', style: { flex: '1', minHeight: '180px', overflowY: 'auto' } });
    const cfg = AI.cfg();
    log.appendChild(el('div', { class: 'ai-msg sys', text: cfg.provider === 'none'
      ? 'المساعد يعمل الآن بالمولّد المحلي (بلا اتصال). اضغط ⚙ لوصل نموذج حقيقي.'
      : 'متصل بـ ' + cfg.provider + ' · ' + (cfg.model || 'default') }));
    log.appendChild(el('div', { class: 'ai-msg ai', text: 'اطلب ما تريد: «أنشئ نظام قيادة للدراجة» · «اجعل هذا المجسم بابًا يفتح عند اقتراب اللاعب» · «أضف ميكروفونًا وزر كتم».\nكل ما أكتبه يظهر ككود تستطيع تعديله أو حذفه.' }));

    const quick = el('div', { class: 'quick' });
    ['أنشئ نظام قيادة للدراجة', 'اجعل هذا المجسم بابًا يفتح عندما يقترب اللاعب', 'أنشئ واجهة متجر', 'أضف ميكروفونًا وزر كتم الصوت', 'اجعل اللاعب يتسلق الجدار', 'نظام مهام', 'حقيبة أغراض']
      .forEach(q => quick.appendChild(el('button', { text: q, onclick: () => { input.value = q; send(); } })));

    const input = el('textarea', { placeholder: 'اكتب طلبك…', rows: 1 });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(130, input.scrollHeight) + 'px'; });
    const sendBtn = iconBtn('spark', { cls: 'on', label: 'send' });
    const inputRow = el('div', { class: 'ai-input', style: { marginTop: '8px', flex: '0 0 auto' } }, [input, sendBtn]);
    body.append(log, quick, inputRow);

    const send = async () => {
      const q = input.value.trim();
      if (!q) return;
      input.value = ''; input.style.height = '';
      log.appendChild(el('div', { class: 'ai-msg me', text: q }));
      log.scrollTop = log.scrollHeight;
      const thinking = el('div', { class: 'ai-msg ai', text: '…' });
      log.appendChild(thinking); log.scrollTop = log.scrollHeight;
      let res;
      try {
        res = await AI.ask(q, this.project, this.engine);
      } catch (e) {
        thinking.textContent = 'تعذّر الاتصال بالنموذج: ' + (e.message || e) + '\nسأستخدم المولّد المحلي بدلًا منه.';
        res = AI.local(q, this.project, this.engine);
        const extra = el('div', { class: 'ai-msg ai' }); log.appendChild(extra); thinking.classList.add('sys');
      }
      thinking.textContent = res.explanation || 'اقتراح جاهز';
      if (res.source === 'local') thinking.appendChild(el('div', { class: 'tiny', style: { marginTop: '6px' }, text: '— مولّد محلي' }));
      (res.scripts || []).forEach(s => log.appendChild(this.aiPatchCard(s)));
      log.scrollTop = log.scrollHeight;
    };
    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(); });

    Sheet.open({
      title: 'AI · مساعد', body, full: true, id: 'ai',
      headExtra: iconBtn('gear', { label: 'ai settings', onclick: () => this.openAISettings() })
    });
    setTimeout(() => { const s = $('.sheet.in .sheet-body'); if (s) { s.style.display = 'flex'; s.style.flexDirection = 'column'; } }, 40);
  },

  aiPatchCard(script) {
    const card = el('div', { class: 'ai-patch' });
    const head = el('div', { class: 'ph' });
    head.appendChild(icon('code'));
    head.appendChild(el('b', { text: script.name }));
    if (script.attachTo) head.appendChild(el('span', { class: 'badge brand', text: '→ ' + script.attachTo }));
    const pre = el('pre');
    pre.innerHTML = highlight(script.code);
    const act = el('div', { class: 'pa' });
    let applied = null;
    act.appendChild(btn('Preview', { cls: 'sm ghost', onclick: () => {
      const b = el('div', { style: { display: 'flex', flexDirection: 'column', height: '70vh' } });
      new CodeEditor(b, { value: script.code, name: script.name, onSave: v => { script.code = v; pre.innerHTML = highlight(v); Toast.ok('حُدّث الاقتراح'); } });
      Sheet.open({ title: script.name, body: b, full: true, id: 'aipreview' });
    }}));
    const applyBtn = btn('Apply', { cls: 'sm primary', onclick: () => {
      if (applied) return;
      let entityId = null;
      if (script.attachTo) {
        if (script.attachTo === 'selected') entityId = this.engine.selection;
        else { const e = this.engine.findByName(script.attachTo); entityId = e ? e.id : null; }
      }
      const rec = { id: uid('s'), name: script.name, code: script.code, entityId, enabled: true };
      (this.project.scripts = this.project.scripts || []).push(rec);
      applied = rec; this.dirty = true; this.save(true);
      applyBtn.disabled = true;
      Toast.ok('أُضيف ' + script.name + (entityId ? ' وربط بالكائن' : ''));
    }});
    act.appendChild(applyBtn);
    act.appendChild(btn('Undo', { cls: 'sm danger', onclick: () => {
      if (!applied) { Toast.show('لم يُطبَّق بعد'); return; }
      this.project.scripts = this.project.scripts.filter(s => s.id !== applied.id);
      applied = null; applyBtn.disabled = false; this.dirty = true;
      Toast.ok('تم التراجع');
    }}));
    card.append(head, pre, act);
    return card;
  },

  openAISettings() {
    const c = AI.cfg();
    const body = el('div');
    const prov = el('select', { class: 'select' }, [
      el('option', { value: 'none', text: 'مولّد محلي (بلا اتصال)' }),
      el('option', { value: 'openai', text: 'OpenAI-compatible' }),
      el('option', { value: 'anthropic', text: 'Anthropic' })
    ]);
    prov.value = c.provider || 'none';
    const key = el('input', { class: 'input', type: 'password', value: c.apiKey || '', placeholder: 'sk-…' });
    const model = el('input', { class: 'input', value: c.model || '', placeholder: 'claude-sonnet-5 / gpt-4o-mini' });
    const base = el('input', { class: 'input', value: c.baseURL || '', placeholder: 'https://api.openai.com/v1' });
    body.append(field('المزوّد', prov), field('API Key', key), field('الموديل', model), field('Base URL (اختياري)', base));
    body.appendChild(el('p', { class: 'tiny', text: 'المفتاح يُحفظ في هذا المتصفح فقط ويُرسل مباشرة إلى المزوّد الذي اخترته.' }));
    Sheet.open({
      title: 'إعدادات AI', body, id: 'aicfg',
      foot: [btn(T('save'), { cls: 'primary', onclick: () => {
        AI.setCfg({ provider: prov.value, apiKey: key.value.trim(), model: model.value.trim(), baseURL: base.value.trim() });
        Toast.ok('حُفظ'); Sheet.top().close();
      }})]
    });
  },

  /* ---------------- api docs (rule 27) ---------------- */
  openAPIDocs() {
    const body = el('div');
    body.appendChild(el('p', { class: 'muted', style: { marginBottom: '12px', fontSize: '13px' },
      text: 'المحرك يوفّر الأدوات. منطق اللعبة ملكك. هذه كل الواجهات المتاحة لسكربتاتك.' }));
    const sb = el('div', { class: 'searchbar', style: { marginBottom: '12px' } });
    sb.appendChild(icon('search'));
    const si = el('input', { placeholder: 'ابحث في الـAPI…' });
    sb.appendChild(si); body.appendChild(sb);
    const list = el('div');
    const draw = (q = '') => {
      list.textContent = '';
      NX.API_DOCS.forEach(ns => {
        const ms = ns.m.filter(m => !q || (ns.ns + ' ' + m[0] + ' ' + m[1]).toLowerCase().includes(q.toLowerCase()));
        if (!ms.length) return;
        const d = el('details', { class: 'api-ns', open: !!q });
        const s = el('summary');
        s.append(el('b', { text: ns.ns }), el('span', { text: ns.desc }), icon('chev'));
        d.appendChild(s);
        ms.forEach(m => {
          const row = el('div', { class: 'api-m' });
          row.append(el('code', { text: m[0] }), el('p', { text: m[1] }));
          d.appendChild(row);
        });
        list.appendChild(d);
      });
    };
    draw();
    si.addEventListener('input', debounce(() => draw(si.value), 180));
    body.appendChild(list);
    body.appendChild(el('div', { class: 'ttl', style: { marginTop: '16px' }, text: 'دورة حياة السكربت' }));
    const pre = el('pre', { class: 'mono', style: { background: '#080a12', padding: '12px', borderRadius: '10px', overflowX: 'auto', direction: 'ltr', textAlign: 'left', fontSize: '11.5px' } });
    pre.innerHTML = highlight(NX.SCRIPT_TEMPLATE);
    body.appendChild(pre);
    Sheet.open({ title: T('apiDocs'), body, full: true, id: 'apidocs' });
  },

  /* ---------------- more ---------------- */
  openMore() {
    const body = el('div');
    const item = (ic, label, fn, cls) => {
      const b = el('button', { class: 'comp-row', style: { width: '100%', textAlign: 'start' }, onclick: () => { sheet.close(); fn(); } });
      b.append(icon(ic), el('b', { text: label }), icon('chev'));
      if (cls) b.classList.add(cls);
      return b;
    };
    body.append(
      item('save', 'حفظ المشروع', () => this.save()),
      item('play', 'تشغيل تجريبي', () => this.play()),
      item('share', 'نشر اللعبة · Publish', () => this.openPublish()),
      item('undo', 'تراجع عن آخر تغيير في المشهد', () => this.undo()),
      item('book', T('apiDocs'), () => this.openAPIDocs()),
      item('code', 'مدير الكود', () => this.openCode()),
      item('shield', 'الأمان و قواعد Firebase', () => NX.openSecurityPanel()),
      item('gear', T('settings'), () => NX.openSettings()),
      item('trash', 'تفريغ المشهد', async () => {
        if (!await Modal.confirm('تفريغ المشهد؟', 'تُحذف كل الكائنات وتبقى السكربتات.', 'تفريغ')) return;
        this.pushUndo(); this.engine.clear(); this.dirty = true; this.updateHud();
      })
    );
    const sheet = Sheet.open({ title: this.project.name, body, id: 'more' });
  },

  /* ---------------- play / preview ---------------- */
  async play() {
    if (this.playing) return;
    this._snapshot = JSON.stringify(this.engine.serialize());
    this.playing = true;
    Sheet.closeAll();
    $('#s-play').classList.add('on');
    $('#s-play').firstChild.firstChild.setAttribute('href', '#i-stop');
    this.engine.select(null);
    this.engine.helpers.visible = false;
    $('#sel-bar').classList.remove('in');
    this.updateEmptyState();

    /* play uses the scene's main camera when the developer set one */
    const mainCam = Array.from(this.engine.entities.values()).find(e => e.type === 'camera' && e.props.isMain)
      || Array.from(this.engine.entities.values()).find(e => e.type === 'camera');
    if (mainCam && mainCam.object3D) { this.engine.activeCamera = mainCam.object3D; this.engine._resize(); }
    this.engine.orbit.enabled = false;

    const overlay = el('div', { id: 'play-ui', style: { position: 'absolute', inset: '0', pointerEvents: 'none' } });
    $('#vp-wrap').appendChild(overlay);
    this._overlay = overlay;

    const logs = [];
    this.runtime = new Runtime(this.engine, {
      project: this.project, uiHost: overlay,
      onLog: (m, t) => { logs.push([m, t]); if (t === 'err') Toast.err(m.split('\n')[0]); if (this.editors.main) this.editors.main.log(m, t); }
    });
    try {
      await this.runtime.run();
      Toast.ok('تشغيل — اضغط ⏹ للعودة للتحرير');
    } catch (e) {
      Toast.err('خطأ عند التشغيل: ' + (e.message || e));
    }
  },

  async stopPlay() {
    if (!this.playing) return;
    this.playing = false;
    if (this.runtime) { this.runtime.stop(); this.runtime = null; }
    if (this._overlay) { this._overlay.remove(); this._overlay = null; }
    $('#s-play').classList.remove('on');
    $('#s-play').firstChild.firstChild.setAttribute('href', '#i-play');
    this.engine.helpers.visible = true;
    this.engine.activeCamera = this.engine.editorCam;
    this.engine.orbit.enabled = true;
    this.engine._resize();
    if (this._snapshot) await this.engine.load(JSON.parse(this._snapshot));
    this.updateHud();
  },

  /* ---------------- save / publish ---------------- */
  async save(silent) {
    if (!this.project) return;
    if (this.playing && this._snapshot) this.project.scene = JSON.parse(this._snapshot);
    else this.project.scene = this.engine.serialize();
    try {
      await Projects.save(this.project);
      this.dirty = false;
      this.updateHud();
      if (!silent) Toast.ok('حُفظ المشروع');
    } catch (e) {
      Toast.err('تعذّر الحفظ: ' + (e.message || e));
    }
  },

  openPublish() {
    const p = this.project;
    const prev = p.publishMeta || {};
    const body = el('div');
    const title = el('input', { class: 'input', value: prev.title || p.name });
    const desc = el('textarea', { class: 'textarea', value: prev.description || p.description || '' });
    const genre = el('select', { class: 'select' }, ['Action', 'Adventure', 'Racing', 'Puzzle', 'Simulation', 'RPG', 'Sandbox', 'Other']
      .map(g => el('option', { value: g, text: g })));
    genre.value = prev.genre || 'Other';
    body.append(NX.field('اسم اللعبة', title), NX.field(T('description'), desc), NX.field('التصنيف', genre));

    let coverBlob = null, iconBlob = null;
    const shot = el('div', { class: 'row', style: { marginBottom: '12px' } });
    const coverImg = el('img', { style: { width: '92px', height: '58px', objectFit: 'cover', borderRadius: '8px', background: '#11142a' } });
    if (prev.coverURL) coverImg.src = prev.coverURL;
    shot.append(coverImg, el('div', { style: { flex: '1' } }, [
      el('div', { class: 'tiny', text: 'الغلاف يُلتقط من مساحة العرض الحالية' }),
      btn('التقاط الآن', { cls: 'sm', onclick: async () => {
        this.engine.renderer.render(this.engine.scene, this.engine.activeCamera);
        coverBlob = await new Promise(r => this.engine.canvas.toBlob(r, 'image/webp', 0.85));
        coverImg.src = URL.createObjectURL(coverBlob);
        Toast.ok('التُقط الغلاف');
      }})
    ]));
    body.appendChild(shot);

    let vis = prev.visibility || 'public';
    const seg = el('div', { class: 'seg' }, [
      el('button', { class: vis === 'public' ? 'on' : '', text: 'PUBLIC', onclick: e => { vis = 'public'; segPick(seg, e.target); } }),
      el('button', { class: vis === 'private' ? 'on' : '', text: 'PRIVATE', onclick: e => { vis = 'private'; segPick(seg, e.target); } })
    ]);
    body.appendChild(NX.field(T('visibility'), seg));
    body.appendChild(el('p', { class: 'tiny', text: 'يُنشر المشهد والكود فقط — الأصول تبقى في المكتبة وتُحمَّل بالمعرّف عند التشغيل.' }));

    const sheet = Sheet.open({
      title: T('publish'), body, id: 'publish',
      foot: [btn('PUBLISH', { cls: 'primary', icon: 'share', onclick: async () => {
        if (!Backend.user) { Toast.err('سجّل الدخول أولًا'); return; }
        try {
          await this.save(true);
          let coverPath = prev.cover || null, coverURL = prev.coverURL || null;
          if (coverBlob) {
            const up = await Backend.upload(`games/${Backend.user.uid}/${p.projectId}/cover.webp`, coverBlob);
            coverPath = up.path; coverURL = up.url;
          }
          const meta = { title: title.value.trim() || p.name, description: desc.value.trim(), genre: genre.value, visibility: vis, cover: coverPath, coverURL };
          const rec = await Games.publish(p, meta);
          p.publishMeta = { ...meta, coverURL };
          await Projects.save(p);
          Toast.ok('نُشرت اللعبة');
          sheet.close();
          window.dispatchEvent(new CustomEvent('nx:platformRefresh'));
        } catch (e) {
          Toast.err('فشل النشر: ' + (e.message || e));
        }
      }})]
    });
  }
};

NX.Studio = Studio;
NX.CodeEditor = CodeEditor;
NX.highlight = highlight;
NX.AI = AI;
</script>
<script type="module">
/* ============================================================
   PART 8/8 · GAME PLATFORM + BOOT
   Outside the Studio: Games, Discover, Search, Create,
   My Games, Assets, Profile (rules 40-42).
   ============================================================ */
const NX = window.NX;
const { $, $$, el, btn, iconBtn, icon, esc, Sheet, Modal, Toast, T, LS, uid, fmtNum, fmtBytes, timeAgo, debounce, field, segPick } = NX;
const { Backend, Assets, Projects, Games, EngineCore, Runtime, Studio } = NX;

/* ============================================================
   GAME PLAYER
   Code from another author never runs without consent (rule 48).
   ============================================================ */
const Player = {
  engine: null, runtime: null, gameId: null,

  async open(game) {
    const build = await Games.build(game.gameId);
    if (!build) { Toast.err('لا توجد نسخة منشورة لهذه اللعبة'); return; }

    const mine = Backend.user && build.ownerId === Backend.user.uid;
    const hasCode = (build.scripts || []).length || (build.components || []).length;
    if (!mine && hasCode) {
      const okToRun = await this.consent(game, build);
      if (!okToRun) return;
    }

    NX.Screen.show('player');
    $('#p-load').classList.remove('hide');
    $('#p-load-txt').textContent = 'تحميل ' + game.title + '…';
    $('#player-ui').textContent = '';
    this.gameId = game.gameId;

    try {
      if (!this.engine) this.engine = new EngineCore($('#player-canvas'), { mode: 'runtime' });
      this.engine.start();
      await this.engine.load(build.scene || { objects: [] });
      const cam = Array.from(this.engine.entities.values()).find(e => e.type === 'camera' && e.props.isMain)
        || Array.from(this.engine.entities.values()).find(e => e.type === 'camera');
      if (cam && cam.object3D) { this.engine.activeCamera = cam.object3D; this.engine._resize(); }

      this.runtime = new Runtime(this.engine, {
        project: { projectId: build.gameId, publishedId: build.gameId, scripts: build.scripts || [], components: build.components || [], assetRefs: build.assetRefs || [] },
        uiHost: $('#player-ui'),
        trusted: !!mine,
        onLog: (m, t) => { if (t === 'err') console.error('[game]', m); else console.log('[game]', m); }
      });
      await this.runtime.run();
      $('#p-load').classList.add('hide');
      Games.recordPlay(game.gameId);
    } catch (e) {
      $('#p-load-txt').textContent = 'تعذّر تشغيل اللعبة: ' + (e.message || e);
      console.error(e);
    }
  },

  consent(game, build) {
    return new Promise(res => {
      const key = 'trust.' + game.gameId;
      if (LS.get(key, false)) return res(true);
      const body = el('div');
      body.appendChild(el('p', { class: 'muted', style: { fontSize: '13.5px', lineHeight: '1.7' },
        text: `هذه اللعبة تحتوي على كود كتبه @${game.creatorName}. الأصول لا تُنفَّذ أبدًا — لكن كود اللعبة يعمل داخل صندوق المحرك. يمكنك قراءته قبل التشغيل.` }));
      const list = el('div', { style: { marginTop: '10px' } });
      (build.scripts || []).concat(build.components || []).forEach(s => {
        list.appendChild(btn(s.name, { cls: 'block sm ghost', onclick: () => {
          const b = el('div');
          const pre = el('pre', { class: 'mono', style: { background: '#080a12', padding: '12px', borderRadius: '10px', overflowX: 'auto', direction: 'ltr', textAlign: 'left', fontSize: '11.5px', maxHeight: '60vh' } });
          pre.innerHTML = NX.highlight(s.code || '');
          b.appendChild(pre);
          Sheet.open({ title: s.name, body: b, full: true, id: 'codeview' });
        }}));
      });
      body.appendChild(list);
      Modal.open({
        title: 'تشغيل كود من مطوّر آخر؟',
        body,
        actions: [
          { label: T('cancel'), cls: 'ghost', onclick: () => res(false) },
          { label: 'تشغيل', cls: 'primary', onclick: () => { LS.set(key, true); res(true); } }
        ]
      });
    });
  },

  close() {
    if (this.runtime) { this.runtime.stop(); this.runtime = null; }
    if (this.engine) { this.engine.stop(); this.engine.clear(); }
    $('#player-ui').textContent = '';
    NX.Screen.show('platform');
  }
};

/* ============================================================
   PLATFORM UI
   ============================================================ */
const Platform = {
  tab: 'games',

  init() {
    const tabs = $('#p-tabs');
    const items = [
      ['cube', T('games'), 'games'], ['compass', T('discover'), 'discover'], ['plus', T('create'), 'create'],
      ['folder', T('mygames'), 'mygames'], ['image', T('assets'), 'assets'], ['user', T('profile'), 'profile']
    ];
    items.forEach(([ic, label, key]) => {
      const b = el('button', { onclick: () => this.go(key) });
      b.appendChild(icon(ic)); b.appendChild(el('span', { text: label }));
      b.dataset.tab = key;
      tabs.appendChild(b);
    });
    $('#btn-search').onclick = () => this.openSearch();
    $('#btn-settings').onclick = () => openSettings();
    $('#btn-me').onclick = () => this.go('profile');
    $('#p-exit').onclick = () => Player.close();
    Backend.onAuth(u => {
      const a = $('#btn-me');
      a.textContent = '';
      if (u && u.photo) a.appendChild(el('img', { src: u.photo }));
      else a.textContent = (u && u.name ? u.name[0] : '?').toUpperCase();
      if (this.tab === 'profile' || this.tab === 'mygames') this.render();
    });
    window.addEventListener('nx:platformRefresh', () => this.render());
  },

  go(tab) {
    this.tab = tab;
    $$('#p-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    NX.Screen.show('platform');
    this.render();
  },

  async render() {
    const body = $('#p-body');
    if (this._lib && this.tab !== 'assets') { this._lib.destroy(); this._lib = null; }
    body.textContent = '';
    body.scrollTop = 0;
    const fn = this['view_' + this.tab];
    if (fn) await fn.call(this, body);
  },

  loading(host, n = 4) {
    const g = el('div', { class: 'grid' });
    for (let i = 0; i < n; i++) g.appendChild(el('div', { class: 'skel', style: { aspectRatio: '16/13' } }));
    host.appendChild(g);
    return g;
  },

  gameCard(g) {
    const c = el('div', { class: 'gcard', onclick: () => this.openGame(g) });
    const cover = el('div', { class: 'cover' });
    if (g.coverURL || g.cover) {
      const img = el('img', { alt: g.title });
      Backend.fileURL(g.cover, g.coverURL).then(u => { if (u) img.src = u; });
      cover.appendChild(img);
    } else cover.appendChild(el('div', { class: 'ph', text: '◆' }));
    const meta = el('div', { class: 'meta' }, [
      el('b', { text: g.title }),
      el('span', { class: 'by', text: '@' + (g.creatorName || 'creator') })
    ]);
    const stats = el('div', { class: 'stats' });
    stats.append(
      el('span', { text: '▶ ' + fmtNum(g.plays || 0) }),
      el('span', { text: '♥ ' + fmtNum(g.likes || 0) })
    );
    meta.appendChild(stats);
    c.append(cover, meta);
    return c;
  },

  /* ---------------- Games ---------------- */
  async view_games(host) {
    const hero = el('div', { class: 'hero' });
    hero.append(
      el('h1', { text: 'محرك فارغ. أنت من يملؤه.' }),
      el('p', { text: 'لا مكتبة مجسمات جاهزة ولا ألعاب قوالب. ارفع أصولك، اكتب كودك، انشر لعبتك.' })
    );
    const arch = el('div', { class: 'arch' });
    ['EMPTY CORE ENGINE', 'USER CODE', 'USER ASSETS', 'PUBLIC LIBRARY', 'AI ASSISTANT', 'FIREBASE', 'GAME PLATFORM']
      .forEach(t => arch.appendChild(el('span', { text: t })));
    hero.appendChild(arch);
    hero.appendChild(btn('ابدأ مشروعًا فارغًا', { cls: 'primary', icon: 'plus', onclick: () => this.newProject() }));
    host.appendChild(hero);

    host.appendChild(el('div', { class: 'sec-head' }, [el('h2', { text: 'الأحدث' })]));
    const g1 = this.loading(host);
    const recent = await Games.list({ sort: 'new', limit: 12 });
    g1.remove();
    if (!recent.length) host.appendChild(this.emptyNote('لا توجد ألعاب منشورة بعد', 'أنشئ أول لعبة على هذه المنصة.'));
    else { const g = el('div', { class: 'grid' }); recent.forEach(x => g.appendChild(this.gameCard(x))); host.appendChild(g); }

    const most = await Games.list({ sort: 'plays', limit: 8 });
    if (most.length) {

  async openGame(g) {

      const img = el('img', { style: { width: '100%', borderRadius: '14px', marginBottom: '12px' } });

    }
    body.appendChild(el('p', { class: 'muted', style: { fontSize: '13.5px' }, text: g.description || 'بلا وصف' }));

    [[T('creator'), '@' + g.creatorName], ['Genre', g.genre], [T('plays'), fmtNum(g.plays || 0)], [T('likes'), fmtNum(g.likes || 0)],
     [T('created'), timeAgo(g.createdAt)], [T('updated'), timeAgo(g.updatedAt)]]

      try {
        const on = await Games.toggleLike(g.gameId);

function openSecurityPanel() {
  const body = el('div');
  body.appendChild(el('div', { class: 'card', style: { marginBottom: '12px' } }, [
    el('b', { text: 'الأصول ≠ الكود' }),
    el('p', { class: 'tiny', style: { marginTop: '6px', lineHeight: '1.8' },
      text: '• الأصول (GLB/صور/صوت) بيانات فقط ولا تُنفَّذ أبدًا؛ لا يُقبل رفع ملفات سكربت كأصول.\n• كود اللعبة يخصّ المشروع لا الأصل، ويعمل داخل نطاق مقيَّد لا يرى window أو fetch أو التخزين.\n• كود مطوّر آخر لا يعمل إلا بموافقتك الصريحة، ويمكنك قراءته قبل التشغيل.\n• التقييد داخل الصفحة حاجز سلامة لا حاجز أمني مطلق — لذلك توجد بوابة الموافقة.' })
  ]));
  const mk = (title, text) => {
    const d = el('details', { class: 'acc' });
    d.appendChild(el('summary', { text: title }));
    const b = el('div', { class: 'acc-body' });
    const pre = el('pre', { class: 'mono', style: { background: '#080a12', padding: '11px', borderRadius: '10px', overflowX: 'auto', fontSize: '10.5px', direction: 'ltr', textAlign: 'left', maxHeight: '340px' }, text });
    b.appendChild(pre);
    b.appendChild(btn('نسخ', { cls: 'sm block', style: { marginTop: '8px' }, onclick: async () => { try { await navigator.clipboard.writeText(text); Toast.ok('نُسخ'); } catch { Toast.err('تعذّر النسخ'); } } }));
    d.appendChild(b);
    return d;
  };
  body.appendChild(el('p', { class: 'tiny', style: { marginBottom: '8px' }, text: 'الصقها في Firebase Console — العدادات والملكية تُفرض على الخادم لا في المتصفح.' }));
  body.appendChild(mk('Firestore Rules', NX.SECURITY_RULES.firestore));
  body.appendChild(mk('Storage Rules', NX.SECURITY_RULES.storage));
  Sheet.open({ title: 'الأمان', body, full: true, id: 'security' });
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  try {
    await Backend.init();
  } catch (e) {
    console.error('backend init failed', e);
  }
  Platform.init();
  Platform.go('games');
  NX.__booted = true;

  if (!Backend.isOnline()) {
    setTimeout(() => Toast.show('وضع محلي — اضبط Firebase من الإعدادات للمشاركة', '', 5200), 900);
  }

  /* deep links: #game/<id> · #project/<id> */
  const route = async () => {
    const h = location.hash.slice(1);
    if (h.startsWith('game/')) {
      const g = await Games.get(h.slice(5));
      if (g) Platform.openGame(g);
    } else if (h.startsWith('project/')) {
      const p = await Projects.get(h.slice(8));
      if (p) Studio.open(p);
    }
  };
  window.addEventListener('hashchange', route);
  route();

  /* leaving with unsaved studio work */
  window.addEventListener('beforeunload', e => {
    if (Studio.project && Studio.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  /* mobile back button closes the top sheet before leaving the screen */
  window.addEventListener('popstate', () => { if (Sheet.top()) Sheet.top().close(); });
})();
</script>
