import * as THREE from 'three';
const NX = window.NX;
const { uid, clamp } = NX;

/* ------------------------------------------------------------
   LOADERS + ASSET CACHE (lazy, shared, reference-counted)
   ------------------------------------------------------------ */
const Loaders = {
  _gltf: null, _obj: null, _fbx: null, _tex: new THREE.TextureLoader(), _audio: null, _skelUtils: null,

  async gltf() {
    if (!this._gltf) {
      const [{ GLTFLoader }, { DRACOLoader }] = await Promise.all([
        import('three/addons/loaders/GLTFLoader.js'),
        import('three/addons/loaders/DRACOLoader.js')
      ]);
      const l = new GLTFLoader();
      try {
        const d = new DRACOLoader();
        d.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/libs/draco/');
        l.setDRACOLoader(d);
      } catch {}
      this._gltf = l;
    }
    return this._gltf;
  },
  async obj() { if (!this._obj) this._obj = new (await import('three/addons/loaders/OBJLoader.js')).OBJLoader(); return this._obj; },
  async fbx() {
    if (this._fbx === false) throw new Error('FBX_UNAVAILABLE');
    if (!this._fbx) {
      try { this._fbx = new (await import('three/addons/loaders/FBXLoader.js')).FBXLoader(); }
      catch (e) { this._fbx = false; throw new Error('FBX_UNAVAILABLE'); }
    }
    return this._fbx;
  },
  async skeletonUtils() {
    if (!this._skelUtils) this._skelUtils = await import('three/addons/utils/SkeletonUtils.js');
    return this._skelUtils;
  },

  extOf(nameOrPath) { return String(nameOrPath || '').split('?')[0].split('.').pop().toLowerCase(); },

  kindOf(ext) {
    if (['glb', 'gltf', 'obj', 'fbx'].includes(ext)) return 'model';
    if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp', 'ktx2'].includes(ext)) return 'image';
    if (['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'].includes(ext)) return 'audio';
    return 'data';
  },

  /* Parse a model from raw bytes. Returns { object, animations, gltf? } */
  async parseModel(buffer, ext, resourcePath = '') {
    if (ext === 'glb' || ext === 'gltf') {
      const l = await this.gltf();
      const gltf = await new Promise((res, rej) => {
        try {
          if (ext === 'gltf') {
            const txt = new TextDecoder().decode(buffer);
            l.parse(txt, resourcePath, res, rej);
          } else l.parse(buffer, resourcePath, res, rej);
        } catch (e) { rej(e); }
      });
      return { object: gltf.scene, animations: gltf.animations || [], gltf };
    }
    if (ext === 'obj') {
      const l = await this.obj();
      return { object: l.parse(new TextDecoder().decode(buffer)), animations: [] };
    }
    if (ext === 'fbx') {
      const l = await this.fbx();
      const o = l.parse(buffer, resourcePath);
      return { object: o, animations: o.animations || [] };
    }
    throw new Error('UNSUPPORTED_MODEL:' + ext);
  },

  async fetchBuffer(url, onProgress) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP_' + r.status);
    const total = Number(r.headers.get('content-length')) || 0;
    if (!onProgress || !r.body) return r.arrayBuffer();
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) onProgress(got / total);
    }
    const out = new Uint8Array(got); let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out.buffer;
  },

  /* Auto-extracted metadata (rule 16) — read from the real file */
  analyze(object, animations) {
    const stats = { meshes: 0, materials: 0, textures: 0, triangles: 0, vertices: 0, animations: (animations || []).length, skinned: false, bones: 0, bbox: null, size: null };
    const mats = new Set(), texs = new Set();
    object.traverse(n => {
      if (n.isSkinnedMesh) { stats.skinned = true; if (n.skeleton) stats.bones = Math.max(stats.bones, n.skeleton.bones.length); }
      if (n.isBone) stats.bones = Math.max(stats.bones, 1);
      if (!n.isMesh || !n.geometry) return;
      stats.meshes++;
      const g = n.geometry;
      const pos = g.attributes && g.attributes.position;
      if (pos) stats.vertices += pos.count;
      stats.triangles += g.index ? g.index.count / 3 : (pos ? pos.count / 3 : 0);
      (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => {
        if (!m) return; mats.add(m.uuid);
        ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap','alphaMap'].forEach(k => { if (m[k]) texs.add(m[k].uuid); });
      });
    });
    stats.materials = mats.size; stats.textures = texs.size;
    stats.triangles = Math.round(stats.triangles);
    const box = new THREE.Box3().setFromObject(object);
    if (isFinite(box.min.x)) {
      const s = box.getSize(new THREE.Vector3());
      stats.bbox = { min: box.min.toArray().map(n => +n.toFixed(3)), max: box.max.toArray().map(n => +n.toFixed(3)) };
      stats.size = s.toArray().map(n => +n.toFixed(3));
    }
    stats.animationNames = (animations || []).map(a => a.name).slice(0, 24);
    return stats;
  }
};

/* Shared, reference-counted cache so one asset is fetched once per session (rule 47) */
const AssetCache = {
  _mem: new Map(),        // assetId -> {object, animations, stats}
  _pending: new Map(),

  async load(asset, onProgress) {
    const id = asset.assetId;
    if (this._mem.has(id)) return this._mem.get(id);
    if (this._pending.has(id)) return this._pending.get(id);
    const p = (async () => {
      const url = await NX.Assets.url(asset);
      if (!url) throw new Error('ASSET_URL_MISSING');
      const ext = asset.fileType || Loaders.extOf(asset.storagePath);
      const kind = asset.kind || Loaders.kindOf(ext);
      let entry;
      if (kind === 'model') {
        const buf = await Loaders.fetchBuffer(url, onProgress);
        const { object, animations } = await Loaders.parseModel(buf, ext, url.replace(/[^/]*$/, ''));
        object.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
        entry = { kind, object, animations, stats: asset.stats || Loaders.analyze(object, animations) };
      } else if (kind === 'image') {
        const tex = await new Promise((res, rej) => Loaders._tex.load(url, res, undefined, rej));
        tex.colorSpace = THREE.SRGBColorSpace;
        entry = { kind, texture: tex };
      } else if (kind === 'audio') {
        const buf = await Loaders.fetchBuffer(url, onProgress);
        entry = { kind, buffer: buf, url };
      } else {
        const r = await fetch(url); entry = { kind, text: await r.text(), url };
      }
      this._mem.set(id, entry);
      this._pending.delete(id);
      return entry;
    })();
    this._pending.set(id, p);
    return p;
  },

  async instantiate(asset, onProgress) {
    const entry = await this.load(asset, onProgress);
    if (entry.kind === 'model') {
      let clone;
      if (entry.stats && entry.stats.skinned) {
        const SU = await Loaders.skeletonUtils();
        clone = SU.clone(entry.object);
      } else {
        clone = entry.object.clone(true);   // geometries + materials stay shared
      }
      return { object: clone, animations: entry.animations, stats: entry.stats };
    }
    if (entry.kind === 'image') {
      const g = new THREE.PlaneGeometry(1, 1);
      const m = new THREE.MeshStandardMaterial({ map: entry.texture, transparent: true, side: THREE.DoubleSide });
      const im = entry.texture.image;
      const ar = im && im.width ? im.width / im.height : 1;
      const mesh = new THREE.Mesh(g, m); mesh.scale.set(ar, 1, 1);
      return { object: mesh, animations: [], stats: null };
    }
    if (entry.kind === 'audio') {
      const marker = new THREE.Group(); marker.userData.audioURL = entry.url;
      return { object: marker, animations: [], stats: null, audio: entry };
    }
    return { object: new THREE.Group(), animations: [], stats: null };
  },

  dispose(id) {
    const e = this._mem.get(id); if (!e) return;
    if (e.object) e.object.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => m && m.dispose && m.dispose());
    });
    if (e.texture) e.texture.dispose();
    this._mem.delete(id);
  },
  clear() { Array.from(this._mem.keys()).forEach(k => this.dispose(k)); }
};

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
let ENTITY_N = 0;
class Entity {
  constructor(def = {}) {

    this.type = def.type || 'group';
    this.assetId = def.assetId || null;
    this.props = Object.assign({}, def.props);
    this.components = (def.components || []).map(c => ({ id: c.id || uid('c'), type: c.type, name: c.name || c.type, data: Object.assign({}, c.data), enabled: c.enabled !== false }));

    this.mixer = null;
    this.parentId = def.parentId || null;
    this.tag = def.tag || '';

  }
  serialize() {
    const o = this.object3D;
    return {
      id: this.id, name: this.name, type: this.type, assetId: this.assetId, tag: this.tag,
      parentId: this.parentId,
      position: o ? o.position.toArray().map(n => +n.toFixed(4)) : [0, 0, 0],
      rotation: o ? [o.rotation.x, o.rotation.y, o.rotation.z].map(n => +n.toFixed(4)) : [0, 0, 0],
      scale: o ? o.scale.toArray().map(n => +n.toFixed(4)) : [1, 1, 1],
      visible: o ? o.visible : true,
      props: this.props,
      components: this.components
    };
  }
}

/* ------------------------------------------------------------
   ORBIT CAMERA — touch first (rule 24)
   ------------------------------------------------------------ */
class OrbitCam {
  constructor(camera, dom) {
    this.cam = camera; this.dom = dom;
    this.target = new THREE.Vector3(0, 0.8, 0);
    this.radius = 9; this.theta = Math.PI * 0.25; this.phi = Math.PI * 0.35;
    this.minR = 0.6; this.maxR = 400; this.enabled = true;
    this.apply();
  }
  apply() {
    this.phi = clamp(this.phi, 0.06, Math.PI - 0.06);
    this.radius = clamp(this.radius, this.minR, this.maxR);
    const s = Math.sin(this.phi);
    this.cam.position.set(
      this.target.x + this.radius * s * Math.sin(this.theta),
      this.target.y + this.radius * Math.cos(this.phi),
      this.target.z + this.radius * s * Math.cos(this.theta)
    );
    this.cam.lookAt(this.target);
  }
  orbit(dx, dy) { if (!this.enabled) return; this.theta -= dx * 0.0062; this.phi -= dy * 0.0062; this.apply(); }
  zoom(f) { if (!this.enabled) return; this.radius *= f; this.apply(); }
  pan(dx, dy) {
    if (!this.enabled) return;
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    this.cam.matrixWorld.extractBasis(right, up, new THREE.Vector3());
    const k = this.radius * 0.0016;
    this.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
    this.apply();
  }
  frame(box) {
    if (!box || !isFinite(box.min.x)) return;
    const c = box.getCenter(new THREE.Vector3());
    const r = Math.max(0.4, box.getSize(new THREE.Vector3()).length() * 0.5);
    this.target.copy(c);
    this.radius = r / Math.tan((this.cam.fov * Math.PI / 180) / 2) * 1.25;
    this.apply();
  }
}

/* ------------------------------------------------------------
   SIMPLE PHYSICS — AABB / sphere, gravity, raycast, character
   ------------------------------------------------------------ */
class Physics {
  constructor(engine) {
    this.engine = engine;
    this.gravity = new THREE.Vector3(0, -22, 0);
    this.bodies = new Map();   // entityId -> body
    this._ray = new THREE.Raycaster();
    this._box = new THREE.Box3();
    this._tmpA = new THREE.Vector3();
    this._tmpB = new THREE.Vector3();
  }
  add(entity, opts = {}) {
    const body = {
      entityId: entity.id, entity,
      type: opts.type || 'dynamic',             // static | dynamic | character
      velocity: new THREE.Vector3(),
      mass: opts.mass == null ? 1 : opts.mass,
      restitution: opts.restitution == null ? 0 : opts.restitution,
      friction: opts.friction == null ? 8 : opts.friction,
      useGravity: opts.useGravity !== false,
      grounded: false,
      box: new THREE.Box3(),
      shape: opts.shape || 'box',
      radius: opts.radius || 0.5,
      height: opts.height || 1.8,
      trigger: !!opts.trigger,
      onCollide: null

    this.bodies.set(entity.id, body);
    this.syncBox(body);
    return body;
  }
  remove(id) { this.bodies.delete(id); }
  get(id) { return this.bodies.get(id); }
  syncBox(b) {
    const o = b.entity.object3D; if (!o) return;
    if (b.shape === 'capsule' || b.shape === 'sphere') {
      const p = o.position, r = b.radius, h = b.shape === 'capsule' ? b.height : r * 2;
      b.box.min.set(p.x - r, p.y, p.z - r);
      b.box.max.set(p.x + r, p.y + h, p.z + r);
    } else {
      b.box.setFromObject(o);
    }
  }
  step(dt) {
    const statics = [], dynamics = [];
    for (const b of this.bodies.values()) {
      if (!b.entity.object3D) continue;
      if (b.type === 'static') { this.syncBox(b); statics.push(b); } else dynamics.push(b);
    }
    for (const b of dynamics) {
      const o = b.entity.object3D;
      if (b.useGravity) b.velocity.addScaledVector(this.gravity, dt);
      if (b.type === 'character') {
        const damp = Math.exp(-b.friction * dt);
        b.velocity.x *= damp; b.velocity.z *= damp;
      }
      o.position.addScaledVector(b.velocity, dt);
      this.syncBox(b);
      b.grounded = false;
      for (const s of statics) {
        if (!b.box.intersectsBox(s.box)) continue;
        if (b.trigger || s.trigger) { b.onCollide && b.onCollide(s.entity, true); s.onCollide && s.onCollide(b.entity, true); continue; }
        /* minimum translation vector on the smallest overlap axis */
        const ox = Math.min(b.box.max.x - s.box.min.x, s.box.max.x - b.box.min.x);
        const oy = Math.min(b.box.max.y - s.box.min.y, s.box.max.y - b.box.min.y);
        const oz = Math.min(b.box.max.z - s.box.min.z, s.box.max.z - b.box.min.z);
        const m = Math.min(ox, oy, oz);
        const cb = b.box.getCenter(this._tmpA), cs = s.box.getCenter(this._tmpB);
        if (m === oy) {
          const up = cb.y > cs.y;
          o.position.y += up ? oy : -oy;
          if (up) { b.grounded = true; if (b.velocity.y < 0) b.velocity.y = -b.velocity.y * b.restitution; }
          else if (b.velocity.y > 0) b.velocity.y = 0;
        } else if (m === ox) {
          o.position.x += cb.x > cs.x ? ox : -ox; b.velocity.x = -b.velocity.x * b.restitution;
        } else {
          o.position.z += cb.z > cs.z ? oz : -oz; b.velocity.z = -b.velocity.z * b.restitution;
        }
        this.syncBox(b);
        b.onCollide && b.onCollide(s.entity, false);
        s.onCollide && s.onCollide(b.entity, false);
      }
    }
  }
  raycast(origin, dir, far = 1000) {
    this._ray.set(origin, dir.clone().normalize());
    this._ray.far = far;
    const hits = this._ray.intersectObject(this.engine.root, true);
    for (const h of hits) {
      const e = this.engine.entityOf(h.object);
      if (e) return { entity: e, point: h.point, distance: h.distance, normal: h.face ? h.face.normal : null, object: h.object };
    }
    return null;
  }
}

/* ------------------------------------------------------------
   ENGINE CORE
   ------------------------------------------------------------ */
class EngineCore {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.mode = opts.mode || 'editor';        // 'editor' | 'runtime'
    this.entities = new Map();
    this.listeners = {};
    this.running = false;
    this.time = { t: 0, dt: 0, frame: 0, scale: 1 };
    this._clock = new THREE.Clock();
    this._acc = 0;
    this._updates = [];

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.renderer = new THREE.WebGLRenderer({
      canvas, antialias: dpr < 2, alpha: false,
      powerPreference: 'high-performance', stencil: false

    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;

    this.scene.add(this.root);

    this.editorCam = new THREE.PerspectiveCamera(58, 1, 0.08, 4000);
    this.activeCamera = this.editorCam;
    this.orbit = new OrbitCam(this.editorCam, canvas);
    this.physics = new Physics(this);

    /* editor-only helpers */
    this.helpers = new THREE.Group(); this.helpers.name = '__helpers';
    this.scene.add(this.helpers);
    if (this.mode === 'editor') {
      this.grid = new THREE.GridHelper(80, 80, 0x3a3f66, 0x1b1f33);
      this.grid.material.transparent = true; this.grid.material.opacity = 0.65;
      this.helpers.add(this.grid);
      this.selBox = new THREE.BoxHelper(undefined, 0x7c5cff);
      this.selBox.visible = false; this.helpers.add(this.selBox);
    }

    this.selection = null;
    this.gizmo = 'move';
    this.gizmoAxis = 'xz';
    this._raycaster = new THREE.Raycaster();
    this._resize();
    this._ro = new ResizeObserver(() => this._resize());
    this._ro.observe(canvas.parentElement || canvas);
    window.addEventListener('orientationchange', () => setTimeout(() => this._resize(), 260));
    if (this.mode === 'editor') this._bindEditorInput();
  }

  /* ---------- events ---------- */
  on(ev, cb) { (this.listeners[ev] = this.listeners[ev] || []).push(cb); return () => this.off(ev, cb); }
  off(ev, cb) { const a = this.listeners[ev]; if (a) { const i = a.indexOf(cb); if (i >= 0) a.splice(i, 1); } }
  emit(ev, data) { (this.listeners[ev] || []).forEach(cb => { try { cb(data); } catch (e) { console.error(e); } }); }

  _resize() {
    const host = this.canvas.parentElement || this.canvas;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    this.renderer.setSize(w, h, false);
    const cams = [this.editorCam, ...Array.from(this.entities.values()).filter(e => e.type === 'camera' && e.object3D).map(e => e.object3D)];
    cams.forEach(c => { if (c.isPerspectiveCamera) { c.aspect = w / h; c.updateProjectionMatrix(); } });
  }

  /* ---------- entities ---------- */
  async addEntity(def, opts = {}) {

  animations() { return (this._e.animations || []).map(a => a.name); }
  play(name, opts = {}) {
    const e = this._e;
    if (!e.animations || !e.animations.length) return null;
    if (!e.mixer) e.mixer = new THREE.AnimationMixer(e.object3D);
    const clip = name ? e.animations.find(a => a.name === name) : e.animations[0];
    if (!clip) return null;
    const act = e.mixer.clipAction(clip);
    if (e._currentAction && e._currentAction !== act) e._currentAction.fadeOut(opts.fade == null ? 0.22 : opts.fade);
    act.reset().setLoop(opts.once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity).fadeIn(opts.fade == null ? 0.22 : opts.fade).play();
    act.clampWhenFinished = !!opts.once;
    act.timeScale = opts.speed == null ? 1 : opts.speed;
    e._currentAction = act;
    return act;
  }
  stopAnimation() { if (this._e.mixer) this._e.mixer.stopAllAction(); }

  /* physics */
  addBody(opts) { return this._rt.engine.physics.add(this._e, opts); }
  get body() { return this._rt.engine.physics.get(this._e.id); }
  get velocity() { const b = this.body; return b ? b.velocity : V3(); }
  onCollide(fn) { const b = this.body || this.addBody({ type: 'static' }); b.onCollide = (other, isTrigger) => fn(new GameObject(other, this._rt), isTrigger); return this; }

  /* custom components authored by the user (rule 28) */
  addComponent(name, data) { return this._rt.attachComponent(this._e, name, data); }
  getComponent(name) { return (this._e._compInstances || []).find(c => c.name === name) || null; }

  child(name) {
    const kid = Array.from(this._rt.engine.entities.values()).find(e => e.parentId === this._e.id && e.name === name);
    return kid ? new GameObject(kid, this._rt) : null;
  }
  children() { return Array.from(this._rt.engine.entities.values()).filter(e => e.parentId === this._e.id).map(e => new GameObject(e, this._rt)); }
  destroy() { this._rt.engine.removeEntity(this._e.id); }
}

/* ------------------------------------------------------------
   MICROPHONE (rule 34)
   ------------------------------------------------------------ */
const Mic = {
  stream: null, ctx: null, analyser: null, source: null, gain: null, dest: null,
  muted: false, active: false, _data: null, _cbs: [], _raf: null, _recorder: null, _chunks: [],

  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); },
  async permission() {
    if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
    try { return (await navigator.permissions.query({ name: 'microphone' })).state; } catch { return 'unknown'; }
  },
  async request(constraints = {}) {
    if (!this.supported()) throw new Error('MIC_UNSUPPORTED');
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: Object.assign({ echoCancellation: true, noiseSuppression: true, autoGainControl: true }, constraints)
    });
    this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.source = this.ctx.createMediaStreamSource(this.stream);
    this.gain = this.ctx.createGain();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.dest = this.ctx.createMediaStreamDestination();
    this.source.connect(this.gain); this.gain.connect(this.analyser); this.gain.connect(this.dest);
    this._data = new Uint8Array(this.analyser.frequencyBinCount);
    return true;
  },
  async start() { if (!this.stream) await this.request(); this.active = true; this.unmute(); this._loop(); return true; },
  stop() {
    this.active = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.source = this.analyser = this.gain = null;
  },
  mute() { this.muted = true; if (this.gain) this.gain.gain.value = 0; if (this.stream) this.stream.getAudioTracks().forEach(t => t.enabled = false); },
  unmute() { this.muted = false; if (this.gain) this.gain.gain.value = 1; if (this.stream) this.stream.getAudioTracks().forEach(t => t.enabled = true); },
  toggle() { this.muted ? this.unmute() : this.mute(); return !this.muted; },
  /* hold to talk: pass true on press, false on release */
  pushToTalk(down) { down ? this.unmute() : this.mute(); },
  get level() {
    if (!this.analyser || this.muted) return 0;
    this.analyser.getByteTimeDomainData(this._data);
    let sum = 0;
    for (let i = 0; i < this._data.length; i++) { const v = (this._data[i] - 128) / 128; sum += v * v; }
    return Math.sqrt(sum / this._data.length);
  },
  onLevel(cb) { this._cbs.push(cb); return () => { const i = this._cbs.indexOf(cb); if (i >= 0) this._cbs.splice(i, 1); }; },
  _loop() {
    if (!this.active) return;
    this._raf = requestAnimationFrame(() => this._loop());
    if (this._cbs.length) { const l = this.level; this._cbs.forEach(c => { try { c(l); } catch (e) {} }); }
  },
  /* raw capture for the developer to do what they like with */
  startRecording() {
    if (!this.stream) throw new Error('MIC_NOT_STARTED');
    this._chunks = [];
    this._recorder = new MediaRecorder(this.stream);
    this._recorder.ondataavailable = e => { if (e.data.size) this._chunks.push(e.data); };
    this._recorder.start();
  },
  stopRecording() {
    return new Promise(res => {
      if (!this._recorder) return res(null);
      this._recorder.onstop = () => res(new Blob(this._chunks, { type: 'audio/webm' }));
      this._recorder.stop(); this._recorder = null;
    });
  },
  outputStream() { return this.dest ? this.dest.stream : null }
};

/* ------------------------------------------------------------
   NETWORK HOOKS + VOICE
   Real transport requires a backend. With Firebase configured the
   room/signalling layer below works; in LOCAL mode it refuses
   honestly instead of pretending to be connected.
   ------------------------------------------------------------ */
function makeNetwork(rt) {
  const Backend = NX.Backend;
  return {
    get online() { return Backend.isOnline(); },
    get uid() { return Backend.user ? Backend.user.uid : null; },

    /* A room = presence docs + an append-only message stream. */
    async room(roomId, opts = {}) {
      if (!Backend.isOnline()) throw new Error('NETWORK_REQUIRES_BACKEND: configure Firebase in Settings to use rooms.');
      const { F, db } = Backend.fb;
      const me = Backend.user.uid;
      const base = ['rooms', String(roomId)];
      const peersCol = F.collection(db, ...base, 'peers');
      const msgCol = F.collection(db, ...base, 'messages');
      const meRef = F.doc(db, ...base, 'peers', me);
      await F.setDoc(meRef, { uid: me, name: Backend.user.name, at: Date.now(), state: opts.state || {} });
      const peers = new Map();
      const handlers = {};
      const room = {
        id: String(roomId), me,
        peers,
        on(ev, cb) { (handlers[ev] = handlers[ev] || []).push(cb); return room; },
        _emit(ev, ...a) { (handlers[ev] || []).forEach(cb => { try { cb(...a); } catch (e) { rt.error(e); } }); },
        async setState(patch) { await F.setDoc(meRef, { uid: me, name: Backend.user.name, at: Date.now(), state: patch }, { merge: true }); },
        async send(type, data) {
          await F.addDoc(msgCol, { type, data: data == null ? null : data, from: me, at: Date.now() });
        },
        async leave() { unsubP(); unsubM(); try { await F.deleteDoc(meRef); } catch {} clearInterval(hb); }
      };
      const hb = setInterval(() => F.setDoc(meRef, { at: Date.now() }, { merge: true }).catch(() => {}), 12000);
      const unsubP = F.onSnapshot(peersCol, snap => {
        snap.docChanges().forEach(ch => {
          const d = ch.doc.data();
          if (ch.type === 'removed') { peers.delete(d.uid); room._emit('peerLeft', d.uid); }
          else { const isNew = !peers.has(d.uid); peers.set(d.uid, d); room._emit(isNew ? 'peerJoined' : 'peerState', d); }
        });
      });
      const since = Date.now();
      const unsubM = F.onSnapshot(F.query(msgCol, F.orderBy('at', 'desc'), F.limit(30)), snap => {
        snap.docChanges().forEach(ch => {
          if (ch.type !== 'added') return;
          const d = ch.doc.data();
          if (d.at < since || d.from === me) return;
          room._emit('message', d);
          room._emit(d.type, d.data, d.from);
        });
      });
      rt._cleanups.push(() => room.leave());
      return room;
    },

    /* WebRTC signalling over the same backend — the missing piece that
       real voice/multiplayer needs. No backend, no voice: stated plainly. */
    async signal(roomId) {
      if (!Backend.isOnline()) throw new Error('SIGNALING_REQUIRES_BACKEND');
      const { F, db } = Backend.fb;
      const me = Backend.user.uid;
      const col = F.collection(db, 'rooms', String(roomId), 'signals');
      return {
        me,
        async send(to, payload) { await F.addDoc(col, { from: me, to, payload, at: Date.now() }); },
        listen(cb) {
          const since = Date.now();
          return F.onSnapshot(F.query(col, F.where('to', '==', me)), snap => {
            snap.docChanges().forEach(ch => {
              if (ch.type !== 'added') return;
              const d = ch.doc.data();
              if (d.at >= since) cb(d);
            });
          });
        }
      };
    }
  };
}

function makeVoice(rt, net) {
  const peers = new Map();
  const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:global.stun.twilio.com:3478'] }] };
  return {
    /* Peer-to-peer voice. Needs: mic permission + signalling backend.
       Some networks additionally need a TURN server you provide. */
    async join(roomId, opts = {}) {
      if (!NX.Backend.isOnline()) throw new Error('VOICE_REQUIRES_BACKEND: voice chat needs signalling — configure Firebase.');
      if (!Mic.stream) await Mic.request();
      await Mic.start();
      const sig = await net.signal(roomId);
      const room = await net.room(roomId);
      const ice = Object.assign({}, ICE, opts.rtc || {});
      const newPeer = async (otherId, initiator) => {
        if (peers.has(otherId)) return peers.get(otherId);
        const pc = new RTCPeerConnection(ice);
        peers.set(otherId, pc);
        Mic.stream.getAudioTracks().forEach(t => pc.addTrack(t, Mic.stream));
        pc.onicecandidate = e => { if (e.candidate) sig.send(otherId, { ice: e.candidate.toJSON() }); };
        pc.ontrack = e => {
          const a = new Audio(); a.srcObject = e.streams[0]; a.autoplay = true;
          a.play().catch(() => {});
          opts.onPeerAudio && opts.onPeerAudio(otherId, a, e.streams[0]);
        };
        if (initiator) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await sig.send(otherId, { sdp: pc.localDescription.toJSON ? pc.localDescription.toJSON() : { type: offer.type, sdp: offer.sdp } });
        }
        return pc;
      };
      sig.listen(async msg => {
        const pc = await newPeer(msg.from, false);
        const p = msg.payload || {};
        if (p.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
          if (p.sdp.type === 'offer') {
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            await sig.send(msg.from, { sdp: { type: ans.type, sdp: ans.sdp } });
          }
        } else if (p.ice) { try { await pc.addIceCandidate(new RTCIceCandidate(p.ice)); } catch (e) {} }
      });
      room.on('peerJoined', p => { if (p.uid !== room.me) newPeer(p.uid, true); });
      Array.from(room.peers.keys()).forEach(id => { if (id !== room.me) newPeer(id, true); });
      rt._cleanups.push(() => this.leave());
      return { room, peers };
    },
    leave() { peers.forEach(pc => { try { pc.close(); } catch {} }); peers.clear(); Mic.stop(); },
    mute: () => Mic.mute(), unmute: () => Mic.unmute(), get muted() { return Mic.muted; }
  };
}

/* ------------------------------------------------------------
   SCRIPT RUNTIME
   ------------------------------------------------------------ */
class Runtime {
  constructor(engine, opts = {}) {
    this.engine = engine;
    this.project = opts.project || null;
    this.uiHost = opts.uiHost || null;
    this.onLog = opts.onLog || (() => {});
    this.trusted = opts.trusted !== false;
    this.running = false;
    this.instances = [];
    this._cleanups = [];
    this._events = {};
    this._timers = [];
    this._uiNodes = [];
    this._joysticks = {};
    this._buttons = {};
    this._keys = new Set();
    this._pointer = { x: 0, y: 0, down: false, tapped: false };
    this._audioCtx = null;
    this._sounds = new Map();
    this._api = null;
    this._bindInput();
  }

  log(...a) { this.onLog(a.map(x => typeof x === 'object' ? safeJSON(x) : String(x)).join(' '), 'log'); }
  warn(...a) { this.onLog(a.map(String).join(' '), 'warn'); }
  error(e, where) { this.onLog((where ? '[' + where + '] ' : '') + (e && e.stack ? e.stack.split('\n').slice(0, 3).join('\n') : String(e)), 'err'); }

  /* ---------------- input ---------------- */
  _bindInput() {
    this._onKeyDown = e => { this._keys.add(e.key.toLowerCase()); this._emitLocal('keydown', e.key.toLowerCase()); };
    this._onKeyUp = e => { this._keys.delete(e.key.toLowerCase()); this._emitLocal('keyup', e.key.toLowerCase()); };
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    const c = this.engine.canvas;
    this._onDown = e => { this._pointer.down = true; this._pointer.tapped = true; this._setPointer(e); this._emitLocal('pointerdown', this._pointer); };
    this._onMove = e => this._setPointer(e);
    this._onUp = e => { this._pointer.down = false; this._emitLocal('pointerup', this._pointer); };
    c.addEventListener('pointerdown', this._onDown);
    c.addEventListener('pointermove', this._onMove);
    window.addEventListener('pointerup', this._onUp);
  }
  _setPointer(e) {
    const r = this.engine.canvas.getBoundingClientRect();
    this._pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    this._pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    this._pointer.clientX = e.clientX; this._pointer.clientY = e.clientY;
  }
  _emitLocal(ev, data) { (this._events['__' + ev] || []).forEach(cb => { try { cb(data); } catch (e) { this.error(e); } }); }
  _unbindInput() {
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup', this._onKeyUp);
    window.removeEventListener('pointerup', this._onUp);
    const c = this.engine.canvas;
    c.removeEventListener('pointerdown', this._onDown);
    c.removeEventListener('pointermove', this._onMove);
  }

  /* ---------------- API ---------------- */
  api() {
    if (this._api) return this._api;
    const rt = this, eng = this.engine;
    const wrap = e => e ? new GameObject(e, rt) : null;

    const Events = {
      on(ev, cb) { (rt._events[ev] = rt._events[ev] || []).push(cb); return () => Events.off(ev, cb); },
      once(ev, cb) { const off = Events.on(ev, (...a) => { off(); cb(...a); }); return off; },
      off(ev, cb) { const a = rt._events[ev]; if (a) { const i = a.indexOf(cb); if (i >= 0) a.splice(i, 1); } },
      emit(ev, ...args) { (rt._events[ev] || []).forEach(cb => { try { cb(...args); } catch (e) { rt.error(e, ev); } }); return true; },
      clear(ev) { if (ev) delete rt._events[ev]; else rt._events = {}; }
    };

    const Time = {
      get dt() { return eng.time.dt; },
      get elapsed() { return eng.time.t; },
      get frame() { return eng.time.frame; },
      get scale() { return eng.time.scale; },
      setScale(v) { eng.time.scale = clamp(v, 0, 10); },
      after(sec, fn) { const t = setTimeout(() => { try { fn(); } catch (e) { rt.error(e); } }, sec * 1000); rt._timers.push(() => clearTimeout(t)); return t; },
      every(sec, fn) { const t = setInterval(() => { try { fn(); } catch (e) { rt.error(e); } }, sec * 1000); rt._timers.push(() => clearInterval(t)); return t; },
      cancel(t) { clearTimeout(t); clearInterval(t); }
    };

    const Input = {
      isDown: k => rt._keys.has(String(k).toLowerCase()),
      get keys() { return Array.from(rt._keys); },
      get pointer() { return rt._pointer; },
      axis(name) {
        const j = rt._joysticks[name] || rt._joysticks.move;
        if (name === 'horizontal') return (j ? j.x : 0) + (Input.isDown('d') || Input.isDown('arrowright') ? 1 : 0) - (Input.isDown('a') || Input.isDown('arrowleft') ? 1 : 0);
        if (name === 'vertical') return (j ? -j.y : 0) + (Input.isDown('w') || Input.isDown('arrowup') ? 1 : 0) - (Input.isDown('s') || Input.isDown('arrowdown') ? 1 : 0);
        return 0;
      },
      joystick(id = 'move') { return rt._joysticks[id] || { x: 0, y: 0, active: false }; },
      button(id) { return !!(rt._buttons[id] && rt._buttons[id].down); },
      onKey(k, cb) { return Events.on('__keydown', key => { if (key === String(k).toLowerCase()) cb(key); }); },
      onKeyUp(k, cb) { return Events.on('__keyup', key => { if (key === String(k).toLowerCase()) cb(key); }); },
      onTap(cb) { return Events.on('__pointerdown', p => cb(p)); },
      /* pick the object under the finger */
      pick(px, py) {
        const ray = new THREE.Raycaster();
        ray.setFromCamera(new THREE.Vector2(px == null ? rt._pointer.x : px, py == null ? rt._pointer.y : py), eng.activeCamera);
        const hits = ray.intersectObject(eng.root, true);
        for (const h of hits) { const e = eng.entityOf(h.object); if (e) return { object: wrap(e), point: h.point, distance: h.distance }; }
        return null;
      },
      vibrate(ms = 12) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }
    };

    const Scene = {
      find: n => wrap(eng.findByName(n)),
      findByTag: t => eng.findByTag(t).map(wrap),
      all: () => Array.from(eng.entities.values()).map(wrap),
      get count() { return eng.entities.size; },
      async create(def) { return wrap(await eng.addEntity(def)); },
      async spawn(assetId, opts = {}) {
        const asset = await NX.Assets.get(assetId);
        if (!asset) throw new Error('ASSET_NOT_FOUND: ' + assetId);
        const e = await eng.addEntity({
          name: opts.name || asset.name, type: asset.kind === 'model' ? 'model' : (asset.kind === 'audio' ? 'audio' : 'model'),
          assetId, tag: opts.tag || '',
          position: opts.position || [0, 0, 0], rotation: opts.rotation || [0, 0, 0],
          scale: opts.scale || [1, 1, 1]
        }, { asset });
        return wrap(e);
      },
      destroy(o) { if (o && o.id) eng.removeEntity(o.id); },
      raycast(origin, dir, far) { const h = eng.physics.raycast(origin, dir, far); return h ? { object: wrap(h.entity), point: h.point, distance: h.distance, normal: h.normal } : null; },
      setBackground(color) { eng.applyEnvironment(Object.assign({}, eng.environment, { background: color })); },
      setFog(color, near, far) { eng.applyEnvironment(Object.assign({}, eng.environment, { fog: color ? { color, near, far } : null })); },
      setAmbient(v) { eng.applyEnvironment(Object.assign({}, eng.environment, { ambient: v })); }
    };

    const Physics = {
      get gravity() { return eng.physics.gravity; },
      setGravity(x, y, z) { eng.physics.gravity.set(x, y, z); },
      addBody(o, opts) { return o.addBody(opts); },
      raycast: Scene.raycast,
      overlapSphere(center, radius) {
        const out = [];
        for (const e of eng.entities.values()) {
          if (!e.object3D) continue;
          if (e.object3D.position.distanceTo(center) <= radius) out.push(wrap(e));
        }
        return out;
      },
      enable(on = true) { eng.physicsEnabled = on !== false; }
    };

    const Camera = {
      get main() { const c = Array.from(eng.entities.values()).find(e => e.type === 'camera' && e.props.isMain) || Array.from(eng.entities.values()).find(e => e.type === 'camera'); return wrap(c); },
      get active() { return eng.activeCamera; },
      use(o) { if (o && o.object3D && o.object3D.isCamera) { eng.activeCamera = o.object3D; eng._resize(); } },
      lookAt(t) { const p = t && t.position ? t.position : t; eng.activeCamera.lookAt(p); },
      setFov(v) { eng.activeCamera.fov = v; eng.activeCamera.updateProjectionMatrix(); },
      /* third-person follow, written as a tool — not a forced game type */
      follow(target, opts = {}) {
        const off = V3(...(opts.offset || [0, 3, 7]));
        const smooth = opts.smooth == null ? 8 : opts.smooth;
        const lookOff = V3(...(opts.lookOffset || [0, 1.2, 0]));
        const cam = eng.activeCamera;
        const stop = eng.onUpdate(dt => {
          if (!target || !target.exists) return;
          const want = target.position.clone().add(off.clone().applyAxisAngle(V3(0, 1, 0), opts.orbit ? 0 : target.rotation.y));
          cam.position.lerp(want, 1 - Math.exp(-smooth * dt));
          cam.lookAt(target.position.clone().add(lookOff));
        });
        rt._cleanups.push(stop);
        return stop;
      },
      shake(strength = 0.3, time = 0.4) {
        const cam = eng.activeCamera, base = cam.position.clone();
        let t = 0;
        const stop = eng.onUpdate(dt => {
          t += dt;
          if (t >= time) { stop(); return; }
          const k = strength * (1 - t / time);
          cam.position.set(base.x + (Math.random() - .5) * k, base.y + (Math.random() - .5) * k, base.z + (Math.random() - .5) * k);
        });
      }
    };

    /* Character helper — a tool, not a genre. The developer writes the rest. */
    const Player = {
      _obj: null,
      get object() { return Player._obj; },
      async create(opts = {}) {
        let o;
        if (opts.assetId) o = await Scene.spawn(opts.assetId, { name: opts.name || 'Player', position: opts.position || [0, 0, 0] });
        else o = await Scene.create({ name: opts.name || 'Player', type: 'primitive', props: { shape: 'cylinder', color: opts.color || '#7c5cff' }, position: opts.position || [0, 1, 0], scale: [0.6, 1.8, 0.6] });
        o.tag = 'player';
        const body = o.addBody({ type: 'character', shape: 'capsule', radius: opts.radius || 0.4, height: opts.height || 1.8, useGravity: opts.gravity !== false });
        Player._obj = o; Player._body = body;
        Player.speed = opts.speed == null ? 6 : opts.speed;
        Player.jumpForce = opts.jump == null ? 8.5 : opts.jump;
        eng.physicsEnabled = true;
        return o;
      },
      setSpeed(v) { Player.speed = v; },
      move(x, z) {
        if (!Player._body) return;
        const v = Player._body.velocity;
        v.x = x * Player.speed; v.z = z * Player.speed;
        if (x || z) Player._obj.object3D.rotation.y = Math.atan2(x, z);
      },
      /* joystick / WASD driven movement relative to the camera */
      moveWithInput(speed) {
        const h = Input.axis('horizontal'), v = Input.axis('vertical');
        if (!Player._body) return;
        const cam = eng.activeCamera;
        const f = V3(); cam.getWorldDirection(f); f.y = 0; f.normalize();
        const r = V3().crossVectors(f, V3(0, 1, 0)).negate();
        const dir = f.multiplyScalar(v).add(r.multiplyScalar(h));
        if (dir.lengthSq() > 0) dir.normalize();
        const s = speed == null ? Player.speed : speed;
        Player._body.velocity.x = dir.x * s;
        Player._body.velocity.z = dir.z * s;

    const Audio_ = {
      ctx() { if (!rt._audioCtx) rt._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return rt._audioCtx; },
      async play(assetId, opts = {}) {

        if (!asset) throw new Error('ASSET_NOT_FOUND');

      },
      async playURL(url, opts = {}) {

        let buf = rt._sounds.get(url);
        if (!buf) { const r = await fetch(url); buf = await ctx.decodeAudioData(await r.arrayBuffer()); rt._sounds.set(url, buf); }
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = !!opts.loop;
        const g = ctx.createGain(); g.gain.value = opts.volume == null ? 1 : opts.volume;
        src.connect(g);
        if (opts.at && opts.at.isVector3) {
          const p = ctx.createPanner(); p.panningModel = 'HRTF'; p.refDistance = opts.refDistance || 2;

      },
      /* synth beep so a game can make noise before any audio asset exists */
      beep(freq = 440, dur = 0.12, type = 'sine', vol = 0.2) {

        o.connect(g); g.connect(ctx.destination); o.start();
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        o.stop(ctx.currentTime + dur);
      },
      listenerAt(v) { const ctx = Audio_.ctx(); if (ctx.listener.positionX) { ctx.listener.positionX.value = v.x; ctx.listener.positionY.value = v.y; ctx.listener.positionZ.value = v.z; } }

  /* ---------------- compile + run ---------------- */
  compile(code, label = 'script') {
    const api = this.api();
    const names = Object.keys(api);
    const body = `"use strict";
return (async () => {
${code}
;return {start:typeof start==="function"?start:null,update:typeof update==="function"?update:null,destroy:typeof destroy==="function"?destroy:null,onCollide:typeof onCollide==="function"?onCollide:null,onMessage:typeof onMessage==="function"?onMessage:null};
})();`;
    let factory;
    try {
      factory = new AsyncFunction(...names, ...SHADOWED, 'self', 'props', body);
    } catch (e) {
      this.error(e, label);
      throw e;
    }
    return async (selfHandle, props) => {
      const args = names.map(n => api[n]).concat(SHADOWED.map(() => undefined), [selfHandle, props || {}]);
      return factory.apply(Object.create(null), args);
    };
  }

  attachComponent(entity, name, data) {
    const rec = (this.project && (this.project.components || []).find(c => c.name === name));
    if (!rec) { this.warn('component not found: ' + name); return null; }
    const inst = { name, data: data || {}, entity };
    (entity._compInstances = entity._compInstances || []).push(inst);
    this._pending.push({ code: rec.code, label: 'component:' + name, entity, props: data || {}, inst });
    return inst;
  }

  /* Runs every script in the project, plus per-entity script components. */
  async run() {
    if (this.running) return;
    this.running = true;
    this.instances = [];
    this._pending = [];
    const p = this.project || { scripts: [], components: [] };
    const scripts = p.scripts || [];

    /* 1. global scripts (not attached to an object) */
    for (const s of scripts.filter(s => s.enabled !== false && !s.entityId)) {
      await this._boot(s.code, s.name, null, {});
    }
    /* 2. scripts attached to objects */
    for (const s of scripts.filter(s => s.enabled !== false && s.entityId)) {
      const e = this.engine.getEntity(s.entityId);
      if (!e) { this.warn(`script "${s.name}" targets a missing object`); continue; }
      await this._boot(s.code, s.name, new GameObject(e, this), {});
    }
    /* 3. custom components placed on entities in the scene */
    for (const e of this.engine.entities.values()) {
      for (const c of (e.components || [])) {
        if (c.enabled === false) continue;
        const rec = (p.components || []).find(x => x.name === c.type || x.name === c.name);
        if (!rec) continue;
        await this._boot(rec.code, 'component:' + rec.name, new GameObject(e, this), c.data || {});
      }
    }
    while (this._pending.length) {
      const job = this._pending.shift();
      await this._boot(job.code, job.label, new GameObject(job.entity, this), job.props);
    }

    for (const inst of this.instances) {
      if (inst.start) { try { await inst.start(); } catch (e) { this.error(e, inst.__label + ':start'); } }
    }
    const off = this.engine.onUpdate(dt => {
      for (const inst of this.instances) {
        if (!inst.update) continue;
        try { inst.update(dt); } catch (e) { this.error(e, inst.__label + ':update'); inst.update = null; }
      }
    });
    this._cleanups.push(off);
    this.engine.physicsEnabled = true;
  }

  async _boot(code, label, selfHandle, props) {
    try {
      const make = this.compile(code, label);
      const inst = await make(selfHandle, props);
      if (inst) { inst.__label = label; inst.__self = selfHandle; this.instances.push(inst); }
      return inst;
    } catch (e) { this.error(e, label); return null; }
  }

  stop() {
    if (!this.running) return;
    this.running = false;
    for (const inst of this.instances) { if (inst.destroy) { try { inst.destroy(); } catch (e) { this.error(e); } } }
    this._cleanups.forEach(f => { try { f(); } catch {} });
    this._timers.forEach(f => { try { f(); } catch {} });
    this._uiNodes.forEach(n => n.remove());
    this._cleanups = []; this._timers = []; this._uiNodes = [];
    this.instances = []; this._events = {}; this._joysticks = {}; this._buttons = {};
    try { Mic.stop(); } catch {}
    this._unbindInput();
    this.engine.physicsEnabled = false;
  }
}

/* ============================================================
   PART 6/8 · ASSET PIPELINE + PUBLIC ASSET LIBRARY
   Users are the source of assets. Nothing here ships with the
   engine — the library is whatever people upload.
   ============================================================ */
import * as THREE from 'three';
const NX = window.NX;
const { $, el, btn, iconBtn, icon, Sheet, Modal, Toast, T, fmtNum, fmtBytes, timeAgo, debounce, clamp } = NX;
const { Assets, Backend, Loaders, AssetCache } = NX;

const ACCEPT = '.glb,.gltf,.obj,.fbx,.png,.jpg,.jpeg,.webp,.mp3,.wav,.ogg,.json,.txt,model/gltf-binary,image/*,audio/*';

/* ------------------------------------------------------------
   THUMBNAILS — generated from the file itself with Three.js
   (rule 17), never from an external picture.
   ------------------------------------------------------------ */
const Thumbs = {
  _r: null, _scene: null, _cam: null, _size: 512,
  _renderer() {
    if (this._r) return this._r;
    const c = document.createElement('canvas');
    c.width = c.height = this._size;
    this._r = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
    this._r.setPixelRatio(1);
    this._r.setSize(this._size, this._size, false);
    this._r.outputColorSpace = THREE.SRGBColorSpace;
    this._r.toneMapping = THREE.ACESFilmicToneMapping;
    this._scene = new THREE.Scene();
    this._scene.background = new THREE.Color(0x0d1020);
    const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(4, 7, 5);
    const rim = new THREE.DirectionalLight(0x88aaff, 1.4); rim.position.set(-5, 2, -4);
    this._scene.add(key, rim, new THREE.HemisphereLight(0xcfe0ff, 0x1a1d2e, 1.1));
    this._cam = new THREE.PerspectiveCamera(42, 1, 0.05, 2000);
    return this._r;
  },
  async fromObject(object3D) {
    const r = this._renderer();
    const holder = new THREE.Group();
    holder.add(object3D);
    this._scene.add(holder);
    try {
      const box = new THREE.Box3().setFromObject(holder);
      if (!isFinite(box.min.x)) throw new Error('EMPTY_BOUNDS');
      const c = box.getCenter(new THREE.Vector3());
      const radius = Math.max(0.0001, box.getSize(new THREE.Vector3()).length() * 0.5);
      const dist = radius / Math.tan((this._cam.fov * Math.PI / 180) / 2) * 1.32;
      this._cam.position.set(c.x + dist * 0.62, c.y + dist * 0.46, c.z + dist * 0.72);
      this._cam.lookAt(c);
      this._cam.near = Math.max(0.01, dist - radius * 3); this._cam.far = dist + radius * 6;
      this._cam.updateProjectionMatrix();
      r.render(this._scene, this._cam);
      return await new Promise(res => r.domElement.toBlob(b => res(b), 'image/webp', 0.82));
    } finally {
      this._scene.remove(holder);
      holder.remove(object3D);
    }
  },
  async fromImageFile(file) {
    const bmp = await createImageBitmap(file);
    const s = this._size;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d');
    x.fillStyle = '#0d1020'; x.fillRect(0, 0, s, s);
    const k = Math.min(s / bmp.width, s / bmp.height);
    const w = bmp.width * k, h = bmp.height * k;
    x.drawImage(bmp, (s - w) / 2, (s - h) / 2, w, h);
    bmp.close && bmp.close();
    return new Promise(res => c.toBlob(res, 'image/webp', 0.85));
  },
  /* real waveform drawn from the decoded samples */
  async fromAudioBuffer(audioBuffer) {
    const s = this._size, c = document.createElement('canvas');
    c.width = s; c.height = s;
    const x = c.getContext('2d');
    x.fillStyle = '#0d1020'; x.fillRect(0, 0, s, s);
    const data = audioBuffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / s));
    const g = x.createLinearGradient(0, 0, s, 0);
    g.addColorStop(0, '#7c5cff'); g.addColorStop(.5, '#4f7bff'); g.addColorStop(1, '#22d3ee');
    x.fillStyle = g;
    for (let i = 0; i < s; i++) {
      let min = 1, max = -1;
      for (let j = 0; j < step; j++) { const v = data[i * step + j] || 0; if (v < min) min = v; if (v > max) max = v; }
      const y1 = (1 + min) * s / 2, y2 = (1 + max) * s / 2;
      x.fillRect(i, y1, 1, Math.max(2, y2 - y1));
    }
    return new Promise(res => c.toBlob(res, 'image/webp', 0.85));
  },
  async fromText(label) {
    const s = this._size, c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d');
    x.fillStyle = '#0d1020'; x.fillRect(0, 0, s, s);
    x.fillStyle = '#7c5cff'; x.font = 'bold 120px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(String(label).slice(0, 4).toUpperCase(), s / 2, s / 2);
    return new Promise(res => c.toBlob(res, 'image/webp', 0.85));
  }
};

/* ------------------------------------------------------------
   3D PREVIEW WIDGET — rotate / zoom / inspect (rule 13)
   ------------------------------------------------------------ */
class PreviewView {
  constructor(host) {
    this.host = host;
    const canvas = el('canvas');
    host.appendChild(canvas);
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x080a12);
    const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(4, 6, 5);
    const rim = new THREE.DirectionalLight(0x88aaff, 1.2); rim.position.set(-4, 2, -4);
    this.scene.add(key, rim, new THREE.HemisphereLight(0xcfe0ff, 0x181b2b, 1.1));
    this.cam = new THREE.PerspectiveCamera(45, 1, 0.05, 2000);
    this.orbit = new NX.OrbitCam(this.cam, canvas);
    this.holder = new THREE.Group(); this.scene.add(this.holder);
    this.autoSpin = true;
    this._bind(canvas);
    this._resize();
    this._ro = new ResizeObserver(() => this._resize()); this._ro.observe(host);
    this._loop();
  }
  _resize() {
    const w = Math.max(1, this.host.clientWidth), h = Math.max(1, this.host.clientHeight);
    this.renderer.setSize(w, h, false);
    this.cam.aspect = w / h; this.cam.updateProjectionMatrix();
  }
  _bind(c) {
    const pts = new Map(); let pinch = 0;
    c.style.touchAction = 'none';
    c.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.autoSpin = false; c.setPointerCapture(e.pointerId); });
    c.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const p = pts.get(e.pointerId);
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size >= 2) {
        const [a, b] = Array.from(pts.values());
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch) this.orbit.zoom(clamp(pinch / d, 0.92, 1.08));
        pinch = d;
      } else this.orbit.orbit(dx, dy);
    });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('wheel', e => { e.preventDefault(); this.orbit.zoom(e.deltaY > 0 ? 1.1 : 0.91); }, { passive: false });
  }
  show(object3D) {
    this.clear();
    this.holder.add(object3D);
    const box = new THREE.Box3().setFromObject(object3D);
    if (isFinite(box.min.x)) this.orbit.frame(box);
    this.autoSpin = true;
  }
  clear() { while (this.holder.children.length) this.holder.remove(this.holder.children[0]); }
  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    if (this.autoSpin) { this.orbit.theta += 0.0042; this.orbit.apply(); }
    this.renderer.render(this.scene, this.cam);
  }
  dispose() { cancelAnimationFrame(this._raf); this._ro.disconnect(); this.clear(); this.renderer.dispose(); }
}

   UPLOAD (rules 7, 8, 9, 12, 16, 17)

async function prepareFile(file) {
  const ext = Loaders.extOf(file.name);
  const kind = Loaders.kindOf(ext);
  const out = { file, ext, kind, stats: null, object: null, thumb: null, extra: {} };
  if (kind === 'model') {
    const buf = await file.arrayBuffer();
    const { object, animations } = await Loaders.parseModel(buf, ext);
    object.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    out.object = object;
    out.stats = Loaders.analyze(object, animations);
    out.animations = animations;
    out.thumb = await Thumbs.fromObject(object);
    object.removeFromParent();
  } else if (kind === 'image') {
    const bmp = await createImageBitmap(file);
    out.stats = { width: bmp.width, height: bmp.height, pixels: bmp.width * bmp.height };
    bmp.close && bmp.close();
    out.thumb = await Thumbs.fromImageFile(file);
  } else if (kind === 'audio') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const ab = await ctx.decodeAudioData(await file.arrayBuffer());
      out.stats = { duration: +ab.duration.toFixed(2), channels: ab.numberOfChannels, sampleRate: ab.sampleRate };
      out.thumb = await Thumbs.fromAudioBuffer(ab);
      ctx.close();
    } catch (e) { out.thumb = await Thumbs.fromText(ext); }
  } else {
    const txt = await file.slice(0, 4096).text();
    out.extra.preview = txt;
    if (ext === 'json') { try { const j = JSON.parse(await file.text()); out.stats = { keys: Object.keys(j).length }; } catch { out.stats = { parse: 'invalid json' }; } }
    out.thumb = await Thumbs.fromText(ext);
  }
  return out;
}

function field(label, control) {
  const l = el('label', { class: 'field' });
  l.appendChild(el('span', { text: label }));
  l.appendChild(control);
  return l;
}
function segPick(seg, target) { Array.from(seg.children).forEach(c => c.classList.toggle('on', c === target)); }
function guessCategory(name, kind) {
  if (kind === 'audio') return 'Audio';
  if (kind === 'image') return 'Other';
  const n = String(name).toLowerCase();
  const map = [[/car|truck|bike|vehicle|moto|bus|plane|boat/, 'Vehicles'], [/house|build|tower|shop|wall/, 'Buildings'],
    [/char|player|human|person|man|woman|npc/, 'Characters'], [/dog|cat|bird|fish|animal|horse/, 'Animals'],
    [/tree|rock|grass|plant|nature|stone/, 'Nature'], [/chair|table|sofa|bed|lamp|desk/, 'Furniture'],
    [/gun|sword|weapon|rifle|blade/, 'Weapons'], [/ui|icon|button/, 'UI']];
  for (const [re, c] of map) if (re.test(n)) return c;
  return 'Props';
}
function statRows(s) {
  const out = [];
  const L = {
    meshes: 'Meshes', materials: 'Materials', textures: 'Textures', triangles: 'Triangles', vertices: 'Vertices',
    animations: 'Animations', bones: 'Bones', skinned: 'Skeleton', duration: 'Duration (s)', channels: 'Channels',
    sampleRate: 'Sample rate', width: 'Width', height: 'Height', pixels: 'Pixels', keys: 'Keys'
  };
  for (const k in L) if (s[k] != null) out.push([L[k], typeof s[k] === 'boolean' ? (s[k] ? 'yes' : 'no') : fmtNum(s[k])]);
  if (s.size) out.push(['Bounding box', s.size.map(n => n.toFixed(2)).join(' × ')]);
  if (s.animationNames && s.animationNames.length) out.push(['Clips', s.animationNames.join(', ')]);
  return out;
}

const thumbObserver = new IntersectionObserver(entries => {
  entries.forEach(async e => {
    if (!e.isIntersecting) return;
    thumbObserver.unobserve(e.target);
    const img = e.target;
    const asset = img.__asset;
    if (!asset) return;
    try { const u = await Assets.thumbURL(asset); if (u) { img.src = u; img.style.opacity = '1'; } } catch {}
  });
}, { rootMargin: '220px' });

async function openAssetDetails(asset, { onAdd } = {}) {

  [[T('creator'), '@' + (asset.creatorName || '—')],

   [T('category'), asset.category],
   [T('license'), asset.license],

  const foot = [];
  if (onAdd) foot.push(btn('ADD TO SCENE', { cls: 'primary', icon: 'plus', onclick: async () => { await onAdd(asset); sheet.close(); } }));
  if (mine) {
    foot.push(btn(asset.visibility === 'public' ? 'اجعله خاصًا' : 'اجعله عامًا', {

  const sheet = Sheet.open({

  try {

/* ------------------------------------------------------------
   LIBRARY VIEW — search / filter / sort / paginate (rules 4,5,6,18)
   ------------------------------------------------------------ */
class LibraryView {
  constructor(host, { onAdd, scope = 'public' } = {}) {
    this.host = host; this.onAdd = onAdd; this.scope = scope;
    this.state = { q: '', kind: 'all', sort: 'relevance', page: 1, cursor: null, items: [], done: false, busy: false };
    this.build();
    this.refresh();
    this._onUp = () => this.refresh();
    window.addEventListener('nx:assetUploaded', this._onUp);
    window.addEventListener('nx:assetChanged', this._onUp);
  }
  destroy() {
    window.removeEventListener('nx:assetUploaded', this._onUp);
    window.removeEventListener('nx:assetChanged', this._onUp);
  }
  build() {
    const top = el('div', { class: 'alib-top' });
    const sb = el('div', { class: 'searchbar' });
    sb.appendChild(icon('search'));
    this.input = el('input', { placeholder: T('searchAssets'), type: 'search', enterkeyhint: 'search' });
    this.input.addEventListener('input', debounce(() => { this.state.q = this.input.value; this.state.page = 1; this.state.cursor = null; this.refresh(); }, 280));
    sb.appendChild(this.input);
    top.appendChild(sb);

    const filters = el('div', { class: 'chips', style: { marginTop: '9px' } });
    const kinds = [['all', T('all')], ['model', '3D'], ['audio', T('audio')], ['image', T('textures')], ['data', T('other')]];
    kinds.forEach(([k, label]) => {
      const c = el('button', { class: 'chip' + (k === 'all' ? ' on' : ''), text: label, onclick: () => {
        this.state.kind = k; this.state.page = 1; this.state.cursor = null;
        Array.from(filters.children).forEach(x => x.classList.toggle('on', x === c));
        this.refresh();
      }});
      filters.appendChild(c);
    });
    top.appendChild(filters);

    const sortRow = el('div', { style: { display: 'flex', gap: '8px', marginTop: '9px', alignItems: 'center' } });
    this.sortSel = el('select', { class: 'select', style: { minHeight: '38px', flex: '1' } }, [
      el('option', { value: 'relevance', text: T('relevance') }),
      el('option', { value: 'new', text: T('newest') }),
      el('option', { value: 'usage', text: T('mostUsed') })
    ]);
    this.sortSel.addEventListener('change', () => { this.state.sort = this.sortSel.value; this.state.page = 1; this.state.cursor = null; this.refresh(); });
    sortRow.appendChild(this.sortSel);
    sortRow.appendChild(btn('UPLOAD', { cls: 'sm primary', icon: 'upload', onclick: () => openUploadSheet(() => this.refresh()) }));
    top.appendChild(sortRow);

    this.count = el('p', { class: 'tiny', style: { marginTop: '8px' } });
    top.appendChild(this.count);

    this.results = el('div', { class: 'acards' });
    this.moreWrap = el('div', { style: { marginTop: '14px' } });
    this.host.append(top, this.results, this.moreWrap);
  }
  skeletons(n = 6) {
    this.results.textContent = '';
    for (let i = 0; i < n; i++) this.results.appendChild(el('div', { class: 'skel', style: { aspectRatio: '1/1.45' } }));
  }
  async refresh(append = false) {
    if (this.state.busy) return;
    this.state.busy = true;
    if (!append) this.skeletons();
    try {
      const res = await Assets.search({
        q: this.state.q,
        kind: this.state.kind,
        sort: this.state.sort,
        scope: this.scope,
        ownerId: Backend.user ? Backend.user.uid : null,
        limit: 24 * (Backend.isOnline() ? 1 : this.state.page),
        cursor: append ? this.state.cursor : null
      });
      this.state.cursor = res.cursor;
      this.state.done = res.done;
      this.state.items = append ? this.state.items.concat(res.items) : res.items;
      this.render(res);
    } catch (e) {
      console.error(e);
      this.results.textContent = '';
      this.results.appendChild(el('div', { class: 'center-note', text: 'تعذّر جلب الأصول: ' + (e.message || e) }));
    }
    this.state.busy = false;
  }
  render(res) {
    this.results.textContent = '';
    const items = this.state.items;
    if (!items.length) {
      this.count.textContent = '';
      this.results.appendChild(el('div', { class: 'center-note', style: { gridColumn: '1/-1' } }, [
        icon('cube'),
        el('b', { text: this.state.q ? T('noResults') : T('noAssetsYet') }),
        el('p', { class: 'tiny', style: { marginTop: '6px' }, text: this.state.q
          ? 'لا يوجد أصل بهذا الاسم في المكتبة. لا تُنشأ نتائج وهمية — ارفع أنت أول واحد.'
          : 'المكتبة يبنيها المستخدمون. اضغط UPLOAD وابدأ.' }),
        btn(T('uploadAsset'), { cls: 'primary', icon: 'upload', onclick: () => openUploadSheet(() => this.refresh()) })
      ]));
      this.moreWrap.textContent = '';
      return;
    }
    this.count.textContent = `${fmtNum(res.total || items.length)} ${this.state.q ? 'نتيجة لـ «' + this.state.q + '»' : 'أصل'}` +
      (res.degraded ? ' · فهرس Firestore ناقص — النتائج مُصفّاة محليًا' : '');
    items.forEach(a => this.results.appendChild(assetCard(a, { onAdd: this.onAdd })));
    this.moreWrap.textContent = '';
    if (!this.state.done) {
      this.moreWrap.appendChild(btn('تحميل المزيد', {
        cls: 'block ghost',
        onclick: () => { this.state.page++; this.refresh(Backend.isOnline()); }
      }));
    }
  }
}

/* The Assets sheet used from the Studio (rule 19: bottom sheet, X to go back) */
function openAssetLibrary({ onAdd, scope = 'public', title } = {}) {

<script type="module">
/* ============================================================
   PART 7/8 · MOBILE-FIRST STUDIO
   The viewport is the centre of gravity. Every panel is a
   temporary sheet that gets out of the way (rules 20-25).
   ============================================================ */
import * as THREE from 'three';
const NX = window.NX;
const { $, $$, el, btn, iconBtn, icon, esc, Sheet, Modal, Toast, T, LS, uid, fmtNum, timeAgo, debounce, clamp, field, segPick } = NX;
const { Backend, Assets, Projects, Games, EngineCore, Runtime } = NX;

/* ============================================================
   CODE EDITOR — touch friendly, line numbers, highlighting,
   find, undo/redo, run (rule 25)
   ============================================================ */
const KEYWORDS = new Set(('await async break case catch class const continue default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while yield true false null undefined').split(' '));
const API_NAMES = new Set(['Engine','Scene','GameObject','Player','Input','Physics','Audio','Camera','UI','Network','Voice','Events','Assets','Save','Time','Mic','V3','Vector3','MathUtils','Color','self','props','start','update','destroy','onCollide']);

function highlight(code) {
  const RX = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`?|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|([{}()[\];,.+\-*/%=<>!&|?:])/g;
  let out = '', last = 0, m;
  while ((m = RX.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="tk-com">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="tk-num">${esc(t)}</span>`;
    else if (m[4]) {
      if (KEYWORDS.has(t)) out += `<span class="tk-kw">${esc(t)}</span>`;
      else if (API_NAMES.has(t)) out += `<span class="tk-api">${esc(t)}</span>`;
      else if (/^[A-Z]/.test(t)) out += `<span class="tk-cls">${esc(t)}</span>`;
      else if (code[RX.lastIndex] === '(') out += `<span class="tk-fn">${esc(t)}</span>`;
      else out += esc(t);
    }
    else out += `<span class="tk-op">${esc(t)}</span>`;
    last = m.index + t.length;
  }
  out += esc(code.slice(last));
  return out;
}

class CodeEditor {
  constructor(host, { value = '', onRun, onSave, name = 'script.js' } = {}) {
    this.name = name; this.onRun = onRun; this.onSave = onSave;
    this.history = [value]; this.hIndex = 0; this._pushT = null;

    this.wrap = el('div', { class: 'ed-wrap' });
    this.bar = el('div', { class: 'ed-bar' });
    this.fname = el('span', { class: 'fname', text: name });
    this.bar.append(
      iconBtn('undo', { onclick: () => this.undo(), label: 'undo' }),
      iconBtn('redo', { onclick: () => this.redo(), label: 'redo' }),
      iconBtn('search', { onclick: () => this.toggleFind(), label: 'find' }),
      this.fname,
      iconBtn('save', { cls: 'on', onclick: () => this.save(), label: 'save' }),
      iconBtn('play', { onclick: () => this.run(), label: 'run' })
    );
    this.find = el('div', { class: 'ed-find hide' });
    this.findInput = el('input', { placeholder: 'find…' });
    this.findInput.addEventListener('keydown', e => { if (e.key === 'Enter') this.findNext(); });
    this.find.append(this.findInput, btn('التالي', { cls: 'sm', onclick: () => this.findNext() }), iconBtn('x', { onclick: () => this.toggleFind(false) }));

    this.scroll = el('div', { class: 'ed-scroll scroll' });
    this.inner = el('div', { class: 'ed-inner' });
    this.gutter = el('div', { class: 'ed-gutter' });
    this.codeBox = el('div', { class: 'ed-code' });
    this.pre = el('pre', { class: 'ed-pre' });
    this.ta = el('textarea', {
      class: 'ed-ta', spellcheck: 'false', autocapitalize: 'off', autocorrect: 'off',
      autocomplete: 'off', wrap: 'off', inputmode: 'text'
    });
    this.ta.value = value;
    this.codeBox.append(this.pre, this.ta);
    this.inner.append(this.gutter, this.codeBox);
    this.scroll.appendChild(this.inner);
    this.console = el('div', { class: 'console hide' });
    this.wrap.append(this.bar, this.find, this.scroll, this.console);
    host.appendChild(this.wrap);

    this.ta.addEventListener('input', () => { this.render(); this.schedulePush(); });
    this.ta.addEventListener('keydown', e => this.onKey(e));
    this.ta.addEventListener('scroll', () => { this.scroll.scrollTop = this.ta.scrollTop; });
    /* keep the caret visible above the on-screen keyboard */
    this.ta.addEventListener('focus', () => setTimeout(() => this.ensureCaretVisible(), 320));
    this.render();
  }
  get value() { return this.ta.value; }
  set value(v) { this.ta.value = v; this.render(); this.history = [v]; this.hIndex = 0; }
  setName(n) { this.name = n; this.fname.textContent = n; }

  render() {
    const code = this.ta.value;
    this.pre.innerHTML = highlight(code) + '\n';
    const lines = code.split('\n').length;
    if (this._lines !== lines) {
      this._lines = lines;
      let g = '';
      for (let i = 1; i <= lines; i++) g += i + '\n';
      this.gutter.textContent = g;
    }
  }
  ensureCaretVisible() {
    const before = this.ta.value.slice(0, this.ta.selectionStart).split('\n').length;
    const lineH = 12.5 * 1.65;
    const y = before * lineH;
    const view = this.scroll.clientHeight;
    if (y > this.scroll.scrollTop + view - 60 || y < this.scroll.scrollTop) {
      this.scroll.scrollTop = Math.max(0, y - view * 0.55);
    }
  }
  onKey(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.ta.selectionStart, en = this.ta.selectionEnd;
      this.ta.value = this.ta.value.slice(0, s) + '  ' + this.ta.value.slice(en);
      this.ta.selectionStart = this.ta.selectionEnd = s + 2;
      this.render(); this.schedulePush();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault(); e.shiftKey ? this.redo() : this.undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault(); this.save();
    } else if (e.key === 'Enter') {
      const s = this.ta.selectionStart;
      const line = this.ta.value.slice(0, s).split('\n').pop();
      const indent = (line.match(/^\s*/) || [''])[0] + (/[{([]$/.test(line.trim()) ? '  ' : '');
      if (indent) {
        e.preventDefault();
        this.ta.value = this.ta.value.slice(0, s) + '\n' + indent + this.ta.value.slice(this.ta.selectionEnd);
        this.ta.selectionStart = this.ta.selectionEnd = s + 1 + indent.length;
        this.render(); this.schedulePush();
      }
      setTimeout(() => this.ensureCaretVisible(), 0);
    }
  }
  schedulePush() { clearTimeout(this._pushT); this._pushT = setTimeout(() => this.push(), 550); }
  push() {
    const v = this.ta.value;
    if (this.history[this.hIndex] === v) return;
    this.history = this.history.slice(0, this.hIndex + 1);
    this.history.push(v);
    if (this.history.length > 120) this.history.shift();
    this.hIndex = this.history.length - 1;
  }
  undo() { this.push(); if (this.hIndex > 0) { this.hIndex--; this.ta.value = this.history[this.hIndex]; this.render(); } }
  redo() { if (this.hIndex < this.history.length - 1) { this.hIndex++; this.ta.value = this.history[this.hIndex]; this.render(); } }
  toggleFind(on) {
    const show = on == null ? this.find.classList.contains('hide') : on;
    this.find.classList.toggle('hide', !show);
    if (show) this.findInput.focus();
  }
  findNext() {
    const q = this.findInput.value;
    if (!q) return;
    const from = this.ta.selectionEnd || 0;
    let i = this.ta.value.indexOf(q, from);
    if (i < 0) i = this.ta.value.indexOf(q, 0);
    if (i < 0) { Toast.show('لا يوجد'); return; }
    this.ta.focus();
    this.ta.setSelectionRange(i, i + q.length);
    this.ensureCaretVisible();
  }
  log(msg, type = 'log') {
    this.console.classList.remove('hide');
    const l = el('div', { class: 'l ' + (type === 'err' ? 'err' : type === 'warn' ? 'warn' : type === 'sys' ? 'sys' : ''), text: msg });
    this.console.appendChild(l);
    while (this.console.children.length > 200) this.console.firstChild.remove();
    this.console.scrollTop = this.console.scrollHeight;
  }
  clearLog() { this.console.textContent = ''; this.console.classList.add('hide'); }
  save() { this.push(); this.onSave && this.onSave(this.value); }
  run() { this.push(); this.clearLog(); this.onRun && this.onRun(this.value, m => this.log(m)); }
}

/* ============================================================
   AI ASSISTANT (rules 30, 31)
   A helper on top of the script system — never a replacement.
   Everything it produces is visible, editable and removable.
   ============================================================ */
const AI = {
  cfg() { return LS.get('aiConfig', { provider: 'none', apiKey: '', model: '', baseURL: '' }); },
  setCfg(c) { LS.set('aiConfig', c); },

  systemPrompt(project, engine) {
    const objects = Array.from(engine.entities.values()).map(e => `${e.name} (${e.type}${e.assetId ? ', asset' : ''})`).join(', ') || 'none';
    const api = NX.API_DOCS.map(d => d.ns + ': ' + d.m.map(m => m[0]).join(' | ')).join('\n');
    return `You write gameplay code for the NEXUS engine, a browser 3D engine.
Rules:
- Only use the engine API below plus plain JavaScript. No DOM, no fetch, no imports, no window.
- A script may define start(), update(dt), destroy(). "self" is the object the script is attached to (may be null).
- Never invent assets. To place a model use await Scene.spawn(assetId) with an id the user gives you, or Scene.create({type:'primitive',...}).
- Answer ONLY with one JSON object, no prose outside it:
{"explanation":"short arabic explanation","scripts":[{"name":"FileName.js","attachTo":"ObjectName or null","code":"…"}]}

ENGINE API
${api}

CURRENT SCENE OBJECTS: ${objects}`;
  },

  async ask(prompt, project, engine) {
    const c = this.cfg();
    if (c.provider === 'openai' && c.apiKey) return this.askOpenAI(prompt, project, engine, c);
    if (c.provider === 'anthropic' && c.apiKey) return this.askAnthropic(prompt, project, engine, c);
    return this.local(prompt, project, engine);
  },

  async askOpenAI(prompt, project, engine, c) {
    const base = c.baseURL || 'https://api.openai.com/v1';
    const r = await fetch(base.replace(/\/$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + c.apiKey },
      body: JSON.stringify({
        model: c.model || 'gpt-4o-mini',
        messages: [{ role: 'system', content: this.systemPrompt(project, engine) }, { role: 'user', content: prompt }],
        temperature: 0.3
      })
    });
    if (!r.ok) throw new Error('AI_HTTP_' + r.status + ': ' + (await r.text()).slice(0, 200));
    const j = await r.json();
    return this.parse(j.choices[0].message.content, 'model');
  },

  async askAnthropic(prompt, project, engine, c) {
    const r = await fetch((c.baseURL || 'https://api.anthropic.com') + '/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json', 'x-api-key': c.apiKey,
        'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: c.model || 'claude-sonnet-5',
        max_tokens: 4000,
        system: this.systemPrompt(project, engine),
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!r.ok) throw new Error('AI_HTTP_' + r.status + ': ' + (await r.text()).slice(0, 200));

    let obj = null;
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    const raw = fence ? fence[1] : text;
    try { obj = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1)); } catch {}
    if (!obj || !obj.scripts) {
      const js = text.match(/```(?:js|javascript)\s*([\s\S]*?)```/);

    }
    if (!obj) throw new Error('AI_BAD_RESPONSE');
    obj.source = source;
    return obj;

    this._autosave = setInterval(() => { if (this.dirty && !this.playing) this.save(true); }, 30000);
