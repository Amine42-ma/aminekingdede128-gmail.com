<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>مملكة الرمال — Kingdom of Sands</title>
<meta name="description" content="ابنِ إمارتك في قلب الربع الخالي، أدِر الماء، درّب جيشك، وقُد بطلك بنفسك في غارات على قواعد لاعبين حقيقيين.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   §1  مملكة الرمال — نظام التصميم
   ══════════════════════════════════════════════════════════════════ */
:root{
  --sand-1:#f4dfb8; --sand-2:#dcbd8a; --sand-3:#b8935e; --sand-4:#8a6a41;
  --dune:#6b4f2f; --earth:#3b2a1a; --night:#150f0c;
  --ink:#fdf3e0; --ink-2:#d9c3a1; --ink-3:#a08a6c;
  --gold:#f5c451; --gold-2:#d99b2b; --gold-deep:#7a5210;
  --water:#3fc9c0; --water-2:#1d8f95;
  --date:#c97b3e; --crystal:#9b8bff;
  --blood:#e0553f; --heal:#5fd47a;
  --panel:rgba(30,20,13,.86); --panel-2:rgba(46,32,20,.92);
  --line:rgba(245,196,81,.16); --line-2:rgba(245,196,81,.34);
  --glass:rgba(255,236,204,.06);
  --sh:0 18px 46px -14px rgba(0,0,0,.85);
  --sh-in:inset 0 1px 0 rgba(255,232,190,.14), inset 0 -2px 0 rgba(0,0,0,.35);
  --r:14px; --r-s:9px; --r-l:22px;
  --f:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fh:'Amiri','Tajawal',serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;background:var(--night);color:var(--ink);
  font-family:var(--f);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
h1,h2,h3,h4{margin:0;font-weight:800;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
canvas{display:block;touch-action:none}
.hd{font-family:var(--fh);font-weight:700;letter-spacing:.01em}
[hidden]{display:none!important}

/* ── شاشة الإقلاع ───────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:900;display:grid;place-items:center;
  background:radial-gradient(ellipse 120% 90% at 50% 8%,#5b3a20,#241609 55%,#0d0805);
  transition:opacity .7s var(--ease),visibility .7s}
#boot.gone{opacity:0;visibility:hidden}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px;text-align:center;max-width:440px}
.crest{width:112px;height:112px;position:relative;filter:drop-shadow(0 12px 26px rgba(0,0,0,.65))}
.crest svg{width:100%;height:100%;animation:crestIn 1.4s var(--ease) both}
@keyframes crestIn{from{opacity:0;transform:translateY(14px) scale(.86)}to{opacity:1;transform:none}}
#boot h1{font-family:var(--fh);font-size:38px;
  background:linear-gradient(180deg,#ffe9b0,var(--gold) 45%,#b57d18);
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
#boot .tag{color:var(--ink-3);font-size:13.5px;max-width:340px}
.bar{width:min(300px,74vw);height:7px;border-radius:99px;background:rgba(0,0,0,.5);
  overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.bar i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-2),var(--gold),#fff0c4);
  transition:width .35s var(--ease);box-shadow:0 0 12px rgba(245,196,81,.6)}
#bootMsg{font-size:12.5px;color:var(--ink-3);min-height:20px;letter-spacing:.01em}

/* ── المسرح ─────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;overflow:hidden;background:#0d0805}
#cv{position:absolute;inset:0;width:100%;height:100%}

/* ── شريط الموارد العلوي ───────────────────────────────────────── */
.hud{position:fixed;top:0;inset-inline:0;z-index:40;padding:calc(var(--safe-t) + 8px) 10px 0;
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.res-col{display:flex;flex-direction:column;gap:5px}
.res{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh),var(--sh-in);
  min-width:126px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.res .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:13px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}
.res .ic.w{background:linear-gradient(160deg,#63e7de,#12676c)}
.res .ic.g{background:linear-gradient(160deg,#ffe08a,#a9700d)}
.res .ic.d{background:linear-gradient(160deg,#e8a86a,#7d3f14)}
.res .ic.c{background:linear-gradient(160deg,#c3b8ff,#4f3fa8)}
.res .col{flex:1;min-width:0}
.res .num{font-size:13px;font-weight:800;letter-spacing:.02em;line-height:1.15;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:start}
.res .trk{height:3px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:2px}
.res .trk i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease)}
.res.w .trk i{background:linear-gradient(90deg,#1d8f95,#63e7de)}
.res.g .trk i{background:linear-gradient(90deg,#a9700d,#ffe08a)}
.res.d .trk i{background:linear-gradient(90deg,#7d3f14,#e8a86a)}
.res.c .trk i{background:linear-gradient(90deg,#4f3fa8,#c3b8ff)}
.res.low .num{color:var(--blood);animation:blip 1.4s infinite}
@keyframes blip{50%{opacity:.45}}
.hud .spacer{flex:1}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.badge{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh),var(--sh-in);
  font-size:12.5px;font-weight:700;backdrop-filter:blur(12px)}
.badge b{font-size:14px;font-variant-numeric:tabular-nums}
.badge.tro b{color:var(--gold)}
.pl{display:flex;align-items:center;gap:9px;padding:4px 11px 4px 4px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh),var(--sh-in);backdrop-filter:blur(12px)}
.pl .lv{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,#ffe08a,#8c5a08);color:#3a2405;font-weight:900;font-size:13px;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.3)}
.pl .nm{font-size:12.5px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .xp{height:3px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:2px}
.pl .xp i{display:block;height:100%;background:linear-gradient(90deg,#5fd47a,#b6ff9e);transition:width .5s var(--ease)}

/* ── البنّاؤون ─────────────────────────────────────────────────── */
.builders{position:fixed;z-index:40;inset-inline-end:10px;top:calc(var(--safe-t) + 92px);
  display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bh{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:99px;font-size:11.5px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(10px);
  font-variant-numeric:tabular-nums;cursor:pointer;transition:.25s var(--ease)}
.bh:hover{border-color:var(--line-2)}
.bh .d{width:8px;height:8px;border-radius:50%;background:var(--heal);flex:none}
.bh.busy .d{background:var(--gold);animation:blip 1.6s infinite}

/* ── الرصيف السفلي ─────────────────────────────────────────────── */
.dock{position:fixed;z-index:45;bottom:calc(var(--safe-b) + 10px);inset-inline:0;
  display:flex;justify-content:center;pointer-events:none}
.dock-in{display:flex;gap:6px;padding:7px;border-radius:var(--r-l);pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh),var(--sh-in);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-width:calc(100vw - 20px);overflow-x:auto;
  scrollbar-width:none}
.dock-in::-webkit-scrollbar{display:none}
.db{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;padding:7px 8px 5px;
  border-radius:var(--r);transition:.22s var(--ease);position:relative;flex:none}
.db svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.22s}
.db span{font-size:10.5px;font-weight:700;color:var(--ink-3);transition:.22s}
.db:hover{background:var(--glass)}
.db:hover svg{stroke:var(--gold)}
.db:hover span{color:var(--ink-2)}
.db.on{background:linear-gradient(180deg,rgba(245,196,81,.2),rgba(245,196,81,.07))}
.db.on svg{stroke:var(--gold)}
.db.on span{color:var(--gold)}
.db .dot{position:absolute;top:5px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;
  background:var(--blood);box-shadow:0 0 0 2px var(--panel)}
.db.attack{background:linear-gradient(180deg,#c0442f,#7d2416);box-shadow:inset 0 1px 0 rgba(255,180,160,.35),0 6px 16px -6px rgba(192,68,47,.8)}
.db.attack svg{stroke:#ffe4dc}
.db.attack span{color:#ffd9d0}

/* ── الألواح المنزلقة ─────────────────────────────────────────── */
.sheet{position:fixed;z-index:60;inset-inline:0;bottom:0;max-height:74vh;
  background:linear-gradient(180deg,var(--panel-2),rgba(24,16,10,.97));
  border-top:1px solid var(--line-2);border-radius:26px 26px 0 0;
  box-shadow:0 -22px 60px -18px rgba(0,0,0,.9);
  transform:translateY(102%);transition:transform .42s var(--ease);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.open{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font-size:16px;font-family:var(--fh)}
.sheet-h .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
.grab{position:absolute;top:7px;inset-inline:0;margin:auto;width:40px;height:4px;border-radius:99px;background:rgba(255,236,204,.22)}
.x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass);
  border:1px solid var(--line);margin-inline-start:auto;flex:none;transition:.22s}
.x:hover{background:rgba(224,85,63,.2);border-color:rgba(224,85,63,.5)}
.x svg{width:15px;height:15px;stroke:var(--ink-2);stroke-width:2;fill:none;stroke-linecap:round}
.sheet-b{overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:5px;padding:0 16px 10px;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 13px;border-radius:99px;font-size:12px;font-weight:700;color:var(--ink-3);
  border:1px solid transparent;white-space:nowrap;transition:.22s var(--ease)}
.tab:hover{color:var(--ink-2);background:var(--glass)}
.tab.on{color:var(--night);background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:rgba(0,0,0,.25)}

/* ── بطاقات المتجر ─────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:9px;
  display:flex;flex-direction:column;gap:6px;transition:.24s var(--ease);position:relative;overflow:hidden;text-align:center}
.card:hover{border-color:var(--line-2);background:rgba(245,196,81,.09);transform:translateY(-2px)}
.card.locked{opacity:.42;pointer-events:none}
.card.cant{opacity:.62}
.card .thumb{height:64px;display:grid;place-items:center;border-radius:var(--r-s);
  background:radial-gradient(ellipse 80% 70% at 50% 78%,rgba(184,147,94,.4),rgba(0,0,0,.28));overflow:hidden}
.card .thumb canvas,.card .thumb img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
.card .nm{font-size:12px;font-weight:800;line-height:1.3}
.card .meta{font-size:10.5px;color:var(--ink-3);font-weight:600}
.card .price{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:800;
  padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.card .price.no{color:var(--blood)}
.card .tagx{position:absolute;top:6px;inset-inline-start:6px;font-size:9.5px;font-weight:800;padding:2px 7px;
  border-radius:99px;background:rgba(0,0,0,.6);color:var(--ink-3)}
.dot-i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;vertical-align:-1px}
.dot-i.w{background:linear-gradient(160deg,#63e7de,#12676c)}
.dot-i.g{background:linear-gradient(160deg,#ffe08a,#a9700d)}
.dot-i.d{background:linear-gradient(160deg,#e8a86a,#7d3f14)}
.dot-i.c{background:linear-gradient(160deg,#c3b8ff,#4f3fa8)}

/* ── لوحة المبنى المحدد ───────────────────────────────────────── */
.sel{position:fixed;z-index:50;bottom:calc(var(--safe-b) + 84px);inset-inline:0;margin:auto;
  width:min(420px,calc(100vw - 20px));padding:12px 14px;border-radius:var(--r-l);
  background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--sh),var(--sh-in);
  backdrop-filter:blur(18px);transform:translateY(18px) scale(.96);opacity:0;visibility:hidden;
  transition:.32s var(--ease)}
.sel.open{transform:none;opacity:1;visibility:visible}
.sel-t{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sel-t .ico{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 80%,rgba(184,147,94,.42),rgba(0,0,0,.3));border:1px solid var(--line)}
.sel-t h3{font-size:14.5px}
.sel-t .lv2{font-size:11px;color:var(--gold);font-weight:800}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.st{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:rgba(0,0,0,.32);color:var(--ink-2);font-variant-numeric:tabular-nums}
.st b{color:var(--ink)}
.st.up b{color:var(--heal)}
.acts{display:flex;gap:7px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:var(--r-s);
  font-size:12.5px;font-weight:800;transition:.24s var(--ease);border:1px solid var(--line);background:var(--glass);
  box-shadow:var(--sh-in)}
.btn:hover{background:rgba(245,196,81,.14);border-color:var(--line-2)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#3a2405;border-color:rgba(0,0,0,.28)}
.btn.pri:hover{background:linear-gradient(180deg,#ffdc82,#e8a92f)}
.btn.pri:disabled,.btn:disabled{opacity:.4;pointer-events:none}
.btn.war{background:linear-gradient(180deg,#c0442f,#7d2416);color:#ffe4dc;border-color:rgba(0,0,0,.3)}
.btn.sm{flex:none;padding:9px 12px}

/* ── وضع الوضع/النقل ──────────────────────────────────────────── */
.placebar{position:fixed;z-index:55;bottom:calc(var(--safe-b) + 16px);inset-inline:0;margin:auto;
  width:min(360px,calc(100vw - 24px));display:flex;gap:8px;padding:9px;border-radius:var(--r-l);
  background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--sh);backdrop-filter:blur(16px);
  transform:translateY(20px);opacity:0;visibility:hidden;transition:.3s var(--ease)}
.placebar.open{transform:none;opacity:1;visibility:visible}
.hintbar{position:fixed;z-index:55;top:calc(var(--safe-t) + 96px);inset-inline:0;margin:auto;width:max-content;
  max-width:calc(100vw - 32px);padding:7px 15px;border-radius:99px;font-size:12px;font-weight:700;
  background:rgba(0,0,0,.72);border:1px solid var(--line);backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:.3s var(--ease);text-align:center}
.hintbar.open{opacity:1;visibility:visible}

/* ── النوافذ ───────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;
  background:rgba(6,4,2,.72);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:.34s var(--ease)}
.modal.open{opacity:1;visibility:visible}
.modal-in{width:min(520px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel-2),rgba(22,15,9,.98));
  border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 34px 80px -20px rgba(0,0,0,.92);
  transform:translateY(16px) scale(.97);transition:.34s var(--ease);overflow:hidden}
.modal.open .modal-in{transform:none}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex:none}
.modal-h h2{font-size:16px;font-family:var(--fh)}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}

/* ── التنبيهات ─────────────────────────────────────────────────── */
#toasts{position:fixed;z-index:95;top:calc(var(--safe-t) + 8px);inset-inline:0;margin:auto;width:max-content;
  max-width:calc(100vw - 24px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:8px 16px;border-radius:99px;font-size:12.5px;font-weight:700;
  background:rgba(20,13,8,.94);border:1px solid var(--line-2);box-shadow:var(--sh);backdrop-filter:blur(10px);
  animation:tin .4s var(--ease) both;max-width:100%;text-align:center}
.toast.bad{border-color:rgba(224,85,63,.55);color:#ffcfc6}
.toast.good{border-color:rgba(95,212,122,.5);color:#d3ffdd}
.toast.out{animation:tout .35s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}

/* ── واجهة المعركة ─────────────────────────────────────────────── */
 #war{position:fixed;inset:0;z-index:48;pointer-events:none;opacity:0;visibility:hidden;transition:.4s var(--ease)}
#war.on{opacity:1;visibility:visible}
#war>*{pointer-events:auto}
.war-top{position:absolute;top:calc(var(--safe-t) + 8px);inset-inline:0;margin:auto;width:min(560px,calc(100vw - 16px));
  display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--r-l);
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(14px)}
.war-top .tm{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;min-width:52px}
.war-top .tm.hot{color:var(--blood)}
.stars{display:flex;gap:3px}
.stars svg{width:19px;height:19px}
.stars .s{fill:rgba(0,0,0,.45);stroke:rgba(245,196,81,.35);stroke-width:1.2}
.stars .s.on{fill:var(--gold);stroke:#fff3cf;filter:drop-shadow(0 0 6px rgba(245,196,81,.8));animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.dm{flex:1;min-width:60px}
.dm .trk{height:6px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.dm .trk i{display:block;height:100%;background:linear-gradient(90deg,#e0553f,#ffb066);transition:width .3s var(--ease)}
.dm .lb{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.loot{display:flex;gap:7px;flex-wrap:wrap}

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   §3  النواة — عشوائية حتمية، رياضيات، أدوات
   ══════════════════════════════════════════════════════════════════ */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>[...(r||document).querySelectorAll(s)];
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const now  =()=>performance.now();

/* PRNG حتمي — نفس البذرة تعطي نفس العالم دائماً */
function rng(seed){let a=(seed>>>0)||1;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};

/* أرقام عربية للعرض */
const AR='٠١٢٣٤٥٦٧٨٩';
const ad=n=>String(n).replace(/\d/g,d=>AR[+d]);
const LRM='\u200E';
function fmt(n){n=Math.floor(n);if(n<0)n=0;
  if(n<1000)return''+n;
  if(n<1e6){const v=n/1000;return(v<10?v.toFixed(1).replace(/\.0$/,''):Math.floor(v))+'ك'+LRM;}
  const v=n/1e6;return(v<10?v.toFixed(1).replace(/\.0$/,''):Math.floor(v))+'م'+LRM;}
function tfmt(s){s=Math.max(0,Math.ceil(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  if(h>0)return ad(h)+'س '+ad(m)+'د';
  if(m>0)return ad(m)+'د '+ad(x)+'ث';
  return ad(x)+'ث';}
function tclock(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),x=s%60;return ad(m)+':'+ad(String(x).padStart(2,'0'));}

/* لوحات مؤقتة */
function cvs(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function ctx2(c){const x=c.getContext('2d');x.imageSmoothingQuality='high';return x;}

/* ══════════════════════════════════════════════════════════════════
   §4  المواد — تكستر مولَّد إجرائياً مع خرائط نُتوء وإضاءة
   ══════════════════════════════════════════════════════════════════ */

/* اتجاه الشمس في فضاء الشاشة (من أعلى اليسار) */
const SUN=(()=>{let x=-.52,y=-.68,z=.52;const l=Math.hypot(x,y,z);return{x:x/l,y:y/l,z:z/l};})();

/* ضجيج قيمي قابل للتبليط */
function vnoise(seed,per){
  const g=new Float32Array(per*per),r=rng(seed);
  for(let i=0;i<g.length;i++)g[i]=r();
  return(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const i0=((xi%per)+per)%per,i1=(i0+1)%per,j0=((yi%per)+per)%per,j1=(j0+1)%per;
    const a=g[j0*per+i0],b=g[j0*per+i1],c=g[j1*per+i0],d=g[j1*per+i1];
    const t=a+(b-a)*u,s=c+(d-c)*u;
    return t+(s-t)*v;
  };
}
/* fBm قابل للتبليط: x,y في مجال ٠..١ */
function fbmT(seed,per,oct,gain){
  gain=gain||.5;const L=[];let amp=1,tot=0;
  for(let o=0;o<oct;o++){L.push({n:vnoise(seed+o*7919,per<<o),s:per<<o,a:amp});tot+=amp;amp*=gain;}
  return(x,y)=>{let v=0;for(const l of L)v+=l.n(x*l.s,y*l.s)*l.a;return v/tot;};
}

/**
 * يبني بلاطة مادة: يحسب خريطة ارتفاع، ثم normal map، ثم إضاءة Lambert+specular.
 * height(x,y)->0..1 ، tint(x,y,h)->[r,g,b]
 */
function matTile(o){
  const S=o.size||128, c=cvs(S,S), x=ctx2(c), img=x.createImageData(S,S), D=img.data;
  const H=new Float32Array(S*S);
  for(let j=0;j<S;j++)for(let i=0;i<S;i++)H[j*S+i]=o.height(i/S,j/S);
  const bump=o.bump==null?1:o.bump, amb=o.amb==null?.42:o.amb,
        dif=o.dif==null?.78:o.dif, spec=o.spec==null?.12:o.spec, shin=o.shin||18;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const k=j*S+i;
    const l=H[j*S+((i-1+S)%S)], r=H[j*S+((i+1)%S)],
          u=H[((j-1+S)%S)*S+i], d=H[((j+1)%S)*S+i];
    let nx=(l-r)*bump*S/32, ny=(u-d)*bump*S/32, nz=1;
    const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
    const nd=Math.max(0,nx*SUN.x+ny*SUN.y+nz*SUN.z);
    /* انعكاس نحو الناظر (0,0,1) */
    const rx=2*nd*nx-SUN.x, ry=2*nd*ny-SUN.y, rz=2*nd*nz-SUN.z;
    const sp=Math.pow(Math.max(0,rz),shin)*spec;
    const col=o.tint(i/S,j/S,H[k]);
    const li=amb+dif*nd;
    D[k*4]  =clamp(col[0]*li+sp*255,0,255);
    D[k*4+1]=clamp(col[1]*li+sp*255,0,255);
    D[k*4+2]=clamp(col[2]*li+sp*255,0,255);
    D[k*4+3]=255;
  }
  x.putImageData(img,0,0);
  return c;
}

const MAT={};  /* بلاطات المواد الجاهزة */
const MATC={}; /* متوسط لون كل مادة */
const PAT={};  /* أنماط Canvas منها */

function buildMaterials(){
  const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

  /* رمل الأرض: حبيبات دقيقة، كثبان واسعة، وتموّج ريح خفيف */
  {
    const grain=fbmT(101,64,3), dune=fbmT(207,3,3), wob=fbmT(313,6,2);
    MAT.sand=matTile({size:256,bump:.3,amb:.66,dif:.44,spec:.02,shin:34,
      height:(x,y)=>{
        const rip=Math.sin((x*3.1+y*1.6+wob(x,y)*2.6)*TAU)*.5+.5;
        return dune(x,y)*.56+rip*.2+grain(x,y)*.24;
      },
      tint:(x,y,h)=>{
        const t=clamp(h*1.05+.05,0,1);
        return mix([196,160,110],[238,214,172],t);
      }});
  }
  /* حجر رملي: طبقات هادئة وشقوق دقيقة */
  {
    const st=fbmT(311,5,3), cr=fbmT(419,9,2), gr=fbmT(523,56,2);
    MAT.stone=matTile({size:128,bump:.52,amb:.58,dif:.56,spec:.05,shin:18,
      height:(x,y)=>{
        const layer=Math.sin((y*4.2+st(x,y)*1.3)*TAU)*.5+.5;
        const crack=Math.pow(1-Math.abs(cr(x,y)-.5)*2,10);
        return clamp(layer*.2+st(x,y)*.5+gr(x,y)*.16-crack*.3,0,1);
      },
      tint:(x,y,h)=>mix([172,144,106],[233,213,178],clamp(h*1.05+.06,0,1))});
  }
  /* طوب طيني: لبنات كبيرة بملاط ناعم */
  {
    const n=fbmT(631,30,2);
    const BW=.34,BH=.17;
    MAT.brick=matTile({size:128,bump:.8,amb:.54,dif:.6,spec:.04,shin:14,
      height:(x,y)=>{
        const row=Math.floor(y/BH), off=(row%2)*BW*.5;
        const bx=((x+off)%BW)/BW, by=(y%BH)/BH;
        const edge=Math.min(bx,1-bx,by,1-by);
        const m=clamp(edge/.1,0,1);
        return .32+m*.5+n(x,y)*.18-(1-m)*.18;
      },
      tint:(x,y,h)=>{
        const row=Math.floor(y/BH), off=(row%2)*BW*.5;
        const bx=Math.floor((x+off)/BW), v=((bx*31+row*17)%7)/7;
        const base=mix([178,134,90],[209,170,122],v);
        return h<.42?mix(base,[142,112,82],.55):mix(base,[236,210,168],clamp((h-.42)*1.1,0,1));
      }});
  }
  /* خشب النخيل: ألياف رأسية */
  {
    const f=fbmT(743,4,3), g=fbmT(811,40,2);
    MAT.wood=matTile({size:96,bump:.66,amb:.46,dif:.66,spec:.07,shin:22,
      height:(x,y)=>{
        const fib=Math.sin((x*15+f(x,y)*2.6)*TAU)*.5+.5;
        return fib*.3+g(x,y)*.2+f(x,y)*.5;
      },
      tint:(x,y,h)=>mix([104,72,40],[178,136,84],clamp(h*1.15+.05,0,1))});

  /* قماش الخيام: نسيج متقاطع + تجاعيد */
  {

    MAT.cloth=matTile({size:112,bump:.6,amb:.56,dif:.6,spec:.04,shin:24,
      height:(x,y)=>{
        const weave=(Math.sin(x*44*TAU)*.5+.5)*.5+(Math.sin(y*44*TAU)*.5+.5)*.5;
        return weave*.3+w(x,y)*.55+t(x,y)*.15;
      },
      tint:(x,y,h)=>{
        const stripe=Math.sin(y*7*TAU)>.35;
        const a=stripe?[126,58,44]:[178,146,106];

  /* برونز مؤكسد */
  {
    const p=fbmT(1117,7,4), s=fbmT(1223,30,2);
    MAT.bronze=matTile({size:96,bump:.7,amb:.3,dif:.72,spec:.55,shin:42,
      height:(x,y)=>p(x,y)*.7+s(x,y)*.3,
      tint:(x,y,h)=>{
        const pat=clamp((p(x*1.4,y*1.4)-.48)*3.4,0,1);
        return mix(mix([104,66,26],[214,164,74],clamp(h*1.4,0,1)),[74,148,132],pat*.62);
      }});
  }
  /* ذهب مصقول */
  {
    const p=fbmT(1301,12,3);
    MAT.gold=matTile({size:80,bump:.5,amb:.34,dif:.7,spec:.85,shin:64,
      height:(x,y)=>p(x,y),
      tint:(x,y,h)=>mix([146,96,14],[255,232,150],clamp(h*1.5,0,1))});
  }
  /* بلّور صحراوي */
  {
    const f=fbmT(1409,5,2);
    MAT.crystal=matTile({size:96,bump:1.6,amb:.5,dif:.6,spec:.9,shin:80,
      height:(x,y)=>{
        const a=Math.abs(((x*4+y*2.4+f(x,y)*1.6)%1)-.5)*2;
        return 1-a*.85;
      },
      tint:(x,y,h)=>mix([76,60,152],[206,196,255],clamp(h*1.2,0,1))});
  }
  /* سعف النخيل للسقوف */
  {
    const f=fbmT(1511,8,3);
    MAT.thatch=matTile({size:112,bump:.85,amb:.5,dif:.66,spec:.06,shin:18,
      height:(x,y)=>{
        const bl=Math.sin((x*16+Math.sin(y*5*TAU)*.6+f(x,y)*2)*TAU)*.5+.5;
        return bl*.55+f(x,y)*.45;
      },
      tint:(x,y,h)=>mix([104,80,38],[212,184,116],clamp(h*1.12+.05,0,1))});
  }
  /* ماء البئر */
  {
    const w=fbmT(1607,6,3);
    MAT.water=matTile({size:96,bump:.6,amb:.44,dif:.6,spec:.7,shin:50,
      height:(x,y)=>w(x,y),
      tint:(x,y,h)=>mix([12,74,88],[90,214,206],clamp(h*1.3,0,1))});
  }
  /* عشب/نبات واحة */
  {
    const g=fbmT(1709,10,3);
    MAT.leaf=matTile({size:96,bump:1.1,amb:.4,dif:.8,spec:.1,shin:24,
      height:(x,y)=>{
        const v=Math.sin((y*14+g(x,y)*2.4)*TAU)*.5+.5;
        return v*.45+g(x,y)*.55;
      },
      tint:(x,y,h)=>mix([38,72,32],[126,176,72],clamp(h*1.25,0,1))});
  }
  /* تحويل لأنماط + متوسط اللون */
  const px=ctx2(cvs(1,1));
  for(const k in MAT){
    PAT[k]=px.createPattern(MAT[k],'repeat');
    const t=ctx2(MAT[k]).getImageData(0,0,MAT[k].width,MAT[k].height).data;
    let r=0,g2=0,b=0;const n=t.length/4;
    for(let i=0;i<t.length;i+=4){r+=t[i];g2+=t[i+1];b+=t[i+2];}
    MATC[k]=[r/n,g2/n,b/n];
  }
}

/* ══════════════════════════════════════════════════════════════════
   §5  الهندسة الأيزومترية وأدوات الرسم المجسّم
   ══════════════════════════════════════════════════════════════════ */
const TW=64, TH=32, GRID=40;          /* عرض/ارتفاع البلاطة، وحجم الشبكة */
const HW=TW/2, HH=TH/2;

const isoX=(gx,gy)=>(gx-gy)*HW;
const isoY=(gx,gy)=>(gx+gy)*HH;
/* من إحداثيات العالم إلى الشبكة */
function unIso(wx,wy){return{gx:(wy/HH+wx/HW)/2, gy:(wy/HH-wx/HW)/2};}

/* ظلال الوجوه: أعلى ← أفتح، يسار ← متوسط، يمين ← أغمق */
const F_TOP=1.07, F_LEFT=.78, F_RIGHT=.56;

/**
 * سياق رسم مجسّم فوق لوحة: يحوّل (u,v,h) المحلية إلى بكسل.
 * u,v بوحدات البلاطة، h بالبكسل لأعلى.
 */
function G(x,ox,oy){
  const P=(u,v,h)=>[(u-v)*HW+ox,(u+v)*HH+oy-(h||0)];
  const g={
    x,ox,oy,P,
    poly(pts,fill,alpha){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
      if(alpha!=null)x.globalAlpha=alpha;x.fillStyle=fill;x.fill();x.globalAlpha=1;},
    /* وجه مادي مظلّل */
    face(pts,mat,shade,tint){
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
      x.fillStyle=PAT[mat]||mat;x.fill();
      if(tint){x.globalAlpha=tint[3];x.fillStyle='rgb('+tint[0]+','+tint[1]+','+tint[2]+')';x.fill();x.globalAlpha=1;}
      if(shade<1){x.globalAlpha=(1-shade)*.92;x.fillStyle='#0d0703';x.fill();x.globalAlpha=1;}
      else if(shade>1){x.globalAlpha=(shade-1);x.fillStyle='#fff0d2';x.fill();x.globalAlpha=1;}
    },
    /* مجسّم مستطيل (يقبل تضييقاً للأعلى: عمارة طينية) */
    box(u0,v0,u1,v1,hb,ht,o){
      o=o||{};const mat=o.mat||'brick',tp=o.taper||0,tint=o.tint;
      const cu=(u0+u1)/2,cv=(v0+v1)/2;
      const tu0=lerp(u0,cu,tp),tu1=lerp(u1,cu,tp),tv0=lerp(v0,cv,tp),tv1=lerp(v1,cv,tp);
      /* الوجه الأيمن (u=u1) */
      g.face([P(tu1,tv0,ht),P(tu1,tv1,ht),P(u1,v1,hb),P(u1,v0,hb)],mat,F_RIGHT*(o.sh||1),tint);
      /* الوجه الأيسر (v=v1) */
      g.face([P(tu0,tv1,ht),P(tu1,tv1,ht),P(u1,v1,hb),P(u0,v1,hb)],mat,F_LEFT*(o.sh||1),tint);
      /* السطح */
      if(!o.noTop)g.face([P(tu0,tv0,ht),P(tu1,tv0,ht),P(tu1,tv1,ht),P(tu0,tv1,ht)],o.topMat||mat,F_TOP*(o.sh||1),tint);
      /* حافة مضيئة */
      if(o.rim!==false){x.strokeStyle='rgba(255,238,200,.18)';x.lineWidth=1;
        x.beginPath();const a=P(tu0,tv0,ht),b=P(tu1,tv0,ht),c=P(tu0,tv1,ht);
        x.moveTo(b[0],b[1]);x.lineTo(a[0],a[1]);x.lineTo(c[0],c[1]);x.stroke();}
    },
    /* برج أسطواني مضلّع */
    cyl(cu,cv,r,hb,ht,o){
      o=o||{};const N=o.sides||16,mat=o.mat||'stone',tp=o.taper||0;
      const rt=r*(1-tp);
      const sides=[];
      for(let i=0;i<N;i++){
        const a0=i/N*TAU,a1=(i+1)/N*TAU;
        const nx=Math.cos((a0+a1)/2),ny=Math.sin((a0+a1)/2);
        /* الاتجاه في فضاء الشاشة */
        const sx=(nx-ny)*HW,sy=(nx+ny)*HH,l=Math.hypot(sx,sy);
        const face=(sx/l)*SUN.x+(sy/l)*SUN.y;
        sides.push({a0,a1,depth:sy,sh:clamp(.42+Math.max(0,-face)*.72,.3,1.05)});
      }
      sides.sort((a,b)=>a.depth-b.depth);
      for(const s of sides){
        if(s.depth<0)continue; /* الوجوه الخلفية مخفية */
        const p=[P(cu+Math.cos(s.a0)*rt,cv+Math.sin(s.a0)*rt,ht),
                 P(cu+Math.cos(s.a1)*rt,cv+Math.sin(s.a1)*rt,ht),
                 P(cu+Math.cos(s.a1)*r ,cv+Math.sin(s.a1)*r ,hb),
                 P(cu+Math.cos(s.a0)*r ,cv+Math.sin(s.a0)*r ,hb)];
        g.face(p,mat,s.sh,o.tint);
      }
      /* السطح */
      if(!o.noTop){
        const p=[];for(let i=0;i<N;i++){const a=i/N*TAU;p.push(P(cu+Math.cos(a)*rt,cv+Math.sin(a)*rt,ht));}
        g.face(p,o.topMat||mat,F_TOP,o.tint);
      }
    },
    /* قبّة: شرائح أفقية تعطي تدرّجاً مجسّماً حقيقياً */
    dome(cu,cv,r,hb,hgt,o){
      o=o||{};const mat=o.mat||'stone',N=20;
      const av=MATC[mat]||[170,140,100];
      const base=P(cu,cv,hb), RX=r*HW*Math.SQRT2, RY=r*HH*Math.SQRT2;
      for(let i=0;i<=N;i++){
        const t2=i/N, a=t2*Math.PI/2;
        const rr=Math.cos(a), yy=hb+hgt*Math.sin(a);
        const c=P(cu,cv,yy), rx=Math.max(.6,RX*rr), ry=Math.max(.4,RY*rr);
        const li=.38+t2*.86;
        x.beginPath();x.ellipse(c[0],c[1],rx,ry,0,0,TAU);
        x.fillStyle='rgb('+clamp(av[0]*li,0,255).toFixed(0)+','+
          clamp(av[1]*li,0,255).toFixed(0)+','+clamp(av[2]*li,0,255).toFixed(0)+')';
        x.fill();
      }
      /* نمط المادة فوق الشكل كاملاً */
      x.save();
      x.beginPath();
      x.ellipse(base[0],base[1],RX,RY,0,0,Math.PI,false);
      x.ellipse(base[0],base[1],RX,hgt,0,Math.PI,TAU,false);
      x.closePath();x.clip();
      x.globalAlpha=.34;x.fillStyle=PAT[mat];
      x.fillRect(base[0]-RX-2,base[1]-hgt-2,RX*2+4,hgt+RY*2+4);x.globalAlpha=1;
      const gr=x.createRadialGradient(base[0]-RX*.42,base[1]-hgt*.72,1,base[0],base[1]-hgt*.2,RX*1.7);
      gr.addColorStop(0,'rgba(255,246,220,.46)');gr.addColorStop(.42,'rgba(255,232,186,0)');
      gr.addColorStop(1,'rgba(8,4,1,.5)');
      x.fillStyle=gr;x.fillRect(base[0]-RX-2,base[1]-hgt-2,RX*2+4,hgt+RY*2+4);
      if(o.tint){x.globalAlpha=o.tint[3];x.fillStyle='rgb('+o.tint[0]+','+o.tint[1]+','+o.tint[2]+')';
        x.fillRect(base[0]-RX-2,base[1]-hgt-2,RX*2+4,hgt+RY*2+4);x.globalAlpha=1;}
      x.restore();
      x.strokeStyle='rgba(255,240,206,.2)';x.lineWidth=1.1;
      x.beginPath();x.ellipse(base[0],base[1],RX,hgt,0,Math.PI+.15,TAU-.15,false);x.stroke();
    },
    /* سقف مائل فوق مستطيل */
    hip(u0,v0,u1,v1,hb,ht,o){
      o=o||{};const mat=o.mat||'thatch',inset=o.inset==null?.24:o.inset;
      const cv=(v0+v1)/2;
      const a=P(u0,v0,hb),b=P(u1,v0,hb),c=P(u1,v1,hb),d=P(u0,v1,hb);
      const r0=P(u0+(u1-u0)*inset,cv,hb+ht), r1=P(u1-(u1-u0)*inset,cv,hb+ht);
      g.face([a,b,r1,r0],mat,F_TOP*.92,o.tint);      /* الخلفي */
      g.face([a,d,r0],mat,F_LEFT*.9,o.tint);          /* الطرف الأيسر */
      g.face([b,c,r1],mat,F_RIGHT,o.tint);            /* الطرف الأيمن */
      g.face([d,c,r1,r0],mat,F_LEFT*1.08,o.tint);     /* الأمامي */
      x.strokeStyle='rgba(255,240,206,.2)';x.lineWidth=1.1;
      x.beginPath();x.moveTo(r0[0],r0[1]);x.lineTo(r1[0],r1[1]);x.stroke();
    },
    /* مخروط (سقف خيمة/برج) */
    cone(cu,cv,r,hb,hgt,o){
      o=o||{};const N=o.sides||14,mat=o.mat||'cloth';
      const apex=P(cu,cv,hb+hgt),sides=[];
      for(let i=0;i<N;i++){
        const a0=i/N*TAU,a1=(i+1)/N*TAU;
        const nx=Math.cos((a0+a1)/2),ny=Math.sin((a0+a1)/2);
        const sx=(nx-ny)*HW,sy=(nx+ny)*HH,l=Math.hypot(sx,sy);
        const face=(sx/l)*SUN.x+(sy/l)*SUN.y;
        sides.push({a0,a1,depth:sy,sh:clamp(.44+Math.max(0,-face)*.8,.3,1.1)});
      }
      sides.sort((a,b)=>a.depth-b.depth);
      for(const s of sides){
        if(s.depth<-.02)continue;
        g.face([apex,P(cu+Math.cos(s.a0)*r,cv+Math.sin(s.a0)*r,hb),
                     P(cu+Math.cos(s.a1)*r,cv+Math.sin(s.a1)*r,hb)],mat,s.sh,o.tint);
      }
    },
    /* ظل أرضي ناعم */
    shade(cu,cv,rx,ry,a){
      const c=P(cu,cv,0);
      const gr=x.createRadialGradient(c[0],c[1],1,c[0],c[1],Math.max(rx,ry));
      gr.addColorStop(0,'rgba(20,10,4,'+(a||.44)+')');gr.addColorStop(1,'rgba(20,10,4,0)');
      x.save();x.translate(c[0],c[1]);x.scale(1,ry/Math.max(rx,ry));x.translate(-c[0],-c[1]);
      x.fillStyle=gr;x.beginPath();x.arc(c[0],c[1],Math.max(rx,ry),0,TAU);x.fill();x.restore();
    },
    /* راية */
    banner(cu,cv,h,len,col){
      const b=P(cu,cv,0),t=P(cu,cv,h);
      x.strokeStyle='#4a3218';x.lineWidth=2;x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(t[0],t[1]);x.stroke();
      x.beginPath();x.moveTo(t[0],t[1]+2);
      x.quadraticCurveTo(t[0]-len*.5,t[1]+1,t[0]-len,t[1]+5);
      x.lineTo(t[0]-len*.86,t[1]+13);
      x.quadraticCurveTo(t[0]-len*.4,t[1]+11,t[0],t[1]+14);
      x.closePath();x.fillStyle=col||'#c0442f';x.fill();
      x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.moveTo(t[0],t[1]+8);
      x.quadraticCurveTo(t[0]-len*.45,t[1]+7,t[0]-len*.93,t[1]+9);
      x.lineTo(t[0]-len*.86,t[1]+13);x.quadraticCurveTo(t[0]-len*.4,t[1]+11,t[0],t[1]+14);x.closePath();x.fill();
      x.fillStyle='#f5c451';x.beginPath();x.arc(t[0],t[1]-3,2.6,0,TAU);x.fill();
    },
    /* نخلة */
    palm(cu,cv,h,seed){
      const r=rng(seed||7);
      const b=P(cu,cv,0);
      g.shade(cu,cv,13,7,.4);
      const bend=(r()-.5)*10;
      x.save();
      x.strokeStyle=PAT.wood?'#7a5028':'#7a5028';x.lineCap='round';
      for(let i=0;i<3;i++){
        x.strokeStyle=['#5c3c1c','#8a6034','#6b4726'][i];x.lineWidth=[7,4.4,2][i];
        x.beginPath();x.moveTo(b[0],b[1]);
        x.quadraticCurveTo(b[0]+bend*.4,b[1]-h*.55,b[0]+bend,b[1]-h);x.stroke();
      }
      const tx=b[0]+bend,ty=b[1]-h,n=7+Math.floor(r()*3);
      for(let i=0;i<n;i++){
        const a=Math.PI+ (i/(n-1))*Math.PI + (r()-.5)*.22;
        const L=15+r()*11, dx=Math.cos(a)*L, dy=Math.sin(a)*L*.62;
        x.strokeStyle=i%2?'#4e7a2e':'#65963a';x.lineWidth=3.2;x.lineCap='round';
        x.beginPath();x.moveTo(tx,ty);
        x.quadraticCurveTo(tx+dx*.55,ty+dy*.5-7,tx+dx,ty+dy+7);x.stroke();
        x.strokeStyle='rgba(160,210,110,.5)';x.lineWidth=1.1;
        x.beginPath();x.moveTo(tx,ty);
        x.quadraticCurveTo(tx+dx*.55,ty+dy*.5-8,tx+dx*.92,ty+dy+5);x.stroke();
      }
      x.fillStyle='#8a5a22';
      for(let i=0;i<4;i++){const a=r()*TAU;x.beginPath();
        x.arc(tx+Math.cos(a)*6,ty+4+Math.sin(a)*3,2.1,0,TAU);x.fill();}
      x.restore();
    },
    /* صخرة */
    rock(cu,cv,s,seed){
      const r=rng(seed||3),b=P(cu,cv,0);
      g.shade(cu,cv,s*1.2,s*.6,.36);
      const n=6,pts=[];
      for(let i=0;i<n;i++){const a=i/n*TAU,rr=s*(.7+r()*.5);
        pts.push([b[0]+Math.cos(a)*rr,b[1]+Math.sin(a)*rr*.55-s*.5*(1+Math.sin(a))*.4]);}
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<n;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
      x.fillStyle=PAT.stone;x.fill();
      const gr=x.createLinearGradient(b[0]-s,b[1]-s,b[0]+s,b[1]+s);
      gr.addColorStop(0,'rgba(255,240,210,.34)');gr.addColorStop(1,'rgba(0,0,0,.5)');
      x.fillStyle=gr;x.fill();
    }
  };
  return g;
}

/* لوحة سبرايت لمبنى: يحسب المقاس والمرساة تلقائياً */
function spriteCanvas(w,h,hgt,pad){
  pad=pad==null?10:pad;
  const W=(w+h)*HW+pad*2, H=(w+h)*HH+hgt+pad*2;
  const c=cvs(W,H), x=ctx2(c);
  const ox=h*HW+pad, oy=hgt+pad;
  c._ox=ox; c._oy=oy; c._w=w; c._h=h;
  return{c,x,g:G(x,ox,oy)};
}

/* ══════════════════════════════════════════════════════════════════
   §6  الشخصيات — ريغ عظام وحركات، تُخبز في سبرايتات عند الإقلاع
   ══════════════════════════════════════════════════════════════════ */

/* عظمة مظلّلة: خط عريض بلون الأساس + خط أرفع مزاح نحو الضوء */
function bone(x,ax,ay,bx,by,w,c1,c2){
  x.lineCap='round';
  x.strokeStyle=c1;x.lineWidth=w;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();
  if(c2){x.strokeStyle=c2;x.lineWidth=w*.46;x.beginPath();
    x.moveTo(ax-w*.17,ay-w*.19);x.lineTo(bx-w*.17,by-w*.19);x.stroke();}
}
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(r*f,0,255)|0;g=clamp(g*f,0,255)|0;b=clamp(b*f,0,255)|0;
  return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};

/* وضعيات الحركة — الزوايا بالراديان، ٠ = للأسفل، موجب = للأمام */
function poseOf(st,t){
  const ph=t*TAU, P={lean:.06,bob:0,spin:0,fade:1,
    la:{t:0,s:0},lb:{t:0,s:0},aa:{u:.18,f:.42},ab:{u:-.18,f:.42},head:0,extra:0};
  if(st==='walk'||st==='run'){
    const amp=st==='run'?.92:.6, sp=st==='run'?1:1;
    P.la.t=Math.sin(ph*sp)*amp;            P.la.s=Math.max(0,-Math.sin(ph*sp+.85))*1.05;
    P.lb.t=Math.sin(ph*sp+Math.PI)*amp;    P.lb.s=Math.max(0,-Math.sin(ph*sp+Math.PI+.85))*1.05;
    P.aa.u=Math.sin(ph*sp+Math.PI)*.52;    P.aa.f=.3+Math.max(0,Math.sin(ph*sp))*.42;
    P.ab.u=Math.sin(ph*sp)*.52;            P.ab.f=.3+Math.max(0,-Math.sin(ph*sp))*.42;
    P.bob=-Math.abs(Math.sin(ph*sp))*(st==='run'?3.2:1.9);
    P.lean=st==='run'?.2:.1;
    P.head=-Math.sin(ph*sp*2)*.06;
  } else if(st==='atk'){
    /* شدّ ← ضربة ← استرجاع */
    if(t<.34){const k=t/.34;P.ab.u=lerp(.1,-1.55,k);P.ab.f=lerp(.4,1.05,k);P.lean=lerp(.06,-.16,k);}
    else if(t<.56){const k=(t-.34)/.22;P.ab.u=lerp(-1.55,1.45,k);P.ab.f=lerp(1.05,.06,k);P.lean=lerp(-.16,.34,k);}
    else{const k=(t-.56)/.44;P.ab.u=lerp(1.45,.1,k);P.ab.f=lerp(.06,.4,k);P.lean=lerp(.34,.06,k);}
    P.aa.u=-P.ab.u*.34;P.la.t=.24;P.lb.t=-.3;P.lb.s=.3;
    P.extra=t;
  } else if(st==='shoot'){
    if(t<.5){const k=t/.5;P.ab.u=lerp(.5,-.25,k);P.ab.f=lerp(.8,1.5,k);P.aa.u=-1.42;P.aa.f=.06;}
    else{const k=(t-.5)/.5;P.ab.u=lerp(-.25,.5,k);P.ab.f=lerp(1.5,.8,k);P.aa.u=-1.42+k*.2;P.aa.f=.06;}
    P.la.t=.2;P.lb.t=-.26;P.lb.s=.26;P.lean=.02;P.extra=t;
  } else if(st==='cast'){
    P.ab.u=-1.35-Math.sin(ph)*.16;P.ab.f=.5;P.aa.u=-.5;P.aa.f=.7;
    P.bob=-Math.sin(ph)*1.6;P.extra=t;
  } else if(st==='die'){
    P.spin=t*t*1.45;P.fade=1-Math.max(0,(t-.55)/.45);
    P.bob=t*t*11;P.la.t=-.5*t;P.lb.t=.55*t;P.aa.u=-1.1*t;P.ab.u=1.2*t;
  } else { /* سكون */
    P.bob=-Math.sin(ph)*.9;P.head=Math.sin(ph+.6)*.05;
    P.aa.u=.16+Math.sin(ph)*.05;P.ab.u=-.16-Math.sin(ph)*.05;
  }
  return P;
}

/* رسم شخصية بشرية كاملة في فضاء الشاشة (القدمان عند 0,0، يواجه +x) */
function drawHuman(x,d,P,S){
  const H=d.h, sk=d.pal, rb=sk.robe, rb2=shade(rb,.62), rbL=shade(rb,1.3);
  const sh=sk.skin, shD=shade(sh,.66);
  const mt=sk.metal||'#b9a06a', mtL=shade(mt,1.42), mtD=shade(mt,.55);
  x.save();
  x.globalAlpha=P.fade;
  x.translate(0,P.bob);
  if(P.spin)x.rotate(-P.spin);

  /* قياسات */
  const legT=H*.24, legS=H*.22, torso=H*.3, armU=H*.19, armF=H*.18;
  const hipY=-(legT+legS), chestY=hipY-torso, headR=H*.11;
  const lean=P.lean;
  const px=Math.sin(lean)*torso, py=-Math.cos(lean)*torso;
  const chest=[px,hipY+py];

  const pt=(ox,oy,a,L)=>[ox+Math.sin(a)*L, oy+Math.cos(a)*L];

  /* الساق الخلفية */
  const kB=pt(0,hipY,P.lb.t,legT), fB=pt(kB[0],kB[1],P.lb.t-P.lb.s,legS);
  bone(x,0,hipY,kB[0],kB[1],H*.095,shade(rb2,.8));
  bone(x,kB[0],kB[1],fB[0],fB[1],H*.078,shade(sh,.62));
  /* الظل الأرضي */
  x.globalAlpha=P.fade*.3;x.fillStyle='#160b03';
  x.beginPath();x.ellipse(0,1,H*.24,H*.07,0,0,TAU);x.fill();x.globalAlpha=P.fade;

  /* الذراع الخلفية */
  const shB=[chest[0]-H*.03,chest[1]+H*.03];
  const eB=pt(shB[0],shB[1],P.aa.u+lean,armU), hB=pt(eB[0],eB[1],P.aa.u+P.aa.f+lean,armF);
  bone(x,shB[0],shB[1],eB[0],eB[1],H*.072,rb2);
  bone(x,eB[0],eB[1],hB[0],hB[1],H*.062,shade(sh,.72));

  /* الجذع */
  x.save();
  x.beginPath();
  x.moveTo(-H*.115,hipY+2);
  x.quadraticCurveTo(chest[0]-H*.15,(hipY+chest[1])/2,chest[0]-H*.13,chest[1]);
  x.lineTo(chest[0]+H*.13,chest[1]);
  x.quadraticCurveTo(chest[0]+H*.15,(hipY+chest[1])/2,H*.115,hipY+2);
  x.closePath();
  x.fillStyle=rb;x.fill();
  const gr=x.createLinearGradient(-H*.16,chestY,H*.16,hipY);
  gr.addColorStop(0,'rgba(255,244,214,.34)');gr.addColorStop(.55,'rgba(255,240,200,0)');
  gr.addColorStop(1,'rgba(0,0,0,.42)');x.fillStyle=gr;x.fill();
  x.restore();

  /* الثوب/العباءة */
  if(d.robe!==false){
    const sway=(P.la.t-P.lb.t)*H*.1;
    x.beginPath();
    x.moveTo(chest[0]-H*.13,chest[1]+H*.06);
    x.lineTo(chest[0]+H*.13,chest[1]+H*.06);
    x.quadraticCurveTo(H*.2+sway,hipY+legT*.5,H*.23+sway*1.6,hipY+legT*.92);
    x.quadraticCurveTo(0,hipY+legT*1.16,-H*.23+sway*1.6,hipY+legT*.92);
    x.quadraticCurveTo(-H*.2+sway,hipY+legT*.5,chest[0]-H*.13,chest[1]+H*.06);
    x.closePath();
    x.fillStyle=rb;x.fill();
    const g2=x.createLinearGradient(-H*.2,chest[1],H*.2,hipY+legT);
    g2.addColorStop(0,'rgba(255,246,220,.3)');g2.addColorStop(.5,'rgba(0,0,0,.05)');
    g2.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=g2;x.fill();
  }
  /* الحزام */
  x.strokeStyle=sk.sash||'#8a3f2a';x.lineWidth=H*.055;x.lineCap='round';
  x.beginPath();x.moveTo(-H*.115,hipY-H*.01);x.lineTo(H*.115,hipY-H*.03);x.stroke();

  /* الساق الأمامية */
  const kF=pt(0,hipY,P.la.t,legT), fF=pt(kF[0],kF[1],P.la.t-P.la.s,legS);
  bone(x,0,hipY,kF[0],kF[1],H*.1,rb2,shade(rb2,1.35));
  bone(x,kF[0],kF[1],fF[0],fF[1],H*.082,sh,shade(sh,1.22));

  /* الرأس والغترة */
  const hx=chest[0]+Math.sin(lean+P.head)*headR*1.1, hy=chest[1]-headR*.92;
  bone(x,chest[0],chest[1],hx,hy+headR*.5,H*.07,shD);
  x.beginPath();x.arc(hx,hy,headR,0,TAU);x.fillStyle=sh;x.fill();
  const g3=x.createRadialGradient(hx-headR*.42,hy-headR*.5,1,hx,hy,headR*1.5);
  g3.addColorStop(0,'rgba(255,246,220,.5)');g3.addColorStop(.5,'rgba(0,0,0,0)');
  g3.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=g3;x.fill();
  /* غترة/عمامة */
  x.beginPath();
  if(d.turban){
    x.ellipse(hx,hy-headR*.5,headR*1.16,headR*.72,0,0,TAU);
    x.fillStyle=sk.head||'#e8dcc0';x.fill();
    x.beginPath();x.ellipse(hx,hy-headR*.62,headR*.86,headR*.4,0,0,TAU);
    x.fillStyle='rgba(255,255,255,.2)';x.fill();
  } else {
    x.moveTo(hx-headR*1.12,hy-headR*.24);
    x.quadraticCurveTo(hx,hy-headR*1.6,hx+headR*1.12,hy-headR*.24);
    x.quadraticCurveTo(hx+headR*1.2,hy+headR*.9,hx+headR*.5,hy+headR*1.15);
    x.lineTo(hx-headR*.62,hy+headR*1.1);
    x.quadraticCurveTo(hx-headR*1.24,hy+headR*.7,hx-headR*1.12,hy-headR*.24);
    x.closePath();
    x.fillStyle=sk.head||'#e8dcc0';x.fill();
    x.fillStyle='rgba(0,0,0,.26)';x.beginPath();
    x.moveTo(hx-headR*.2,hy+headR*.1);x.quadraticCurveTo(hx+headR*.9,hy+headR*.5,hx+headR*.5,hy+headR*1.15);
    x.lineTo(hx-headR*.62,hy+headR*1.1);x.closePath();x.fill();
    /* عِقال */
    x.strokeStyle=sk.band||'#2b2118';x.lineWidth=H*.028;
    x.beginPath();x.ellipse(hx,hy-headR*.5,headR*1.02,headR*.4,0,.15,Math.PI-.15);x.stroke();
  }
  /* العين */
  x.fillStyle='rgba(20,12,6,.8)';x.beginPath();
  x.ellipse(hx+headR*.42,hy+headR*.08,headR*.13,headR*.17,0,0,TAU);x.fill();

  /* الذراع الأمامية + السلاح */
  const shF=[chest[0]+H*.04,chest[1]+H*.04];
  const eF=pt(shF[0],shF[1],P.ab.u+lean,armU), hF=pt(eF[0],eF[1],P.ab.u+P.ab.f+lean,armF);
  bone(x,shF[0],shF[1],eF[0],eF[1],H*.078,rb,rbL);
  bone(x,eF[0],eF[1],hF[0],hF[1],H*.066,sh,shade(sh,1.2));
  if(d.weapon)d.weapon(x,hF[0],hF[1],P.ab.u+P.ab.f+lean,H,{mt,mtL,mtD,P});
  if(d.offhand)d.offhand(x,hB[0],hB[1],P.aa.u+P.aa.f+lean,H,{mt,mtL,mtD,P});
  x.restore();
}

/* ── الأسلحة ────────────────────────────────────────────────────── */
const WPN={
  saif:(x,hx,hy,a,H,o)=>{ /* سيف عربي منحنٍ */
    const L=H*.46, ex=hx+Math.sin(a)*L, ey=hy+Math.cos(a)*L;
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI);
    x.strokeStyle='#3a2a16';x.lineWidth=H*.05;x.lineCap='round';
    x.beginPath();x.moveTo(0,H*.07);x.lineTo(0,-H*.05);x.stroke();
    x.fillStyle=o.mt;x.beginPath();
    x.moveTo(-H*.028,-H*.05);x.quadraticCurveTo(H*.06,-L*.62,H*.02,-L);
    x.quadraticCurveTo(-H*.03,-L*.62,H*.028,-H*.05);x.closePath();x.fill();
    x.strokeStyle=o.mtL;x.lineWidth=H*.016;x.beginPath();
    x.moveTo(-H*.01,-H*.06);x.quadraticCurveTo(H*.05,-L*.6,H*.015,-L*.96);x.stroke();
    x.fillStyle='#c8a24a';x.fillRect(-H*.05,-H*.07,H*.1,H*.026);
    x.restore();
  },
  axe:(x,hx,hy,a,H,o)=>{
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI);
    x.strokeStyle='#5c3c1c';x.lineWidth=H*.045;x.lineCap='round';
    x.beginPath();x.moveTo(0,H*.1);x.lineTo(0,-H*.44);x.stroke();
    x.fillStyle=o.mt;x.beginPath();
    x.moveTo(0,-H*.3);x.quadraticCurveTo(H*.2,-H*.42,H*.14,-H*.5);
    x.quadraticCurveTo(H*.06,-H*.44,0,-H*.44);x.closePath();x.fill();
    x.fillStyle=o.mtL;x.beginPath();
    x.moveTo(H*.02,-H*.32);x.quadraticCurveTo(H*.17,-H*.42,H*.13,-H*.47);
    x.quadraticCurveTo(H*.07,-H*.42,H*.02,-H*.42);x.closePath();x.fill();
    x.restore();
  },
  bow:(x,hx,hy,a,H,o)=>{
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI);
    x.strokeStyle='#6b4726';x.lineWidth=H*.032;x.lineCap='round';
    x.beginPath();x.arc(0,0,H*.3,-1.15,1.15);x.stroke();
    x.strokeStyle='rgba(240,230,205,.72)';x.lineWidth=H*.012;
    const p=o.P&&o.P.extra!=null?Math.min(1,o.P.extra*2):0;
    const px=H*.3*Math.cos(1.15), py=H*.3*Math.sin(1.15);
    x.beginPath();x.moveTo(px,-py);x.lineTo(-H*.1*p,0);x.lineTo(px,py);x.stroke();
    if(p>.1){x.strokeStyle='#d8c69a';x.lineWidth=H*.02;
      x.beginPath();x.moveTo(-H*.1*p,0);x.lineTo(H*.34,0);x.stroke();}
    x.restore();
  },
  staff:(x,hx,hy,a,H,o)=>{
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI);
    x.strokeStyle='#5a4222';x.lineWidth=H*.038;x.lineCap='round';
    x.beginPath();x.moveTo(0,H*.16);x.lineTo(0,-H*.5);x.stroke();
    const t=(o.P&&o.P.extra||0);
    const gr=x.createRadialGradient(0,-H*.54,1,0,-H*.54,H*.16);
    gr.addColorStop(0,'rgba(220,210,255,.95)');gr.addColorStop(.4,'rgba(140,120,255,.7)');
    gr.addColorStop(1,'rgba(120,100,255,0)');
    x.fillStyle=gr;x.beginPath();x.arc(0,-H*.54,H*.16*(1+Math.sin(t*TAU)*.16),0,TAU);x.fill();
    x.fillStyle='#cdc2ff';x.beginPath();x.arc(0,-H*.54,H*.055,0,TAU);x.fill();
    x.restore();
  },
  skin:(x,hx,hy,a,H,o)=>{ /* قربة ماء */
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI*.9);
    x.fillStyle='#7d5a34';x.beginPath();x.ellipse(0,H*.1,H*.11,H*.15,0,0,TAU);x.fill();
    x.fillStyle='rgba(255,240,210,.24)';x.beginPath();x.ellipse(-H*.035,H*.06,H*.05,H*.07,0,0,TAU);x.fill();
    x.strokeStyle='#4a3218';x.lineWidth=H*.022;x.beginPath();x.moveTo(0,H*-.04);x.lineTo(0,H*-.09);x.stroke();
    x.restore();
  },
  lance:(x,hx,hy,a,H,o)=>{
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI);
    x.strokeStyle='#6b4726';x.lineWidth=H*.034;x.lineCap='round';
    x.beginPath();x.moveTo(0,H*.24);x.lineTo(0,-H*.56);x.stroke();
    x.fillStyle=o.mt;x.beginPath();x.moveTo(0,-H*.72);x.lineTo(H*.045,-H*.54);
    x.lineTo(0,-H*.5);x.lineTo(-H*.045,-H*.54);x.closePath();x.fill();
    x.fillStyle=o.mtL;x.beginPath();x.moveTo(0,-H*.7);x.lineTo(H*.03,-H*.55);x.lineTo(0,-H*.53);x.closePath();x.fill();
    x.restore();
  },
  shield:(x,hx,hy,a,H,o)=>{
    x.save();x.translate(hx,hy);x.rotate(-a+Math.PI*.5);
    x.fillStyle=o.mtD;x.beginPath();x.ellipse(0,0,H*.15,H*.19,0,0,TAU);x.fill();
    x.fillStyle=o.mt;x.beginPath();x.ellipse(-H*.012,-H*.014,H*.128,H*.166,0,0,TAU);x.fill();
    x.strokeStyle=o.mtL;x.lineWidth=H*.016;x.beginPath();x.ellipse(0,0,H*.085,H*.115,0,0,TAU);x.stroke();
    x.fillStyle='#c8a24a';x.beginPath();x.arc(0,0,H*.032,0,TAU);x.fill();
    x.restore();
  }
};

/* ── مخلوقات غير بشرية ─────────────────────────────────────────── */
function drawMount(x,d,P,S){
  const H=d.h, c=d.mount, body=c.body, bodyD=shade(body,.6), bodyL=shade(body,1.28);
  x.save();x.globalAlpha=P.fade;x.translate(0,P.bob*.5);
  if(P.spin)x.rotate(-P.spin*.7);
  const bw=H*.62, bh=H*.3, by=-H*.62;
  const ph=(P.la.t/.62)||0;
  /* الأرجل الخلفية */
  for(const s of[-1,1]){
    const o=s>0?0:Math.PI, k=Math.sin((P.la.t*2)+o)*.5;
    bone(x,-bw*.34,by+bh*.5,-bw*.34+Math.sin(k)*H*.2,by+bh*.5+H*.2,H*.06,bodyD);
    bone(x,-bw*.34+Math.sin(k)*H*.2,by+bh*.5+H*.2,-bw*.34+Math.sin(k*1.5)*H*.24,0,H*.05,shade(body,.5));
  }
  x.globalAlpha=P.fade*.3;x.fillStyle='#160b03';
  x.beginPath();x.ellipse(0,1,H*.44,H*.1,0,0,TAU);x.fill();x.globalAlpha=P.fade;
  /* الجسم */
  x.beginPath();x.ellipse(0,by,bw*.55,bh,0,0,TAU);x.fillStyle=body;x.fill();
  if(c.hump){x.beginPath();x.moveTo(-bw*.2,by-bh*.75);
    x.quadraticCurveTo(0,by-bh*2.1,bw*.22,by-bh*.72);x.closePath();x.fillStyle=shade(body,1.06);x.fill();}
  const gr=x.createLinearGradient(0,by-bh*1.6,0,by+bh);
  gr.addColorStop(0,'rgba(255,246,220,.36)');gr.addColorStop(.6,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.46)');
  x.fillStyle=gr;x.beginPath();x.ellipse(0,by,bw*.55,bh,0,0,TAU);x.fill();
  /* العنق والرأس */
  const nx=bw*.42, ny=by-bh*.45, hx2=nx+H*.2, hy2=ny-H*.26;
  bone(x,nx,ny,hx2,hy2,H*.11,body,bodyL);
  x.beginPath();x.ellipse(hx2+H*.05,hy2-H*.02,H*.11,H*.075,-.35,0,TAU);x.fillStyle=bodyL;x.fill();
  x.fillStyle='rgba(20,12,6,.85)';x.beginPath();x.arc(hx2+H*.06,hy2-H*.04,H*.017,0,TAU);x.fill();
  if(c.mane){x.strokeStyle=shade(body,.42);x.lineWidth=H*.05;x.lineCap='round';
    for(let i=0;i<5;i++){const t=i/4;x.beginPath();
      x.moveTo(lerp(nx,hx2,t),lerp(ny,hy2,t));
      x.lineTo(lerp(nx,hx2,t)-H*.07,lerp(ny,hy2,t)-H*.09);x.stroke();}}
  /* الذيل */
  x.strokeStyle=shade(body,.5);x.lineWidth=H*.04;x.lineCap='round';
  x.beginPath();x.moveTo(-bw*.52,by-bh*.3);
  x.quadraticCurveTo(-bw*.72,by+bh*.2,-bw*.62+Math.sin(P.la.t*3)*4,by+bh*1.1);x.stroke();
  /* الأرجل الأمامية */
  for(const s of[-1,1]){
    const o=s>0?Math.PI*.5:Math.PI*1.5, k=Math.sin((P.la.t*2)+o)*.5;
    bone(x,bw*.3,by+bh*.5,bw*.3+Math.sin(k)*H*.2,by+bh*.5+H*.2,H*.062,body,bodyL);
    bone(x,bw*.3+Math.sin(k)*H*.2,by+bh*.5+H*.2,bw*.3+Math.sin(k*1.5)*H*.24,0,H*.052,bodyD);
  }
  /* السرج والراكب */
  x.fillStyle=c.saddle||'#8a3f2a';
  x.beginPath();x.ellipse(-H*.02,by-bh*.86,bw*.24,bh*.32,0,0,TAU);x.fill();
  x.restore();
  x.save();x.translate(-H*.02,by-bh*1.0+P.bob*.5);
  const rp=Object.assign({},P);rp.la={t:.62,s:.5};rp.lb={t:.5,s:.62};rp.bob=0;rp.lean=.1;
  drawHuman(x,d.rider,rp,S);
  x.restore();
}

function drawBird(x,d,P,S){
  const H=d.h, b=d.pal.robe, bL=shade(b,1.35), bD=shade(b,.55);
  const t=P.extra||0, flap=Math.sin(P.__ph||0);
  x.save();x.globalAlpha=P.fade;
  const cy=-H*1.15+P.bob*2;
  x.globalAlpha=P.fade*.24;x.fillStyle='#160b03';
  x.beginPath();x.ellipse(0,0,H*.3,H*.09,0,0,TAU);x.fill();x.globalAlpha=P.fade;
  /* الجناح الخلفي */
  x.save();x.translate(0,cy);x.rotate(-flap*.62);
  x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-H*.5,-H*.22,-H*.95,H*.1);
  x.quadraticCurveTo(-H*.42,H*.16,0,H*.1);x.closePath();x.fillStyle=bD;x.fill();x.restore();
  /* الجسم */
  x.beginPath();x.ellipse(0,cy,H*.34,H*.2,-.15,0,TAU);x.fillStyle=b;x.fill();
  const gr=x.createLinearGradient(0,cy-H*.2,0,cy+H*.2);
  gr.addColorStop(0,'rgba(255,246,220,.42)');gr.addColorStop(1,'rgba(0,0,0,.44)');
  x.fillStyle=gr;x.fill();
  /* الرأس والمنقار */
  x.beginPath();x.arc(H*.34,cy-H*.12,H*.14,0,TAU);x.fillStyle=bL;x.fill();
  x.fillStyle='#e8b93a';x.beginPath();x.moveTo(H*.46,cy-H*.14);
  x.lineTo(H*.62,cy-H*.06);x.lineTo(H*.45,cy-H*.02);x.closePath();x.fill();
  x.fillStyle='#1a1008';x.beginPath();x.arc(H*.38,cy-H*.16,H*.026,0,TAU);x.fill();
  /* المخالب */
  x.strokeStyle='#e8b93a';x.lineWidth=H*.04;x.lineCap='round';
  for(const s of[-1,1]){x.beginPath();x.moveTo(s*H*.06,cy+H*.16);
    x.lineTo(s*H*.1,cy+H*.3+(P.__atk?H*.1:0));x.stroke();}
  /* الذيل */
  x.beginPath();x.moveTo(-H*.3,cy);x.lineTo(-H*.62,cy-H*.1);x.lineTo(-H*.6,cy+H*.12);x.closePath();
  x.fillStyle=bD;x.fill();
  /* الجناح الأمامي */
  x.save();x.translate(0,cy);x.rotate(flap*.72);
  x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-H*.46,-H*.34,-H*.9,-H*.04);
  x.quadraticCurveTo(-H*.4,H*.1,0,H*.08);x.closePath();x.fillStyle=b;x.fill();
  x.strokeStyle=bL;x.lineWidth=H*.02;
  for(let i=1;i<4;i++){x.beginPath();x.moveTo(-H*.1*i,H*.02*i);
    x.lineTo(-H*.3-H*.16*i,-H*.1);x.stroke();}
  x.restore();
  x.restore();
}

function drawScorpion(x,d,P,S){
  const H=d.h, b=d.pal.robe, bL=shade(b,1.35), bD=shade(b,.5);
  x.save();x.globalAlpha=P.fade;x.translate(0,P.bob);
  if(P.spin)x.rotate(-P.spin*.5);
  x.globalAlpha=P.fade*.32;x.fillStyle='#160b03';
  x.beginPath();x.ellipse(0,1,H*.62,H*.16,0,0,TAU);x.fill();x.globalAlpha=P.fade;
  const cy=-H*.36;
  /* الأرجل */
  x.lineCap='round';
  for(let i=0;i<4;i++){
    const px2=-H*.3+i*H*.2, k=Math.sin((P.la.t*3)+i*1.1)*.36;
    for(const s of[-1,1]){
      x.strokeStyle=s>0?bD:shade(b,.36);x.lineWidth=H*.05;
      x.beginPath();x.moveTo(px2,cy+H*.06);
      x.quadraticCurveTo(px2+s*H*.18,cy+H*.2+k*8,px2+s*H*.1+k*6,0);x.stroke();
    }
  }
  /* الذيل المقوّس */
  const tt=P.extra||0, curl=P.__atk?lerp(0,-.5,Math.sin(tt*Math.PI)):0;
  x.save();x.translate(-H*.42,cy);
  let ax2=0,ay2=0,a=-1.15+curl;
  for(let i=0;i<6;i++){
    const L=H*.16, nx=ax2+Math.cos(a)*L, ny=ay2+Math.sin(a)*L;
    bone(x,ax2,ay2,nx,ny,H*.12-i*H*.012,b,bL);
    ax2=nx;ay2=ny;a+=.42+curl*.12;
  }
  x.fillStyle='#e6e0b0';x.beginPath();
  x.moveTo(ax2,ay2);x.lineTo(ax2+Math.cos(a)*H*.19,ay2+Math.sin(a)*H*.19);
  x.lineTo(ax2+Math.cos(a+.7)*H*.08,ay2+Math.sin(a+.7)*H*.08);x.closePath();x.fill();
  x.restore();
  /* الجسم */
  x.beginPath();x.ellipse(0,cy,H*.46,H*.2,0,0,TAU);x.fillStyle=b;x.fill();
  const gr=x.createLinearGradient(0,cy-H*.24,0,cy+H*.2);
  gr.addColorStop(0,'rgba(255,246,220,.42)');gr.addColorStop(.6,'rgba(0,0,0,.06)');
  gr.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=gr;x.fill();
  for(let i=0;i<4;i++){x.strokeStyle='rgba(0,0,0,.24)';x.lineWidth=H*.02;
    x.beginPath();x.moveTo(-H*.3+i*H*.18,cy-H*.17);x.lineTo(-H*.28+i*H*.18,cy+H*.17);x.stroke();}
  /* الكمّاشات */
  for(const s of[1,-1]){
    const oy=s>0?H*.1:-H*.06, sw=P.__atk?Math.sin((P.extra||0)*TAU)*.3:0;
    x.save();x.translate(H*.42,cy+oy);x.rotate(s*.24+sw);
    bone(x,0,0,H*.24,0,H*.08,s>0?b:bD,bL);
    x.beginPath();x.moveTo(H*.24,-H*.02);
    x.quadraticCurveTo(H*.5,-H*.14,H*.56,-H*.02);
    x.quadraticCurveTo(H*.44,H*.02,H*.5,H*.1);
    x.quadraticCurveTo(H*.34,H*.1,H*.24,H*.04);x.closePath();
    x.fillStyle=s>0?bL:b;x.fill();
    x.restore();
  }
  /* العيون */
  x.fillStyle='#1a1008';
  for(const s of[-1,1]){x.beginPath();x.arc(H*.36,cy-H*.06+s*H*.05,H*.026,0,TAU);x.fill();}
  x.restore();
}

/* ══════════════════════════════════════════════════════════════════
   §6ب  خبز إطارات الشخصيات
   ══════════════════════════════════════════════════════════════════ */
const FR={walk:8, atk:6, die:5, idle:4};   /* عدد الإطارات لكل حالة */
const UNIT_SPR={};                          /* [type][variant][state] = [frames] */

function bakeUnitType(key,def,variants){
  const H=def.h, W=Math.ceil(H*2.3), Hc=Math.ceil(H*1.62+26);
  const ax=Math.round(W/2), ay=Hc-18;
  const out=[];
  for(let v=0;v<variants.length;v++){
    const d=Object.assign({},def,{pal:variants[v]});
    if(def.mount)d.rider=Object.assign({},def.rider,{pal:variants[v]});
    const st={};
    for(const s in FR){
      const n=FR[s], arr=[];
      const real=s==='atk'?(def.atkAnim||'atk'):s;
      for(let i=0;i<n;i++){
        const c=cvs(W,Hc),x=ctx2(c);
        x.translate(ax,ay);
        const P=poseOf(real,i/n);
        P.__ph=(i/n)*TAU; P.__atk=(s==='atk');
        (def.draw||drawHuman)(x,d,P,1);
        arr.push(c);
      }
      st[s]=arr;
    }
    st.ax=ax;st.ay=ay;st.w=W;st.h=Hc;
    out.push(st);
  }
  UNIT_SPR[key]=out;
}

function trim(g,u0,v0,u1,v1,h,t){ /* إفريز ذهبي عند المستويات العليا */
  if(t<2)return;
  g.box(u0,v0,u1,v1,h,h+2.2,{mat:'gold',rim:false});
}
function crenel(g,u0,v0,u1,v1,h,n,mat){ /* شرفات */
  n=n||4;mat=mat||'stone';
  for(let i=0;i<n;i++){
    const a=lerp(u0,u1,i/n), b=lerp(u0,u1,(i+.55)/n);
    g.box(a,v0,b,v0+.16,h,h+5,{mat,rim:false});
    g.box(a,v1-.16,b,v1,h,h+5,{mat,rim:false});
  }
  for(let i=0;i<n;i++){
    const a=lerp(v0,v1,i/n), b=lerp(v0,v1,(i+.55)/n);
    g.box(u0,a,u0+.16,b,h,h+5,{mat,rim:false});
    g.box(u1-.16,a,u1,b,h,h+5,{mat,rim:false});
  }
}

/* ── صيغ التوازن ───────────────────────────────────────────────── */
const gp=(b,g,L)=>b*Math.pow(g,L-1);
function bCost(k,L){const d=B[k];
  if(k==='palace')return{res:'gold',amt:Math.round(gp(2600,2.02,Math.max(1,L-1)))};
  if(k==='hut')return{res:'crystal',amt:[0,0,240,900,2200,4500][Math.min(5,S?countOf('hut'):0)]};
  return{res:d.cost.res,amt:Math.round(gp(d.cost.base,d.cost.g,L)/10)*10};}
function bTime(k,L){const d=B[k];
  if(d.instant)return 0;
  if(k==='palace')return Math.round(gp(3600,1.92,Math.max(1,L-1)));
  return Math.round(gp(d.time.base,d.time.g,L));}
function bHp(k,L){const d=B[k];return Math.round(gp(d.hp[0],d.hp[1],L));}
function bProd(k,L){const d=B[k];return d.prod?gp(d.prod.base,d.prod.g,L):0;}
function bCap(k,L){const d=B[k];return d.cap?Math.round(gp(d.cap.base,d.cap.g,L)/10)*10:0;}
function bArmy(k,L){const d=B[k];return d.army?Math.round(gp(d.army.base,d.army.g,L)):0;}
function bDps(k,L){const d=B[k];return d.def?gp(d.def.dps,d.def.g,L):0;}
function bTrapDmg(k,L){const d=B[k];return d.trap?Math.round(gp(d.trap.dmg,d.trap.g,L)):0;}
/* استهلاك الماء للصيانة في الساعة */
function bWater(k,L){
  const d=B[k];if(k==='well'||k==='cistern'||k==='hut'||k==='wall')return 0;
  const base={core:18,eco:11,mil:9,def:7,trap:2,social:5}[d.cat]||6;
  return Math.round(base*Math.pow(1.13,L-1));
}

const BSPR={};                     /* [key][tier] = canvas */
function tierOf(k,L){const m=B[k].max;if(m<=1)return 0;return clamp(Math.floor((L-1)/(m/4)),0,3);}
function bakeBuilding(k){
  const d=B[k],out=[];
  for(let t=0;t<4;t++){
    const s=spriteCanvas(d.size,d.size,d.hgt,12);
    d.draw(s.g,1,t);
    out.push(s.c);
  }
  BSPR[k]=out;
}
/* نسخة ذابلة تُخبز مرة واحدة عند نفاد الماء */
const WSPR={};
function wiltSpr(k,t){
  const key=k+'_'+t;
  if(!WSPR[key]){
    const src=BSPR[k][t],c=cvs(src.width,src.height),x=ctx2(c);
    x.filter='saturate(.3) brightness(.68)';
    x.drawImage(src,0,0);x.filter='none';
    WSPR[key]=c;
  }
  return WSPR[key];
}
/* أيقونة مصغّرة للواجهة */
const ICO={};
function cloneCv(src){const c=cvs(src.width,src.height);ctx2(c).drawImage(src,0,0);return c;}

/* ══════════════════════════════════════════════════════════════════
   §8  حالة اللعبة والاقتصاد
   ══════════════════════════════════════════════════════════════════ */
const SAVE_KEY='sands.kingdom.v1';
const CAP_OFFLINE=8*3600;         /* سقف التقدّم دون اتصال */
let S=null;                        /* حالة اللاعب */
let OCC=new Int16Array(GRID*GRID); /* خريطة الإشغال */

const occAt=(x,y)=>(x<0||y<0||x>=GRID||y>=GRID)?-2:OCC[y*GRID+x];
function rebuildOcc(){
  OCC.fill(-1);
  S.bs.forEach((b,i)=>{const s=B[b.k].size;
    for(let y=b.y;y<b.y+s;y++)for(let x=b.x;x<b.x+s;x++)
      if(x>=0&&y>=0&&x<GRID&&y<GRID)OCC[y*GRID+x]=i;});
  S.obs.forEach((o,i)=>{const s=o.s||1;
    for(let y=o.y;y<o.y+s;y++)for(let x=o.x;x<o.x+s;x++)
      if(x>=0&&y>=0&&x<GRID&&y<GRID)OCC[y*GRID+x]=-3-i;});
}
function canPlace(k,x,y,skip){
  const s=B[k].size;
  if(x<1||y<1||x+s>GRID-1||y+s>GRID-1)return false;
  for(let j=y;j<y+s;j++)for(let i=x;i<x+s;i++){
    const o=OCC[j*GRID+i];
    if(o!==-1&&o!==skip)return false;
  }
  return true;
}
const countOf=k=>S.bs.reduce((n,b)=>n+(b.k===k?1:0),0);
const limitOf=k=>(LIMITS[k]||[])[Math.min(12,S.th)]||0;
const maxLvlOf=k=>Math.min(B[k].max, k==='palace'?12:S.th);

/* ── الجوار: مضاعفات الإنتاج والمدى ────────────────────────────── */
function adjBonus(bi){
  const b=S.bs[bi],d=B[b.k];
  const out={prod:0,range:0,list:[]};
  if(!d.adj)return out;
  const s=d.size;
  for(const rule of d.adj){
    let n=0;
    for(let j=0;j<S.bs.length;j++){
      if(j===bi)continue;
      const o=S.bs[j];if(o.k!==rule.k||o.st==='build')continue;
      const os=B[o.k].size;
      /* تلامس أو تجاور بمربع واحد */
      if(b.x-1<o.x+os && o.x-1<b.x+s && b.y-1<o.y+os && o.y-1<b.y+s)n++;
    }
    if(n){
      n=Math.min(n,rule.max||1);
      if(rule.kind==='range')out.range+=rule.b*n;else out.prod+=rule.b*n;
      out.list.push({n:rule.n,v:rule.b*n,c:n});
    }
  }
  return out;
}

/* ── إجماليات الاقتصاد ─────────────────────────────────────────── */
function totals(){
  const t={cap:{water:600,gold:600,dates:600,crystal:120},prod:{water:0,gold:0,dates:0,crystal:0},
           use:0,army:0,huts:0,def:0};
  S.bs.forEach((b,i)=>{
    if(b.st==='build')return;
    const d=B[b.k];
    if(d.cap)t.cap[d.cap.res]+=bCap(b.k,b.l);
    if(d.army)t.army+=bArmy(b.k,b.l);
    if(b.k==='hut')t.huts++;
    if(d.prod){
      const a=adjBonus(i);
      t.prod[d.prod.res]+=bProd(b.k,b.l)*(1+a.prod);
    }
    t.use+=bWater(b.k,b.l);
    if(d.def)t.def+=bDps(b.k,b.l);
  });
  return t;
}
let T=null;                       /* إجماليات مخزّنة مؤقتاً */
const retotal=()=>{T=totals();};

/* حالة الذبول: نفاد الماء يوقف الإنتاج */
const wilted=()=>S.res.water<=0;

/* خطوة الاقتصاد بالثواني */
function economy(dt,mul){
  if(!T)retotal();
  mul=mul==null?1:mul;
  const hr=dt/3600;
  const dry=wilted();
  /* استهلاك الماء أولاً */
  S.res.water=Math.max(0,S.res.water-T.use*hr);
  for(const r of RES){
    if(r==='water'){
      S.res.water=Math.min(T.cap.water,S.res.water+T.prod.water*hr*mul);
      continue;
    }
    S.res[r]=Math.min(T.cap[r],S.res[r]+T.prod[r]*hr*mul*(dry?.2:1));
  }
}

/* ── الوقت والطوابير ───────────────────────────────────────────── */
const busyBuilders=()=>S.bs.filter(b=>b.st==='build'||b.st==='up').length;
const freeBuilders=()=>Math.max(0,(T?T.huts:2)-busyBuilders());
const armyUsed=()=>{let n=0;for(const k in S.army)n+=S.army[k]*U[k].house;
  for(const q of S.queue)n+=U[q.k].house;return n;};

function tickJobs(t){
  let changed=false;
  for(const b of S.bs){
    if((b.st==='build'||b.st==='up')&&t>=b.t1){
      const wasUp=b.st==='up';
      if(wasUp)b.l++;
      b.st='ok';b.hp=bHp(b.k,b.l);
      changed=true;
      if(b.k==='palace')unlockCheck();
      toast((wasUp?'اكتملت ترقية ':'اكتمل بناء ')+B[b.k].name,'good');
      gainXp(Math.round(Math.sqrt(bTime(b.k,b.l)||60)*2));
    }
  }
  /* طابور التدريب */
  if(S.queue.length){
    const q=S.queue[0];
    if(t>=q.t1){
      S.army[q.k]=(S.army[q.k]||0)+1;
      S.queue.shift();
      if(S.queue.length){const nx=S.queue[0];nx.t1=t+trainTime(nx.k);}
      changed=true;
    }
  }
  /* المختبر */
  if(S.labJob&&t>=S.labJob.t1){
    S.lab[S.labJob.k]=(S.lab[S.labJob.k]||1)+1;
    toast('اكتملت ترقية '+U[S.labJob.k].name+' إلى مستوى '+ad(S.lab[S.labJob.k]),'good');
    S.labJob=null;changed=true;
  }
  /* عودة الأبطال */
  for(const k in S.heroes){const h=S.heroes[k];
    if(h.rest&&t>=h.rest){h.rest=0;changed=true;}}
  if(changed)retotal();
  return changed;
}
function trainTime(k){
  const drills=S.bs.filter(b=>b.k==='drill'&&b.st!=='build');
  let cut=0;for(const d of drills)cut+=.06+.012*d.l;
  return U[k].train*Math.max(.35,1-Math.min(.55,cut));
}
function gainXp(n){S.xp+=n;const need=l=>Math.round(220*Math.pow(1.28,l-1));
  let lv=1,rem=S.xp;while(rem>=need(lv)&&lv<200){rem-=need(lv);lv++;}
  S.level=lv;S.xpIn=rem;S.xpNeed=need(lv);}
function unlockCheck(){const p=S.bs.find(b=>b.k==='palace');if(p&&p.st==='ok')S.th=p.l;retotal();}

/* ── التكلفة والدفع ────────────────────────────────────────────── */
const afford=(res,amt)=>S.res[res]>=amt;
function pay(res,amt){if(!afford(res,amt))return false;S.res[res]-=amt;return true;}

/* ── الحفظ ─────────────────────────────────────────────────────── */
function save(){
  try{
    S.lastTick=Date.now();
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const s=JSON.parse(raw);
    if(!s||!s.v)return null;
    return migrate(s);
  }catch(e){return null;}
}
function migrate(s){
  s.obs=s.obs||[];s.raids=s.raids||[];s.lab=s.lab||{};s.heroes=s.heroes||{};
  s.campaign=s.campaign||[];s.queue=s.queue||[];s.army=s.army||{};
  s.settings=s.settings||{sfx:true,fps:false};
  return s;
}

/* ══════════════════════════════════════════════════════════════════
   §9  العالم — التوليد، الأرض المخبوزة، الكاميرا

const OBS={
  palm:{n:'نخلة يابسة',s:1,res:'dates',amt:220,t:35},
  rock:{n:'صخرة',s:1,res:'gold',amt:180,t:30},

};
function newGame(name){
  const seed=hashStr(name+'|'+Date.now());
  const r=rng(seed);
  const s={v:1,pid:'p'+(seed>>>0).toString(36)+Math.floor(r()*1e6).toString(36),

  const C=Math.floor(GRID/2);
  const put=(k,x,y,l)=>s.bs.push({k,l:l||1,x,y,st:'ok',t0:0,t1:0,hp:bHp(k,l||1)});
  put('palace',C-2,C-2,1);

  put('cistern',C+3,C+2,1);
  put('vault',C-6,C+2,1);
  put('granary',C-6,C-5,1);
  put('barracks',C+3,C-6,1);
  put('camp',C-2,C-8,1);
  put('tower',C-4,C-4,1);
  put('tower',C+2,C+2,1);
  put('hut',C-8,C-1,1);
  put('hut',C+6,C-1,1);
  /* عوائق متناثرة */

/* ── الأرض المخبوزة ────────────────────────────────────────────── */
let GROUND=null, GOX=0, GOY=0;
function bakeGround(){
  const pad=120;
  const W=GRID*TW+pad*2, H=GRID*TH+pad*2;
  GOX=GRID*HW+pad; GOY=pad;
  const c=cvs(W,H), x=ctx2(c), g=G(x,GOX,GOY);
  /* خلفية صحراء بعيدة */
  const bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#241708');bg.addColorStop(.5,'#3a2610');bg.addColorStop(1,'#1a1006');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  /* هالة خارج الحدود */
  const D=[g.P(0,0,0),g.P(GRID,0,0),g.P(GRID,GRID,0),g.P(0,GRID,0)];
  x.save();
  x.beginPath();x.moveTo(D[0][0],D[0][1]);for(let i=1;i<4;i++)x.lineTo(D[i][0],D[i][1]);x.closePath();
  x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=90;x.fillStyle='#000';x.fill();x.restore();
  /* أرض الرمال */
  x.save();
  x.beginPath();x.moveTo(D[0][0],D[0][1]);for(let i=1;i<4;i++)x.lineTo(D[i][0],D[i][1]);x.closePath();
  x.clip();
  x.fillStyle=PAT.sand;x.fillRect(0,0,W,H);
  /* تدرّج ضوئي عام */
  const lg=x.createLinearGradient(GOX-GRID*HW,GOY,GOX+GRID*HW,GOY+GRID*TH);
  lg.addColorStop(0,'rgba(255,236,196,.18)');lg.addColorStop(.55,'rgba(0,0,0,0)');
  lg.addColorStop(1,'rgba(20,10,2,.4)');
  x.fillStyle=lg;x.fillRect(0,0,W,H);
  /* كثبان ناعمة */
  const r=rng(4242);
  for(let i=0;i<26;i++){
    const u=r()*GRID,v=r()*GRID,rr=(2+r()*5);
    const c2=g.P(u,v,0);
    const gr=x.createRadialGradient(c2[0],c2[1]-rr*4,1,c2[0],c2[1],rr*TW*.5);
    const dark=r()>.5;
    gr.addColorStop(0,dark?'rgba(78,52,24,.2)':'rgba(255,238,200,.16)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr;x.beginPath();
    x.ellipse(c2[0],c2[1],rr*TW*.5,rr*TH*.5,0,0,TAU);x.fill();
  }
  /* شبكة خفيفة */
  x.strokeStyle='rgba(255,232,190,.026)';x.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    let a=g.P(i,0,0),b=g.P(i,GRID,0);
    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();
    a=g.P(0,i,0);b=g.P(GRID,i,0);
    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();
  }
  /* حافة الرمال */
  x.restore();
  x.strokeStyle='rgba(255,220,160,.2)';x.lineWidth=2;
  x.beginPath();x.moveTo(D[0][0],D[0][1]);for(let i=1;i<4;i++)x.lineTo(D[i][0],D[i][1]);x.closePath();x.stroke();
  GROUND=c;
}

/* ── الكاميرا ──────────────────────────────────────────────────── */
const cam={x:0,y:GRID*HH,z:.9,tz:.9};
let VW=0,VH=0,DPR=1;
const cvEl=$('#cv'), CX=cvEl.getContext('2d');
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);

window.addEventListener('resize',resize);
const s2w=(sx,sy)=>({x:(sx-VW/2)/cam.z+cam.x, y:(sy-VH/2)/cam.z+cam.y});
const w2s=(wx,wy)=>({x:(wx-cam.x)*cam.z+VW/2, y:(wy-cam.y)*cam.z+VH/2});
function screenToGrid(sx,sy){const w=s2w(sx,sy);const g=unIso(w.x,w.y);
  return{x:Math.floor(g.gx),y:Math.floor(g.gy),fx:g.gx,fy:g.gy};}
function clampCam(){

const OSPR={};

        x.fillStyle='rgba(34,20,8,.78)';

      } else {
